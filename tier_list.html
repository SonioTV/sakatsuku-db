<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ティア表メーカー | サカつく2026 DB</title>
  <style>
:root{
  --bg:#0f172a;
  --panel:#111827;
  --line:#334155;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --accent:#22c55e;
  --danger:#ef4444;
  --shadow:0 10px 24px rgba(0,0,0,.24);
  --card-w:70px;
  --label-w:46px;
  --gap:4px;
}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#0b1120 0%,#0f172a 100%);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}
    .page{
      max-width:500px;
      margin:0 auto;
      padding:10px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
      flex-wrap:wrap;
    }
    .title-wrap h1{
      margin:0;
      font-size:22px;
      line-height:1.15;
      letter-spacing:.02em;
    }
    .title-wrap p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:11px;
    }
    .back-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:0 10px;
      border-radius:10px;
      border:1px solid #4b5563;
      background:#111827;
      font-weight:700;
      font-size:12px;
      box-shadow:var(--shadow);
    }

    .controls{
      display:grid;
      grid-template-columns:1.1fr 0.85fr 0.85fr 1.1fr auto auto auto;
      gap:8px;
      padding:10px;
      border:1px solid var(--line);
      background:rgba(17,24,39,.92);
      border-radius:14px;
      box-shadow:var(--shadow);
      margin-bottom:10px;
    }
    .field{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }
    .field label{
      font-size:11px;
      color:var(--muted);
      font-weight:700;
    }
    .field input,
    .field select{
      width:100%;
      height:34px;
      border-radius:10px;
      border:1px solid #475569;
      background:#0f172a;
      color:var(--text);
      padding:0 10px;
      font-size:12px;
    }
    .btn{
      height:34px;
      border:none;
      border-radius:10px;
      padding:0 10px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:var(--shadow);
    }
    .btn-main{background:var(--accent); color:#052e16;}
    .btn-sub{background:#1f2937; color:var(--text); border:1px solid #475569;}
    .btn-danger{background:#7f1d1d; color:#fee2e2; border:1px solid #b91c1c;}

    .stack{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .panel{
      border:1px solid var(--line);
      background:rgba(17,24,39,.92);
      border-radius:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px 12px;
      border-bottom:1px solid rgba(71,85,105,.7);
    }
    .panel-head h2{
      margin:0;
      font-size:15px;
    }
    .panel-head .sub{
      color:var(--muted);
      font-size:11px;
      font-weight:700;
    }

    .board-wrap{
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
.tier-zone{
  position:relative;
  min-height:70px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
  padding-left:calc(var(--label-w) + 5px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015)),
        radial-gradient(circle at top left, rgba(255,255,255,.06), transparent 28%);
    }
    .tier-zone[data-tier="S"]{background-color:rgba(127,29,29,.55)}
    .tier-zone[data-tier="A"]{background-color:rgba(133,77,14,.52)}
    .tier-zone[data-tier="B"]{background-color:rgba(20,83,45,.52)}
    .tier-zone[data-tier="C"]{background-color:rgba(30,64,175,.45)}
    .tier-label{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:var(--label-w);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      border-right:1px solid rgba(255,255,255,.12);
      background:rgba(15,23,42,.52);
      backdrop-filter:blur(4px);
    }
    .tier-label .grade{
      font-size:24px;
      line-height:1;
      font-weight:900;
    }
    .tier-label .count{
      margin-top:6px;
      font-size:10px;
      color:#e2e8f0;
      font-weight:800;
    }
.tier-canvas{
  min-height:70px;
  padding:1px;
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:1px;
}

    .pool-wrap{
      padding:8px;
      overflow-x:auto;
      overflow-y:hidden;
      background:
        linear-gradient(180deg, rgba(34,197,94,.05), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    }
    .pool-row{
      display:flex;
      gap:var(--gap);
      align-items:flex-start;
      min-height:86px;
      width:max-content;
      min-width:100%;
    }

    .empty-note{
      padding:18px 8px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    .player-card{
      width:var(--card-w);
      flex:0 0 var(--card-w);
      user-select:none;
      touch-action:none;
      cursor:grab;
      line-height:0;
    }
    .player-card.dragging{
      cursor:grabbing;
      z-index:9999;
      box-shadow:0 18px 48px rgba(0,0,0,.45);
    }
    .player-card img{
      display:block;
      width:100%;
      height:auto;
      border-radius:6px;
      border:1px solid rgba(255,255,255,.16);
      background:#0f172a;
      box-shadow:0 4px 10px rgba(0,0,0,.22);
      pointer-events:none;
    }

    .drop-highlight{
      outline:2px dashed rgba(255,255,255,.55);
      outline-offset:-4px;
    }

    .footer-note{
      margin-top:10px;
      color:var(--muted);
      font-size:11px;
      line-height:1.6;
      text-align:right;
    }

    .capture-mode .controls,
    .capture-mode .pool-panel,
    .capture-mode .back-btn,
    .capture-mode .footer-note{
      display:none !important;
    }
    .capture-mode .page{
      max-width:1120px;
      padding:8px;
    }
    .capture-mode .topbar{
      margin-bottom:6px;
      justify-content:center;
    }
    .capture-mode .title-wrap{
      text-align:center;
    }
    .capture-mode .panel{
      background:transparent;
      border:none;
      box-shadow:none;
    }
    .capture-mode .panel-head{
      display:none;
    }
    .capture-mode .board-wrap{
      padding:0;
    }

    @media (max-width:1100px){
      .controls{
        grid-template-columns:1fr 1fr 1fr 1fr;
      }
    }
@media (max-width:760px){
  :root{
    --card-w:52px;
    --label-w:40px;
    --gap:4px;
  }
  .page{padding:8px}
  .controls{
    grid-template-columns:1fr 1fr;
  }
  .title-wrap h1{
    font-size:18px;
  }
  .title-wrap p{
    font-size:10px;
  }
  .panel-head h2{
    font-size:13px;
  }
  .tier-zone{
    min-height:57px;
  }
  .tier-canvas{
    min-height:57px;
    padding:1px;
  }
  .tier-label .grade{
    font-size:18px;
  }
  .pool-row{
    min-height:62px;
  }
}
    @media (max-width:520px){
      .controls{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="title-wrap">
        <h1>サカつく2026 ティア表メーカー</h1>
        <p>ドラッグで S / A / B / C に配置でき、ティア内は左から自動整列されます。（スクショモードはリロードで元画面に戻ります）</p>
      </div>
      <a href="index.html" class="back-btn">← サイトに戻る</a>
    </div>

    <div class="controls">
      <div class="field">
        <label for="keywordInput">選手名検索</label>
        <input id="keywordInput" type="text" placeholder="例：ロナウド、メッシ" />
      </div>
      <div class="field">
        <label for="policySelect">ポリシー</label>
        <select id="policySelect">
          <option value="">全て</option>
        </select>
      </div>
      <div class="field">
        <label for="positionSelect">ポジション</label>
        <select id="positionSelect">
          <option value="">全て</option>
        </select>
      </div>
      <div class="field">
        <label for="placeSelect">入手場所</label>
        <select id="placeSelect">
          <option value="">全て</option>
        </select>
      </div>
      <button id="resetFiltersBtn" class="btn btn-sub" type="button">絞り込み解除</button>
      <button id="captureBtn" class="btn btn-main" type="button">スクショモード</button>
      <button id="clearSaveBtn" class="btn btn-danger" type="button">最初からやり直す</button>
    </div>

    <div class="stack">
      <section class="panel pool-panel">
        <div class="panel-head">
          <div>
            <h2>未配置選手※横スクロールできます※</h2>
          </div>
          <div class="sub"><span id="poolCount">0</span>人</div>
        </div>
        <div id="poolWrap" class="pool-wrap" data-drop-zone="pool">
          <div id="poolRow" class="pool-row"></div>
          <div id="poolEmpty" class="empty-note" style="display:none;">絞り込み条件に一致する未配置選手はいません。</div>
        </div>
      </section>

      <section class="panel board-panel">
        <div class="panel-head">
          <div>
            <h2>ティア表</h2>
            <div class="sub">ドラッグで移動 / 各ティア内は左から自動整列</div>
          </div>
        </div>
        <div class="board-wrap">
          <div class="tier-zone" data-drop-zone="S" data-tier="S">
            <div class="tier-label"><div class="grade">S</div><div class="count" id="count-S">0人</div></div>
            <div class="tier-canvas" id="canvas-S"></div>
          </div>
          <div class="tier-zone" data-drop-zone="A" data-tier="A">
            <div class="tier-label"><div class="grade">A</div><div class="count" id="count-A">0人</div></div>
            <div class="tier-canvas" id="canvas-A"></div>
          </div>
          <div class="tier-zone" data-drop-zone="B" data-tier="B">
            <div class="tier-label"><div class="grade">B</div><div class="count" id="count-B">0人</div></div>
            <div class="tier-canvas" id="canvas-B"></div>
          </div>
          <div class="tier-zone" data-drop-zone="C" data-tier="C">
            <div class="tier-label"><div class="grade">C</div><div class="count" id="count-C">0人</div></div>
            <div class="tier-canvas" id="canvas-C"></div>
          </div>
        </div>
      </section>
    </div>

  </div>

  <script>
    (() => {
      const STORAGE_KEY = "sakatsuku2026_tier_list_v3";
      const IMAGE_BASE = "img/players/";
      const TIERS = ["S", "A", "B", "C"];

      const state = {
        players: [],
        placement: {},
        filter: {
          keyword: "",
          policy: "",
          position: "",
          acquisitionPlace: ""
        },
        dragging: null,
        captureMode: false
      };

      const els = {
        keywordInput: document.getElementById("keywordInput"),
        policySelect: document.getElementById("policySelect"),
        positionSelect: document.getElementById("positionSelect"),
        placeSelect: document.getElementById("placeSelect"),
        poolRow: document.getElementById("poolRow"),
        poolWrap: document.getElementById("poolWrap"),
        poolEmpty: document.getElementById("poolEmpty"),
        poolCount: document.getElementById("poolCount"),
        resetFiltersBtn: document.getElementById("resetFiltersBtn"),
        captureBtn: document.getElementById("captureBtn"),
        clearSaveBtn: document.getElementById("clearSaveBtn"),
        canvases: {
          S: document.getElementById("canvas-S"),
          A: document.getElementById("canvas-A"),
          B: document.getElementById("canvas-B"),
          C: document.getElementById("canvas-C")
        },
        counts: {
          S: document.getElementById("count-S"),
          A: document.getElementById("count-A"),
          B: document.getElementById("count-B"),
          C: document.getElementById("count-C")
        }
      };

      function normalizePlayer(player) {
        return {
          player_id: player.player_id || player.playerId || "",
          name: player.name || "",
          policy: player.policy || "",
          mainPosition: player.mainPosition || "",
          acquisitionPlace: player.acquisitionPlace || ""
        };
      }

      function loadPlacement() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          if (!parsed || typeof parsed !== "object") return {};
          return parsed;
        } catch {
          return {};
        }
      }

      function savePlacement() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.placement));
      }

function ensurePlacement(playerId) {
  if (!state.placement[playerId]) {
    state.placement[playerId] = { zone: "pool", order: 999999 };
  }
  if (typeof state.placement[playerId].order !== "number") {
    state.placement[playerId].order = 999999;
  }
  return state.placement[playerId];
}

function matchesFilters(player) {
  const keyword = state.filter.keyword.trim().toLowerCase();

  if (keyword && !player.name.toLowerCase().includes(keyword)) return false;
  if (state.filter.policy && player.policy !== state.filter.policy) return false;
  if (state.filter.position && player.mainPosition !== state.filter.position) return false;
  if (state.filter.acquisitionPlace && player.acquisitionPlace !== state.filter.acquisitionPlace) return false;

  return true;
}

function getZonePlayers(zone) {
  return state.players
    .filter((p) => {
      const placement = ensurePlacement(p.player_id);
      if (placement.zone !== zone) return false;
      return matchesFilters(p);
    })
    .sort((a, b) => {
      const pa = ensurePlacement(a.player_id);
      const pb = ensurePlacement(b.player_id);
      return pa.order - pb.order;
    });
}

function getVisiblePoolPlayers() {
  return state.players
    .filter((p) => {
      const placement = ensurePlacement(p.player_id);
      if (placement.zone !== "pool") return false;
      return matchesFilters(p);
    })
    .sort((a, b) => {
      const pa = ensurePlacement(a.player_id);
      const pb = ensurePlacement(b.player_id);
      return pa.order - pb.order;
    });
}

      function createCard(player) {
        const card = document.createElement("div");
        card.className = "player-card";
        card.dataset.playerId = player.player_id;
        card.innerHTML = `<img src="${IMAGE_BASE}${player.player_id}.png" alt="${escapeHtml(player.name)}" loading="lazy">`;
        card.addEventListener("pointerdown", startDrag);
        return card;
      }

      function renderPool() {
        const players = getVisiblePoolPlayers();
        els.poolRow.innerHTML = "";
        players.forEach((player) => {
          els.poolRow.appendChild(createCard(player));
        });
        els.poolCount.textContent = String(players.length);
        els.poolEmpty.style.display = players.length ? "none" : "block";
      }

      function renderTiers() {
        TIERS.forEach((tier) => {
          const canvas = els.canvases[tier];
          const players = getZonePlayers(tier);
          canvas.innerHTML = "";
          players.forEach((player) => {
            canvas.appendChild(createCard(player));
          });
          els.counts[tier].textContent = `${players.length}人`;
        });
      }

      function renderAll() {
        renderPool();
        renderTiers();
      }

      function populateFilters() {
        const policies = [...new Set(state.players.map(p => p.policy).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
        const positions = [...new Set(state.players.map(p => p.mainPosition).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
        const places = [...new Set(state.players.map(p => p.acquisitionPlace).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));

        for (const policy of policies) {
          const opt = document.createElement("option");
          opt.value = policy;
          opt.textContent = policy;
          els.policySelect.appendChild(opt);
        }
        for (const position of positions) {
          const opt = document.createElement("option");
          opt.value = position;
          opt.textContent = position;
          els.positionSelect.appendChild(opt);
        }
        for (const place of places) {
          const opt = document.createElement("option");
          opt.value = place;
          opt.textContent = place;
          els.placeSelect.appendChild(opt);
        }
      }

function getNextOrder(zone) {
  const orders = state.players
    .map((p) => ensurePlacement(p.player_id))
    .filter((pl) => pl.zone === zone)
    .map((pl) => pl.order);

  return orders.length ? Math.max(...orders) + 1 : 0;
}

function normalizeZoneOrder(zone) {
  const zonePlayers = state.players
    .filter((p) => ensurePlacement(p.player_id).zone === zone)
    .sort((a, b) => ensurePlacement(a.player_id).order - ensurePlacement(b.player_id).order);

  zonePlayers.forEach((player, index) => {
    ensurePlacement(player.player_id).order = index;
  });
}

function reorderWithinZone(playerId, zone, clientX, clientY) {
  const container = zone === "pool" ? els.poolRow : els.canvases[zone];
  const cards = [...container.querySelectorAll(".player-card")]
    .filter((card) => card.dataset.playerId !== playerId);

  let insertIndex = cards.length;

  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    const beforeThisCard =
      clientY < rect.top + rect.height ||
      (clientY <= rect.bottom && clientX < rect.left + rect.width / 2);

    if (beforeThisCard) {
      insertIndex = i;
      break;
    }
  }

  const movingPlayer = state.players.find((p) => p.player_id === playerId);
  const zonePlayers = state.players
    .filter((p) => ensurePlacement(p.player_id).zone === zone && p.player_id !== playerId)
    .sort((a, b) => ensurePlacement(a.player_id).order - ensurePlacement(b.player_id).order);

  zonePlayers.splice(insertIndex, 0, movingPlayer);

  zonePlayers.forEach((player, index) => {
    const placement = ensurePlacement(player.player_id);
    placement.zone = zone;
    placement.order = index;
  });
}

function moveToZone(playerId, zone) {
  const placement = ensurePlacement(playerId);
  placement.zone = zone;
  placement.order = getNextOrder(zone);
  normalizeZoneOrder(zone);
  savePlacement();
  renderAll();
}

      function clearDropHighlights() {
        document.querySelectorAll("[data-drop-zone]").forEach(el => el.classList.remove("drop-highlight"));
      }

      function getDropZone(clientX, clientY) {
        const targets = document.elementsFromPoint(clientX, clientY);
        return targets.find(el => el?.dataset?.dropZone);
      }

      function startDrag(event) {
        const card = event.currentTarget;
        const playerId = card.dataset.playerId;
        const rect = card.getBoundingClientRect();
        const offsetX = event.clientX - rect.left;
        const offsetY = event.clientY - rect.top;
        const ghost = card.cloneNode(true);

        ghost.classList.add("dragging");
        ghost.style.position = "fixed";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        ghost.style.width = rect.width + "px";
        ghost.style.zIndex = "9999";
        document.body.appendChild(ghost);

        state.dragging = { playerId, ghost, offsetX, offsetY };
        updateGhost(event.clientX, event.clientY);

        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp, { once: true });
      }

      function updateGhost(clientX, clientY) {
        if (!state.dragging) return;
        const { ghost, offsetX, offsetY } = state.dragging;
        ghost.style.left = (clientX - offsetX) + "px";
        ghost.style.top = (clientY - offsetY) + "px";
      }

      function onPointerMove(event) {
        updateGhost(event.clientX, event.clientY);
        clearDropHighlights();
        const zone = getDropZone(event.clientX, event.clientY);
        if (zone) zone.classList.add("drop-highlight");
      }

function onPointerUp(event) {
  document.removeEventListener("pointermove", onPointerMove);
  clearDropHighlights();

  if (!state.dragging) return;
  const { playerId, ghost } = state.dragging;
  const zone = getDropZone(event.clientX, event.clientY);

  ghost.remove();
  state.dragging = null;

  if (!zone) return;

  const dropZone = zone.dataset.dropZone;
  const currentZone = ensurePlacement(playerId).zone;

  if (dropZone === "pool") {
    if (currentZone !== "pool") {
      ensurePlacement(playerId).zone = "pool";
      ensurePlacement(playerId).order = getNextOrder("pool");
    }
    reorderWithinZone(playerId, "pool", event.clientX, event.clientY);
    normalizeZoneOrder("pool");
    if (currentZone !== "pool" && TIERS.includes(currentZone)) {
      normalizeZoneOrder(currentZone);
    }
    savePlacement();
    renderAll();
    return;
  }

  if (TIERS.includes(dropZone)) {
    if (currentZone !== dropZone) {
      ensurePlacement(playerId).zone = dropZone;
      ensurePlacement(playerId).order = getNextOrder(dropZone);
    }
    reorderWithinZone(playerId, dropZone, event.clientX, event.clientY);
    normalizeZoneOrder(dropZone);

    if (currentZone !== dropZone && currentZone === "pool") {
      normalizeZoneOrder("pool");
    }
    if (currentZone !== dropZone && TIERS.includes(currentZone)) {
      normalizeZoneOrder(currentZone);
    }

    savePlacement();
    renderAll();
  }
}

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function bindEvents() {
els.keywordInput.addEventListener("input", (e) => {
  state.filter.keyword = e.target.value || "";
  renderAll();
});
els.policySelect.addEventListener("change", (e) => {
  state.filter.policy = e.target.value || "";
  console.log("selected policy:", state.filter.policy);
  console.log(
    "pool players after filter:",
    getVisiblePoolPlayers().map(p => `${p.name}:${p.policy}`)
  );
  renderAll();
});
els.positionSelect.addEventListener("change", (e) => {
  state.filter.position = e.target.value || "";
  renderAll();
});

els.placeSelect.addEventListener("change", (e) => {
  state.filter.acquisitionPlace = e.target.value || "";
  renderAll();
});

els.resetFiltersBtn.addEventListener("click", () => {
  state.filter.keyword = "";
  state.filter.policy = "";
  state.filter.position = "";
  state.filter.acquisitionPlace = "";
  els.keywordInput.value = "";
  els.policySelect.value = "";
  els.positionSelect.value = "";
  els.placeSelect.value = "";
  renderAll();
});
        els.captureBtn.addEventListener("click", () => {
          state.captureMode = !state.captureMode;
          document.body.classList.toggle("capture-mode", state.captureMode);
          els.captureBtn.textContent = state.captureMode ? "通常表示に戻す" : "スクショモード";
        });
els.clearSaveBtn.addEventListener("click", () => {
  const ok = confirm("保存済みのティア配置を削除します。よろしいですか？");
  if (!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  state.placement = {};
  state.players.forEach((player, index) => {
    state.placement[player.player_id] = { zone: "pool", order: index };
  });
  renderAll();
});
      }

      function checkImageExists(playerId) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = `${IMAGE_BASE}${playerId}.png`;
        });
      }

      async function filterPlayersWithImages(players) {
        const checks = await Promise.all(
          players.map(async (player) => ({
            player,
            ok: await checkImageExists(player.player_id)
          }))
        );
        return checks.filter(item => item.ok).map(item => item.player);
      }

      async function init() {
        try {
          const res = await fetch("players.json", { cache: "no-store" });
          if (!res.ok) throw new Error("players.json の読み込みに失敗しました。");
          const json = await res.json();

          const loadedPlayers = (Array.isArray(json) ? json : [])
            .map(normalizePlayer)
            .filter(p => p.player_id)
            .sort((a, b) => a.player_id.localeCompare(b.player_id, "ja"));

          state.players = await filterPlayersWithImages(loadedPlayers);

state.placement = loadPlacement();
const validIds = new Set(state.players.map(p => p.player_id));
state.placement = Object.fromEntries(
  Object.entries(state.placement).filter(([playerId]) => validIds.has(playerId))
);

state.players.forEach((player, index) => {
  const placement = ensurePlacement(player.player_id);
  if (placement.zone === "pool" && placement.order === 999999) {
    placement.order = index;
  }
});

normalizeZoneOrder("pool");
TIERS.forEach(normalizeZoneOrder);

populateFilters();
bindEvents();
renderAll();

        } catch (error) {
          console.error(error);
          document.querySelector(".page").innerHTML = `
            <div style="max-width:760px;margin:60px auto;padding:24px;border:1px solid #7f1d1d;background:#111827;border-radius:16px;">
              <h1 style="margin-top:0;">読み込みエラー</h1>
              <p>players.json を読み込めませんでした。</p>
              <p style="color:#94a3b8;">このHTMLと同じ階層に players.json があるか確認してください。</p>
            </div>
          `;
        }
      }

      init();
    })();
  </script>
</body>
</html>
