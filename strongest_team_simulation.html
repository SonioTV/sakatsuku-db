<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>最強チームシミュレーション（サンプル）</title>
  <style>
    :root{
      --bg:#0b1220; --card:#0f1a2e; --line:#1f3356; --txt:#e9f1ff; --mut:#9fb4d9;
      --acc:#56a4ff; --good:#54d18a; --bad:#ff6b6b;
    }
    html,body{margin:0;background:linear-gradient(180deg,#081025,#071022);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
    .wrap{max-width:420px;margin:0 auto;padding:18px 14px 60px;}
    h1{font-size:18px;margin:0 0 10px;font-weight:900;letter-spacing:.02em}
    .sub{color:var(--mut);font-size:12px;line-height:1.6;margin:0 0 14px}
    .card{background:rgba(15,26,46,.92);border:1px solid rgba(31,51,86,.9);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px}
    .ctrl{display:grid;grid-template-columns:1fr;gap:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{font-size:12px;color:var(--mut);font-weight:800}
    select,input[type="text"]{background:#0b1730;border:1px solid rgba(31,51,86,.9);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:13px;outline:none}
    select{min-width:260px;max-width:100%}
    input[type="text"]{width:min(360px,100%)}
    .pill{display:inline-flex;align-items:center;gap:8px;background:#0b1730;border:1px solid rgba(31,51,86,.9);border-radius:999px;padding:8px 12px}
    .pill input{margin:0}
    .btn{background:linear-gradient(180deg,#2a87ff,#2b6ad8);border:none;border-radius:12px;color:#fff;font-weight:900;padding:10px 14px;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .mini{font-size:11px;color:var(--mut)}
    .err{color:var(--bad);font-weight:900}
    .ok{color:var(--good);font-weight:900}
    .grid{margin-top:12px;border-radius:16px;border:1px solid rgba(31,51,86,.9)}
    table{border-collapse:separate;border-spacing:0;width:100%;background:rgba(11,23,48,.6)}
    thead th{position:sticky;top:0;background:rgba(11,23,48,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(31,51,86,.9);font-size:12px;color:var(--mut);padding:6px 8px;text-align:left}
    tbody td{border-bottom:1px solid rgba(31,51,86,.55);padding:6px 8px;font-size:13px;vertical-align:top}
    tbody tr:last-child td{border-bottom:none}
    .pos{font-weight:900;letter-spacing:.04em}
    .link{color:var(--acc);font-weight:900;text-decoration:none;white-space:nowrap}
    .link:hover{text-decoration:underline}
    .mut{color:var(--mut)}
    .hit{color:var(--good);font-weight:1000}
    .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(31,51,86,.9);background:#0b1730;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mut);white-space:nowrap}
    .two{display:flex;flex-direction:column;gap:4px}
    .v{font-weight:900}
    .note{margin-top:10px;color:var(--mut);font-size:12px;line-height:1.6}
    /* モーダル */
  .modalBack{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    z-index:9999;
  }
  .modalBack.show{ display:flex; }
  .modal{
    width:min(520px, 96vw);
    background:#fff;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modalHead{
    padding:14px 16px;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .modalHead .ttl{ font-size:18px; font-weight:900; line-height:1.2; }
  .modalHead .subttl{ font-size:12px; font-weight:700; opacity:.85; margin-top:4px; }
  .modalHead button{
    border:2px solid rgba(255,255,255,.25);
    background:transparent;
    color:#fff;
    border-radius:12px;
    width:42px;
    height:42px;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modalBody{ padding:14px 16px 18px; max-height:65vh; overflow:auto; }
  .modalBody .mLine{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #ececec; }
  .modalBody .mLine:last-child{ border-bottom:none; }
  .modalBody .mKey{ flex:0 0 120px; min-width:120px; color:#666; font-weight:700; }
  .modalBody .mVal{ flex:1; min-width:0; color:#111; font-weight:800; word-break:break-word; }

/* ---- Fix: iPhone16 table overflow (ellipsis) ---- */
.results table { table-layout: fixed; width: 100%; }
.results th, .results td { overflow: hidden; text-overflow: ellipsis; }
.results td a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Fix: Player detail modal layout (match index.html) ---- */
.modalBack{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 9999;
}
.modalBack.show{ display:flex; }

.modal{
  width: min(92vw, 560px);
  max-height: min(78vh, 560px);
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}
.modalHead{
  background:#111;
  color:#fff;
  padding:14px 14px 12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.modalTitle{
  font-size:18px;
  font-weight:800;
  line-height:1.2;
}
.modalSub{
  margin-top:4px;
  font-size:13px;
  opacity:.85;
  line-height:1.2;
}
.modalClose{
  appearance:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:22px;
  line-height:1;
  padding:6px 10px;
  cursor:pointer;
}
.modalBody{
  padding:0;
  overflow:auto;
}
.modalTable{ width:100%; }
.modalTable .row{
  display:grid;
  grid-template-columns: 34% 66%;
  gap:12px;
  padding:12px 14px;
  border-top:1px solid #e7e7e7;
}
.modalTable .row:first-child{ border-top:0; }
.modalTable .k{ color:#666; font-weight:700; }
.modalTable .v{ color:#111; font-weight:800; word-break: break-word; }



/* --- modal styles synced from index.html --- */
.modalBack{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:50;
  }
  .modalBack.show{ display:flex; }
  .modal{
    width:min(720px, 100%);
    background:#fff;
    border-radius:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modalHead{
    padding:16px 18px;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .modalHead .ttl{ font-size:18px; font-weight:900; }
  .modalHead .subttl{ font-size:13px; font-weight:800; opacity:.9; margin-top:4px; }
  .modalHead button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:22px;
    cursor:pointer;
  }
  .modalBody{ padding:16px 18px 18px; }
  .modalBody .mLine{ margin:8px 0; }
  .modalBody .mKey{ font-weight:900; display:inline-block; min-width:140px; color:#111; }
  .modalBody .mVal{ color:#111; font-weight:700; }

  
/* --- end modal styles sync --- */

/* --- result overflow fix (mobile) --- */
#resultTable, #resultTable table { table-layout: fixed; width: 100%; }
#resultTable th, #resultTable td { overflow: hidden; }
#resultTable td { min-width: 0; }
#resultTable th:first-child, #resultTable td:first-child { width: 48px; }
#resultTable a.link { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* --- end overflow fix --- */
</style>
</head>
<body>
  <div class="wrap">
    <h1>最強チームシミュレーション（サンプル）</h1>
<div class="card">
      <div class="ctrl">
<div class="row">
          <div class="two">
            <label>フォーメーションコンボ</label>
            <select id="comboSel"></select>
          </div>

          <div class="two">
            <label>総合力モード</label>
            <div class="row">
              <label class="pill"><input type="radio" name="mode" value="overall" checked> 初期総合力</label>
              <label class="pill"><input type="radio" name="mode" value="maxUpgrade"> 最大強化</label>
            </div>
          </div>
        </div>

        <div class="row"><button class="btn" id="btnSim">シミュレーション</button><div class="mini" id="status"></div></div>
      </div>

      <div class="grid" id="gridWrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th style="width:64px">ポジ</th>
              <th>ポリシー染め</th>
              <th>ポリシー自由</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
</div>
  </div>

  <!-- modal -->
  <div id="modalBack" class="modalBack" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead">
      <div>
        <div id="modalTitle" class="ttl">詳細</div>
        <div id="modalSub" class="subttl"></div>
      </div>
      <button id="modalClose" type="button" aria-label="close">✕</button>
    </div>
    <div id="modalBody" class="modalBody"></div>
  </div>
</div>

<script>
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}

(function(){
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  const roman = (n)=>({1:"Ⅰ",2:"Ⅱ",3:"Ⅲ"}[Number(n)]||String(n??""));
  const getMode = ()=>document.querySelector('input[name="mode"]:checked')?.value || "overall";

  let PLAYERS = [];
  let COMBOS = [];
  let SLOTS = [];

  function setStatus(msg, isErr=false){
    $("status").innerHTML = isErr ? `<span class="err">${esc(msg)}</span>` : `<span class="mut">${esc(msg)}</span>`;
  }

  async function loadAll(){
    setStatus("データ読み込み中…");
    const [p,c,s] = await Promise.all([
      fetch("./players.json").then(r=>r.json()),
      fetch("./combos.json").then(r=>r.json()),
      fetch("./formation_slots.json").then(r=>r.json()),
    ]);
    PLAYERS = (p||[]).filter(x=>x && (x.player_id || x.playerId));
    COMBOS  = (c||[]).filter(x=>x && x.comboId);
    // formation_slots.json may use camelCase or snake_case keys. Normalize here.
    SLOTS   = (s||[])
      .map(x=>({
        comboId: x?.comboId ?? x?.combo_id,
        slotNo:  x?.slotNo  ?? x?.slot_no,
        position: x?.position
      }))
      .filter(x=>x && x.comboId && x.slotNo && x.position);

    setStatus("");
    rebuildPolicySelect();
    rebuildComboSelect();
}

  function rebuildPolicySelect(){
    const sel = $("policySel");
    if(!sel) return;
    const set = new Set();
    for(const p of PLAYERS){
      const v = (p.policy ?? "").toString().trim();
      if(v) set.add(v);
    }
    const list = [...set].sort((a,b)=>a.localeCompare(b,"ja"));
    sel.innerHTML = `<option value="">（指定なし）</option>` + list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  }


  function rebuildComboSelect(){
    // Gold-only combos. Support variations like "金", "金ランク", etc.
    const list = COMBOS
      .filter(c=>{
        const r = String(c.rank||"").trim();
        return r === "金" || r.includes("金") || r.toLowerCase()==="gold";
      })
      .sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"));

    const sel = $("comboSel");
    sel.innerHTML = list.map(c=>{
      const pol = Array.isArray(c.combo_policys) ? c.combo_policys.join("・") : (c.combo_policys||"-");
      const tag = `${c.formation||"-"} / ${pol||"-"}`;
      return `<option value="${esc(c.comboId)}">${esc(c.name)}（${esc(tag)}）</option>`;
    }).join("");

    if(!list.length){
      setStatus("金ランクのコンボが見つかりません（combos.json の rank 表記を確認してください）", true);
    }
  }

  function buildRequirementMap(combo){
    const m = new Map(); // position -> array of req
    (combo.combo_requirements||[]).forEach(req=>{
      const pos = req.position;
      if(!pos) return;
      if(!m.has(pos)) m.set(pos, []);
      m.get(pos).push(req);
    });
    return m;
  }

  function matchPlayerForSlot(player, combo, slotPos, reqMap, kw, forcedPolicy){
    if(kw){
      const name = String(player.name||"");
      if(!name.includes(kw)) return false;
    }
    // policy match:
    // - if forcedPolicy is specified, use it
    // - otherwise, if combo defines policies, require inclusion
    const fp = (forcedPolicy ?? "").toString().trim();
    if(fp){
      if(String(player.policy) !== fp) return false;
    }else{
      const cps = combo.combo_policys || combo.combo_policies || [];
      if(Array.isArray(cps) && cps.length){
        if(!cps.includes(player.policy)) return false;
      }
    }
    // position match
    if(String(player.mainPosition) !== String(slotPos)) return false;

    // if requirements exist for this position, must satisfy at least one
    const reqs = reqMap.get(String(slotPos)) || [];
    if(reqs.length){
      const ok = reqs.some(r=>{
        if(String(player.playStyle) !== String(r.playStyle)) return false;
        const needLv = Number(r.playStyleLv||0);
        const haveLv = Number(player.playStyleLv||0);
        return haveLv === needLv;
      });
      if(!ok) return false;
    }
    return true;
  }

  function isActivationMatch(player, slotPos, reqMap){
    if(String(player.mainPosition) !== String(slotPos)) return false;
    const reqs = reqMap.get(String(slotPos)) || [];
    if(reqs.length){
      return reqs.some(r=>{
        if(String(player.playStyle) !== String(r.playStyle)) return false;
        const needLv = Number(r.playStyleLv||0);
        const haveLv = Number(player.playStyleLv||0);
        return haveLv === needLv;
      });
    }
    return true;
  }


  function pickBest(cands, usedSet, mode){
    const key = mode;
    const sorted = [...cands].sort((a,b)=>Number(b[key]||0)-Number(a[key]||0));
    for(const p of sorted){
      const pid = p.player_id || p.playerId;
      if(!usedSet.has(pid)){
        usedSet.add(pid);
        return p;
      }
    }
    return null;
  }

  function simulate(){
    const comboId = $("comboSel").value;
    const combo = COMBOS.find(c=>String(c.comboId)===String(comboId));
    if(!combo){
      setStatus("コンボが見つかりません", true);
      return;
    }
    const mode = getMode();
    const forcedPolicy = $("policySel") ? $("policySel").value : "";
    const kw = "";

    const slots = SLOTS.filter(s=>String(s.comboId)===String(comboId))
                       .sort((a,b)=>Number(a.slotNo)-Number(b.slotNo));
    if(slots.length!==11){
      setStatus(`formation_slots が 11枠ではありません（現在 ${slots.length}）`, true);
    }else{
      }

    const reqMap = buildRequirementMap(combo);

    const usedMatch = new Set();
    const usedAny   = new Set();

    // Highlight up to 3 players total (one per combo requirement), based on exact match to combo_requirements
    const remainingPolicy = Array.isArray(combo.combo_requirements) ? combo.combo_requirements.slice() : [];
    const remainingFree = Array.isArray(combo.combo_requirements) ? combo.combo_requirements.slice() : [];
    let policyHits = 0;
    let freeHits = 0;

    const consumeRequirement = (player, remainingReqs, slotPos)=>{
      if(!player) return false;
      const pPos = String(slotPos||"");
      const pStyle = String(player.playStyle||"");
      const pLv = String(player.playStyleLv||"");
      for(let i=0;i<remainingReqs.length;i++){
        const r = remainingReqs[i] || {};
        if(String(r.position||"")===pPos && String(r.playStyle||"")===pStyle && String(r.playStyleLv||"")===pLv){
          remainingReqs.splice(i,1);
          return true;
        }
      }
      return false;
    };

    const tbody = $("tbody");
    tbody.innerHTML = "";

    for(const s of slots){
      const pos = s.position;

      const matchCands = PLAYERS.filter(p=>matchPlayerForSlot(p, combo, pos, reqMap, kw, forcedPolicy));
      const anyCands   = PLAYERS.filter(p=>String(p.mainPosition)===String(pos));

      const bestMatch = pickBest(matchCands, usedMatch, mode);
      const bestAny   = pickBest(anyCands, usedAny, mode);

      let hitMatch = false;
      if(bestMatch && policyHits < 3){
        hitMatch = consumeRequirement(bestMatch, remainingPolicy, pos);
        if(hitMatch) policyHits++;
      }
      let hitAny = false;
      if(bestAny && freeHits < 3){
        hitAny = consumeRequirement(bestAny, remainingFree, pos);
        if(hitAny) freeHits++;
      }

      tbody.insertAdjacentHTML("beforeend", rowHtml(s.slotNo, pos, bestMatch, bestAny, mode, hitMatch, hitAny));
    }

    $("gridWrap").style.display = "block";

    // bind links
    tbody.querySelectorAll("[data-player-id]").forEach(a=>{
      a.addEventListener("click", (e)=>{
        e.preventDefault();
        const pid = a.getAttribute("data-player-id");
        const p = PLAYERS.find(x=>String(x.player_id||x.playerId)===String(pid));
        openPlayerModal(p);
      });
    });
  }

  function rowHtml(slotNo, pos, p1, p2, mode, hit1, hit2){
    const cell = (p, hit)=>{
      if(!p) return `<div class="mut">-</div>`;
      const pid = p.player_id || p.playerId;
      const nm = p.name || "-";
      return `<a href="#" class="link${hit ? " hit" : ""}" data-player-id="${esc(pid)}">${esc(nm)}</a>`;
    };

    return `
      <tr>
        <td class="pos">${esc(pos)}</td>
        <td>${cell(p1, hit1)}</td>
        <td>${cell(p2, hit2)}</td>
      </tr>
    `;
  }

  // modal
  function openModal(title, sub, bodyHtml){
    $("modalTitle").textContent = title || "詳細";
    $("modalSub").textContent = sub || "";
    $("modalBody").innerHTML = bodyHtml || "";
    $("modalBack").classList.add("show");
    $("modalBack").setAttribute("aria-hidden","false");
    try{ $("modalClose").focus(); }catch(e){}
  }
  function closeModal(){
    const back = $("modalBack");
    try{ if(document.activeElement){ document.activeElement.blur(); } }catch(_){ }
    back.classList.remove("show");
    back.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
  }
  $("modalClose").addEventListener("click", closeModal);
  $("modalBack").addEventListener("click", (e)=>{ if(e.target===$("modalBack")) closeModal(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

  function openPlayerModal(player){
  const back = document.getElementById('modalBack');
  const titleEl = document.getElementById('modalTitle');
  const subEl = document.getElementById('modalSub');
  const bodyEl = document.getElementById('modalBody');

  if(!back || !titleEl || !subEl || !bodyEl) return;

  // タイトル部（画像3/ index.html と同じ）
  titleEl.textContent = player?.name ?? '-';
  const nat = player?.nationality ?? '-';
  const grow = player?.growthType ?? '-';
  subEl.textContent = `国籍：${nat} / 成長タイプ：${grow}`;

  // プレイスタイル表記（例: パサー II）
  const psName = player?.playStyleName ?? player?.playStyle ?? '-';
  const psLv = (player?.playStyleLv ?? '').toString().trim();
  const psDisp = psLv ? `${psName} ${psLv}` : psName;

  const lines = [
    ['区分', player?.category ?? '-'],
    ['入手方法', player?.acquisitionMethod ?? '-'],
    ['入手場所', player?.acquisitionLocation ?? '-'],
    ['入手可能期間', player?.acquisitionPeriod ?? '-'],
    ['初期総合力', (player?.initialOverall ?? player?.initial_total ?? '-')],
    ['最大強化', (player?.maxOverall ?? player?.max_total ?? '-')],
    ['ポリシー', player?.policy ?? '-'],
    ['プレイスタイル', psDisp ?? '-'],
    ['メインポジション', player?.position ?? player?.mainPosition ?? '-'],
    ['メインスキル', player?.mainSkill ?? '-'],
    ['メイン特徴', player?.mainTrait ?? '-'],
  ];

  bodyEl.innerHTML = lines.map(([k,v]) => `
    <div class="mLine">
      <div class="mKey">${escapeHtml(k)}</div>
      <div class="mVal">${escapeHtml(String(v ?? '-'))}</div>
    </div>
  `).join('');

  // 表示
  back.classList.add('show');
  back.setAttribute('aria-hidden','false');
}

  // events
  $("btnSim").addEventListener("click", simulate);
  

  loadAll().catch(err=>{
    console.error(err);
    setStatus("データの読み込みに失敗しました（players.json / combos.json / formation_slots.json を同じフォルダに配置してください）", true);
  });
})();
</script>
</body>
</html>
