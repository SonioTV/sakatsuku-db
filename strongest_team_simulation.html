<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>最強チームシミュレーション</title>
  <style>
    :root{
      --bg:#0b1220; --card:#0f1a2e; --line:#1f3356; --txt:#e9f1ff; --mut:#9fb4d9;
      --acc:#56a4ff; --good:#54d18a; --bad:#ff6b6b;
    }
    html,body{margin:0;background:linear-gradient(180deg,#081025,#071022);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
    .wrap{max-width:420px;margin:0 auto;padding:18px 14px 60px;}
    h1{font-size:18px;margin:0 0 10px;font-weight:900;letter-spacing:.02em}
    .sub{color:var(--mut);font-size:12px;line-height:1.6;margin:0 0 14px}
    .card{background:rgba(15,26,46,.92);border:1px solid rgba(31,51,86,.9);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px}
    .ctrl{display:grid;grid-template-columns:1fr;gap:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{font-size:12px;color:var(--mut);font-weight:800}
    select,input[type="text"]{background:#0b1730;border:1px solid rgba(31,51,86,.9);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:13px;outline:none}
    select{min-width:260px;max-width:100%}
    input[type="text"]{width:min(360px,100%)}
    .pill{display:inline-flex;align-items:center;gap:8px;background:#0b1730;border:1px solid rgba(31,51,86,.9);border-radius:999px;padding:8px 12px}
    .pill input{margin:0}
    .btn{background:linear-gradient(180deg,#2a87ff,#2b6ad8);border:none;border-radius:12px;color:#fff;font-weight:900;padding:10px 14px;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .mini{font-size:11px;color:var(--mut)}
    .err{color:var(--bad);font-weight:900}
    .ok{color:var(--good);font-weight:900}
    .grid{margin-top:12px;border-radius:16px;border:1px solid rgba(31,51,86,.9)}
    table{border-collapse:separate;border-spacing:0;width:100%;background:rgba(11,23,48,.6)}
    thead th{position:sticky;top:0;background:rgba(11,23,48,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(31,51,86,.9);font-size:12px;color:var(--mut);padding:6px 8px;text-align:left}
    tbody td{border-bottom:1px solid rgba(31,51,86,.55);padding:6px 8px;font-size:13px;vertical-align:top}
    tbody tr:last-child td{border-bottom:none}
    .pos{font-weight:900;letter-spacing:.04em}
    .link{color:var(--acc);font-weight:900;text-decoration:none;white-space:nowrap}
table{ table-layout: fixed; }
th, td{ overflow:hidden; text-overflow: ellipsis; }
td:nth-child(2), td:nth-child(3){ white-space: nowrap; }
td:nth-child(2) .link, td:nth-child(3) .link{ display:block; width:100%; overflow:hidden; text-overflow: ellipsis; }

    .link:hover{text-decoration:underline}
    .mut{color:var(--mut)}
    .hit{color:var(--good);font-weight:1000}
    .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(31,51,86,.9);background:#0b1730;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mut);white-space:nowrap}
    .two{display:flex;flex-direction:column;gap:4px}
    .v{font-weight:900}
    .note{margin-top:10px;color:var(--mut);font-size:12px;line-height:1.6}

/* ---- Fix: iPhone16 table overflow (ellipsis) ---- */
.results table { table-layout: fixed; width: 100%; }
.results th, .results td { overflow: hidden; text-overflow: ellipsis; }
.results td a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- modal styles synced from index.html --- */
.modalBack{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:50;
  }
  .modalBack.show{ display:flex; }
  .modal{
    width:min(720px, 100%);
    background:#fff;
    border-radius:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modalHead{
    padding:16px 18px;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .modalHead .ttl{ font-size:18px; font-weight:900; color:#ffd400; }
  .modalHead .subttl{ font-size:13px; font-weight:800; opacity:.9; margin-top:4px; color:#ffd400; }
  .modalHead button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:22px;
    cursor:pointer;
  }
  .modalBody{ padding:16px 18px 18px; }
  .modalBody .mLine{ margin:8px 0; }
.modalBody .mLine{
  margin:8px 0;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.modalBody .mKey{
  font-weight:900;
  flex:0 0 140px;     /* ← 左列幅固定（=折り返し位置が揃う） */
  color:#111;
}
.modalBody .mVal{
  color:#111;
  font-weight:700;
  flex:1 1 auto;
  min-width:0;
  overflow-wrap:anywhere; /* 長い文字でも自然に折り返し */
  word-break:break-word;
}

  
/* --- end modal styles sync --- */

/* --- result overflow fix (mobile) --- */
#resultTable, #resultTable table { table-layout: fixed; width: 100%; }
#resultTable th, #resultTable td { overflow: hidden; }
#resultTable td { min-width: 0; }
#resultTable th:first-child, #resultTable td:first-child { width: 48px; }
#resultTable a.link { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* --- end overflow fix --- */

  /* Ensure long player names never overflow */
  a.playerLink{
    display:block;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  /* Note under results */
  .resultNote{
    margin-top:10px;
    font-size:12px;
    color:#a9bbd8;
    line-height:1.4;
  }
  .backWrap{
    margin:18px 0 30px;
    text-align:center;
  }
  .backWrap .backBtn{
    display:inline-block;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:#d7e6ff;
    text-decoration:none;
    font-weight:700;
  }
/* ---- Results box (added) ---- */
.resultsBox{padding:12px}
/* ---- end results box ---- */

/* ---- Layout tweaks (fix7) ---- */
#comboSel{
  width:100%;
  min-width:0;
  padding:8px 10px;
  border-radius:10px;
}
#gridWrap thead th{ padding:6px 6px; }
#gridWrap tbody td{ padding:6px 6px; }
#gridWrap th:first-child, #gridWrap td:first-child{ width:48px !important; }
#gridWrap td:first-child{ padding-right:4px; }
#gridWrap th:nth-child(2), #gridWrap td:nth-child(2){ padding-left:6px; }
#gridWrap th:nth-child(3), #gridWrap td:nth-child(3){ padding-left:6px; }

.two{ min-width:0; }
.playerName{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:100%;
}
/* ---- end layout tweaks ---- */

/* ---- Player name color fix ---- */
.playerLink{
  color:#e9f1ff;        /* 通常：白 */
  text-decoration:none;
}
.hit .playerLink{
  color:#54d18a;        /* 強調：緑 */
  font-weight:1000;
}
.playerLink:hover{
  text-decoration:underline;
}
/* ---- end fix ---- */


/* ---- Pitch view (added) ---- */
.pitch{
  position:relative;
  width:100%;
  aspect-ratio: 3 / 4;
  background: radial-gradient(120% 120% at 50% 15%, rgba(84,209,138,.18), rgba(0,0,0,0)),
              linear-gradient(180deg, rgba(10,60,25,.55), rgba(6,35,14,.92));
  border:1px solid rgba(31,51,86,.9);
  border-radius:16px;
  overflow:hidden;
}
.pitch::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(233,241,255,.12);
  border-radius:12px;
}
.pPlayer{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  width:15%;
  max-width:160px;
  min-width:56px;
  pointer-events:auto;
}
.pPlayer .pPos{
  font-size:clamp(10px, 2.8vw, 13px);
  font-weight:800;
  letter-spacing:0.04em;
  opacity:0.9;
  margin-bottom:4px;
  white-space:nowrap;
}
.pPlayer .playerLink{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(12px, 3.6vw, 18px);
  line-height:1.15;
}

.pPos{
  font-size:11px;
  color:var(--mut);
  font-weight:900;
  letter-spacing:.03em;
  margin-bottom:2px;
}
.pPlayer .playerLink{
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ---- Pitch name pill (tuned) ---- */
.pPlayer .playerLink{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-weight:900;
  text-decoration:none;

  /* outline (thin) + fallback */
  -webkit-text-stroke: 0.7px rgba(0,0,0,.95);
  text-shadow:
    1px 0 rgba(0,0,0,.70),
    -1px 0 rgba(0,0,0,.70),
    0 1px rgba(0,0,0,.70),
    0 -1px rgba(0,0,0,.70),
    1px 1px rgba(0,0,0,.55),
    -1px 1px rgba(0,0,0,.55),
    1px -1px rgba(0,0,0,.55),
    -1px -1px rgba(0,0,0,.55);

  /* 3D pill */
  box-shadow:
    0 2px 10px rgba(0,0,0,.28),
    0 1px 3px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -2px 0 rgba(0,0,0,.14);
}
/* keep position colors (border/background) */
.pPlayer.pp-gk  .playerLink{ border-color:#ff3b30; background:rgba(255,59,48,.22); }
.pPlayer.pp-def .playerLink{ border-color:#0a84ff; background:rgba(10,132,255,.18); }
.pPlayer.pp-mid .playerLink{ border-color:#ff9f0a; background:rgba(255,159,10,.20); }
.pPlayer.pp-att .playerLink{ border-color:#34c759; background:rgba(52,199,89,.18); }

/* hit (combo condition met) -> green text, keep black outline */
.pPlayer.hit .playerLink{ color: var(--good); }
/* ---- end pitch name pill ---- */

/* ---- end pitch view ---- */

/* ===== Half-pitch field lines ===== */
.pitch{
  position:relative;
  overflow:hidden;
}
.pitch::before{
  content:"";
  position:absolute;
  inset:3%;
  border:4px solid rgba(255,255,255,.95);
  border-radius:10px;
  z-index:1;
  pointer-events:none;
}
.pitch::after{
  content:"";
  position:absolute;
  left:3%;
  right:3%;
  top:3%;
  height:0;
  border-top:4px solid rgba(255,255,255,.95);
  z-index:1;
  pointer-events:none;
}
.pitchLines{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
}
.pitchLine{
  position:absolute;
  border-color:rgba(255,255,255,.95);
  border-style:solid;
  box-sizing:border-box;
}

/* ハーフコート上端＝センターライン。上から大きなセンターサークルだけ見せる */
.pitchLine.centerArc{
  left:20%;

<script>
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}

(function(){
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  const roman = (n)=>({1:"Ⅰ",2:"Ⅱ",3:"Ⅲ"}[Number(n)]||String(n??""));
  const short2 = (s)=>String(s??"").slice(0,2);
  const getPlayerId = (p)=>String(p?.player_id || p?.playerId || "");
  const getSelectedTeamMode = ()=>document.querySelector('input[name="pitchTeam"]:checked')?.value || "dye";
  const getSelectedTeamLabel = ()=>getSelectedTeamMode() === "free" ? "ポリシー自由" : "ポリシー染め";
  const getPlayerFilterMode = ()=>document.querySelector('input[name="playerFilter"]:checked')?.value || "all";
  const getMode = ()=>"maxUpgrade";
  const getRank = ()=>$("rankSel")?.value || "";
  const getPolicyFilter = ()=>$("policySel")?.value || "";
  const getAcq = ()=>$("acqSel")?.value || "";

  function normalizePositionValue(v){
    return String(v ?? "").trim().toUpperCase();
  }

  function getSuitablePositions(player){
    const raw = player?.suitablePositions;
    let positions = [];

    if(Array.isArray(raw)){
      positions = raw;
    }else if(typeof raw === "string" && raw.trim() !== ""){
      positions = raw.split(/[\/／,、\s]+/);
    }

    const main = player?.mainPosition ?? player?.position ?? player?.ポジション ?? "";
    if(main !== null && main !== undefined && String(main).trim() !== ""){
      positions.unshift(main);
    }

    return [...new Set(positions.map(normalizePositionValue).filter(Boolean))];
  }

  function playerCanPlayPosition(player, position){
    const reqPos = normalizePositionValue(position);
    if(!reqPos) return true;
    return getSuitablePositions(player).includes(reqPos);
  }

  function getPositionDisplay(player){
    const positions = getSuitablePositions(player);
    return positions.length ? positions.join("/") : "-";
  }

  let PLAYERS = [];
  let COMBOS = [];
  let SLOTS = []; // formation_slots.json (x,y を含む)

  let PLAYER_MAP = new Map();

// ---- pitch view state ----
let LAST = null;

// slotNo / positionPlace を使って、同一ポジション複数配置でも左右/中央を安定させる
function getY(pos){
  pos = String(pos||"").toUpperCase();
  if(pos==="GK") return 90;

  // DF line
  if(["LB","LWB"].includes(pos)) return 72;
  if(["RB","RWB"].includes(pos)) return 72;
  if(["CB","SB"].includes(pos)) return 72;

  // MF lines
  if(["DM"].includes(pos)) return 56;
  if(["CM","CH","LM","RM"].includes(pos)) return 46;
  if(["AM","OM"].includes(pos)) return 40;

  // WF / FW
  if(["LW","RW","LF","RF"].includes(pos)) return 26;
  if(["CF","ST"].includes(pos)) return 14;

  return 50;
}

function getX(pos, place, idx, total){
  pos = String(pos||"").toUpperCase();
  place = String(place||"");

  // wide positions are anchored near the touchline
  const isLeftWide = ["LB","LWB","LM","LW","LF"].includes(pos);
  const isRightWide = ["RB","RWB","RM","RW","RF"].includes(pos);
  if(isLeftWide) return 18;
  if(isRightWide) return 82;

  // explicit place from combos.json (Right/Left/Center)
  if(place==="Left") return 32;
  if(place==="Center") return 50;
  if(place==="Right") return 68;

  // fallback: distribute within central lane
  const n = Math.max(1, Number(total)||1);
  const i = Math.min(n, Math.max(1, Number(idx)||1));
  if(n===1) return 50;
  if(n===2) return i===1 ? 40 : 60;
  if(n===3) return i===1 ? 34 : (i===2 ? 50 : 66);
  if(n===4) return [30,43,57,70][i-1] || 50;
  return 50;
}

function renderPitch(){
  const pitchWrap = $("pitchWrap");
  const pitch = $("pitch");
  if(!pitchWrap || !pitch) return;

  if(!LAST){
    pitchWrap.style.display = "none";
    return;
  }

  const team = document.querySelector('input[name="pitchTeam"]:checked')?.value || "dye";
  const picks = team === "free" ? LAST.picksB : LAST.picksA;

  // ★追加：slotNo -> player のMap（indexズレ対策）
  const pickBySlot = new Map(
    (picks || [])
      .filter(x => x && x.slot && x.player)
      .map(x => [String(x.slot.slotNo), x.player])
  );

  // 同一ポジションのスロットを slotNo 昇順で並べて idx を決める
  const byPos = new Map();
  for(const s of LAST.slots){
    const k = String(s.position||"").toUpperCase();
    if(!byPos.has(k)) byPos.set(k, []);
    byPos.get(k).push(s);
  }
  for(const [k, arr] of byPos){
    arr.sort((a,b)=>Number(a.slotNo)-Number(b.slotNo));
  }

  pitch.innerHTML = `
    <svg class="pitchSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <rect class="fieldLine" x="3" y="3" width="94" height="94" rx="2.5" ry="2.5"></rect>
      <line class="fieldLine" x1="3" y1="3" x2="97" y2="3"></line>
      <path class="fieldLine" d="M30 3 C35 29 65 29 70 3"></path>
      <path class="fieldLine" d="M15 97 L15 75 L85 75 L85 97"></path>
      <path class="fieldLine" d="M28 97 L28 87 L72 87 L72 97"></path>
      <path class="fieldLine" d="M35 75 C40 63 60 63 65 75"></path>
    </svg>
  `;

  for(let i=0;i<LAST.slots.length;i++){
    const s = LAST.slots[i];
    // ★変更：indexではなくslotNoで選手を取得
    const player = pickBySlot.get(String(s.slotNo)) || null;
    if(!player) continue;

    const pos = String(s.position||"");
    const k = pos.toUpperCase();

    const arr = byPos.get(k) || [s];
    const idx = arr.findIndex(x=>Number(x.slotNo)===Number(s.slotNo)) + 1;
    const total = arr.length;

    const place = LAST.slotPlaceMap?.get(String(s.slotNo)) || ""; // Right/Left/Center (if provided)


    // Prefer exact coordinates from formation_slots.json (x,y) when available
    const xy = LAST.slotCoordMap?.get(String(s.slotNo)) || null;

    const x = (xy && Number.isFinite(xy.x)) ? xy.x : getX(k, place, idx, total);
    const y = (xy && Number.isFinite(xy.y)) ? xy.y : getY(k);

    const ok = LAST.highlightOK(player, s);
    const pid = getPlayerId(player);
    const nm  = short2(player.name || "-");
    const imgSrc = pid ? `img/players/${esc(pid)}.png` : "";
const div = document.createElement("div");
    const g = (()=>{
      const p = String(pos||"").toUpperCase();
      if(p==="GK") return "pp-gk";
      if(["CB","LB","RB"].includes(p)) return "pp-def";
      if(["AM","DM","LM","RM"].includes(p)) return "pp-mid";
      if(["CF","LW","RW"].includes(p)) return "pp-att";
      return "";
    })();
    div.className = "pPlayer hasImage" + (g ? (" "+g) : "") + (ok ? " hit" : "");
    div.style.left = x + "%";
    div.style.top  = y + "%";
    div.innerHTML = `
      <div class="pPos">${esc(pos)}</div>
      <a href="#" class="pitchPlayerLink" data-pid="${esc(pid)}" aria-label="${esc(player.name || '-')}">
        <img class="pitchPortrait" src="${imgSrc}" alt="${esc(player.name || '-')}" onerror="this.style.display='none'; this.closest('.pPlayer').classList.remove('hasImage');">
        <span class="pitchNameFallback">${esc(nm)}</span>
      </a>
    `;
    pitch.appendChild(div);
  }
}

function makeResultCell(player, slot){
  if(!player) return `<span class="mut">-</span>`;
  const cls = LAST && LAST.highlightOK(player, slot) ? "hit" : "";
  const pid = getPlayerId(player);
  const nm  = player.name || "-";
  return `<div class="two teamCell">
    <div class="${cls}"><a href="#" class="playerLink playerName" data-pid="${esc(pid)}">${esc(nm)}</a></div>
  </div>`;
}

function renderTable(){
  const tbody = $("tbody");
  const head = $("teamTableHead");
  if(!tbody || !LAST) return;

  const team = getSelectedTeamMode();
  const label = getSelectedTeamLabel();
  const picks = team === "free" ? LAST.picksB : LAST.picksA;
  if(head) head.textContent = label;

  const pickBySlot = new Map(
    (picks || [])
      .filter(x => x && x.slot)
      .map(x => [String(x.slot.slotNo), x.player || null])
  );

  tbody.innerHTML = "";
  for(const s of LAST.slots){
    const player = pickBySlot.get(String(s.slotNo)) || null;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="pos" data-label="ポジション"><span>${esc(s.position)}</span></td>
      <td data-label="${esc(label)}">${makeResultCell(player, s)}</td>
    `;
    tbody.appendChild(tr);
  }
}

function updateView(){
  const v = document.querySelector('input[name="view"]:checked')?.value || "table";
  const has = !!LAST;

  const gridWrap = $("gridWrap");
  const pitchWrap = $("pitchWrap");
  const note = $("resultNote");
  const box = $("resultsBox");

  if(box){
    box.style.display = has ? "" : "none";
  }

  if(gridWrap){
    gridWrap.style.display = (has && (v==="table" || v==="both")) ? "" : "none";
  }
  if(pitchWrap){
    pitchWrap.style.display = (has && (v==="pitch" || v==="both")) ? "" : "none";
  }
  if(note){
    note.style.display = has ? "" : "none";
  }
}
// ---- end pitch view state ----

  function setStatus(msg, isErr=false){
    $("status").innerHTML = isErr ? `<span class="err">${esc(msg)}</span>` : `<span class="mut">${esc(msg)}</span>`;
  }

  async function loadJson(url){
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error(`${url} (${r.status})`);
  return r.json();
}

async function loadAll(){
  setStatus("データ読み込み中…");

  // players / combos are required
  const [p,c] = await Promise.all([
    loadJson("./players.json"),
    loadJson("./combos.json"),
  ]);

  // formation_slots is optional for initial rendering (combo list should still appear)
  let s = [];
  try{
    s = await loadJson("./formation_slots.json");
  }catch(e){
    console.warn(e);
    // keep going: combo select can still be built
    setStatus("formation_slots.json が見つかりません（コンボ選択は可能ですがシミュレーションは実行できません）", true);
  }

  PLAYERS = (p||[]).filter(x=>x && (x.player_id || x.playerId));
  
  // build quick lookup for player detail popup
  PLAYER_MAP = new Map(PLAYERS.map(pp=>[String(pp.player_id || pp.playerId), pp]));
COMBOS  = (c||[]).filter(x=>x && x.comboId);
  // formation_slots.json may use camelCase or snake_case keys. Normalize here.
  SLOTS   = (s||[])
    .map(x=>({
      comboId: x?.comboId ?? x?.combo_id,
      slotNo:  x?.slotNo  ?? x?.slot_no,
      position: x?.position,
      x: x?.x,
      y: x?.y,
      conditionNo: x?.conditionNo ?? x?.condition_no
    }))
    .filter(x=>x && x.comboId && x.slotNo && x.position);

  // clear status only if we didn't already show the missing-slots warning
  const cur = $("status")?.textContent?.trim();
  if(cur === "データ読み込み中…" || !cur){
    setStatus("");
  }

  rebuildRankPolicySelect();
  rebuildAcqSelect();
  rebuildComboSelect();
}

  function rebuildPolicySelect(){
    const sel = $("policySel");
    if(!sel) return;
    const set = new Set();
    for(const p of PLAYERS){
      const v = (p.policy ?? "").toString().trim();
      if(v) set.add(v);
    }
    const list = [...set].sort((a,b)=>a.localeCompare(b,"ja"));
    sel.innerHTML = `<option value="">（指定なし）</option>` + list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  }


  function rebuildComboSelect(){
    // Show all combos (rank can be 銅/銀/金 etc.). Keep UI minimal and stable.
    const slotSet = new Set((SLOTS||[]).map(s=>String(s.comboId)));
    const baseAll = (COMBOS || []).filter(c=>!slotSet.size || slotSet.has(String(c.comboId)));
    const rSel = getRank();
    const pSel = getPolicyFilter();
    const base = baseAll.filter(c=>{
      if(rSel && String(c.rank||"").trim() !== rSel) return false;
      if(pSel){
        const cps = c.combo_policys;
        if(Array.isArray(cps)) return cps.map(x=>String(x).trim()).includes(pSel);
        return String(cps||"").trim() === pSel;
      }
      return true;
    });
    const list = base
      .slice()
      .sort((a,b)=>{
        // rank order: 金 > 銀 > 銅 > others
        const order = (r)=>{
          const s = String(r||"").trim();
          if(s.includes("金")) return 0;
          if(s.includes("銀")) return 1;
          if(s.includes("銅")) return 2;
          return 3;
        };
        const d = order(a.rank) - order(b.rank);
        if(d!==0) return d;
        return String(a.name).localeCompare(String(b.name),"ja");
      });

    const sel = $("comboSel");
    const opts = list.map(c=>{
      const pol = Array.isArray(c.combo_policys) ? c.combo_policys.join("・") : (c.combo_policys||"-");
      const tag = `${c.rank||"-"} / ${c.formation||"-"} / ${pol||"-"}`;
      return `<option value="${esc(c.comboId)}">${esc(c.name)}（${esc(tag)}）</option>`;
    }).join("");

    // add placeholder so empty state is obvious
    sel.innerHTML = `<option value="">（選択してください）</option>` + opts;

    if(!list.length){
      setStatus("コンボが見つかりません（combos.json を確認してください）", true);
    }
  }

  function buildRequirementMap(combo){
    const byPos = new Map();   // position -> [req...]
    const bySlot = new Map();  // slotNo(string) -> [req...]
    (combo.combo_requirements||[]).forEach(req=>{
      const pos = req.position;
      if(pos){
        if(!byPos.has(pos)) byPos.set(pos, []);
        byPos.get(pos).push(req);
      }
      const sn = req.slotNo ?? req.slot_no;
      if(sn!==undefined && sn!==null && sn!==""){
        const key = String(sn);
        if(!bySlot.has(key)) bySlot.set(key, []);
        bySlot.get(key).push(req);
      }
    });
    return { byPos, bySlot };
  }

  function matchPlayerForSlot(player, combo, slotPos, reqMap, kw, forcedPolicy, requiredAcq){
    // NOTE: Slot assignment should be based on position (+ optional policy/keyword) only.
    // combo_requirements is used for "強調表示" (highlight) separately.
    if(kw){
      const name = String(player?.name ?? '');
      if(!name.includes(kw)) return false;
    }

    // Position match
    // mainPositionだけでなく suitablePositions も参照する
    if(!playerCanPlayPosition(player, slotPos)) return false;

    // AcquisitionPlace match (only when selected)
    if(requiredAcq){
      const ap = String(player?.acquisitionPlace ?? "");
      if(ap !== requiredAcq) return false;
    }

    // Policy match (only when forced)
    if(forcedPolicy){
      const pol = String(player?.policy ?? '');
      if(pol !== forcedPolicy) return false;
    }

    return true;
  }
function rebuildRankPolicySelect(){
    const ranks = Array.from(new Set((COMBOS||[]).map(c=>String(c.rank||"").trim()).filter(Boolean)));
    const order = (r)=>{
      if(r.includes("金")) return 0;
      if(r.includes("銀")) return 1;
      if(r.includes("銅")) return 2;
      return 3;
    };
    ranks.sort((a,b)=>{ const d=order(a)-order(b); return d!==0?d:a.localeCompare(b,"ja"); });

    const policies = Array.from(new Set((COMBOS||[]).flatMap(c=>{
      const cps=c.combo_policys;
      if(Array.isArray(cps)) return cps.map(x=>String(x).trim()).filter(Boolean);
      const s=String(cps||"").trim();
      return s? [s] : [];
    })));
    policies.sort((a,b)=>a.localeCompare(b,"ja"));

    const rankSel = $("rankSel");
    const polSel = $("policySel");
    if(rankSel){
      rankSel.innerHTML = `<option value="">（全て）</option>` + ranks.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
    }
    if(polSel){
      polSel.innerHTML = `<option value="">（全て）</option>` + policies.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
    }

    rankSel?.addEventListener("change", rebuildComboSelect);
    polSel?.addEventListener("change", rebuildComboSelect);
}

function rebuildAcqSelect(){
    const acqs = Array.from(new Set((PLAYERS||[]).map(p=>String(p.acquisitionPlace||"").trim()).filter(Boolean)));
    acqs.sort((a,b)=>a.localeCompare(b,"ja"));
    const sel = $("acqSel");
    if(!sel) return;
    sel.innerHTML = `<option value="">（指定なし）</option>` + acqs.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
}



function getFavoritePlayerIds(){
  const favIds = new Set();
  const addId = (v)=>{
    const s = String(v ?? "").trim();
    if(/^P\d{4,}$/i.test(s)) favIds.add(s.toUpperCase());
  };
  const scanValue = (value)=>{
    if(value == null) return;
    if(typeof value === "string"){
      addId(value);
      try{
        scanValue(JSON.parse(value));
      }catch(e){
        const matches = value.match(/P\d{4,}/gi) || [];
        matches.forEach(addId);
      }
      return;
    }
    if(Array.isArray(value)){
      value.forEach(scanValue);
      return;
    }
    if(typeof value === "object"){
      for(const [k,v] of Object.entries(value)){
        if(v === true || v === 1 || v === "1" || String(v).toLowerCase() === "true") addId(k);
        scanValue(v);
      }
    }
  };

  const preferredKeys = [
    "favoritePlayers",
    "favoritePlayerIds",
    "favorites",
    "sakatsuku_favorite_players",
    "sakatsuku2026_favorite_players",
    "playerFavorites"
  ];

  for(const key of preferredKeys){
    try{ scanValue(localStorage.getItem(key)); }catch(e){}
  }

  // キー名が違っていても拾えるように、favorite / fav を含むlocalStorageも確認
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i) || "";
      if(/favorite|favorites|fav|お気に入り/i.test(key)){
        scanValue(localStorage.getItem(key));
      }
    }
  }catch(e){}

  return favIds;
}

function getSimulationPlayers(){
  const filterMode = getPlayerFilterMode();
  let base = [...PLAYERS];

  if(filterMode === "available"){
    base = base.filter(p=>p.available === true);
  }else if(filterMode === "favorite"){
    const favIds = getFavoritePlayerIds();
    base = base.filter(p=>favIds.has(String(p.player_id || p.playerId || "").toUpperCase()));
  }

  return base;
}

function simulate(){
  if(!SLOTS.length){
    setStatus("formation_slots.json が見つかりません。ファイルを同じフォルダに配置してください。", true);
    return;
  }
  const comboId = $("comboSel")?.value;
  const combo = COMBOS.find(c=>String(c.comboId)===String(comboId));
  if(!combo){
    setStatus("フォーメーションコンボを選択してください。", true);
    return;
  }

  const mode = getMode(); // always maxUpgrade
  const requiredAcq = getAcq();
  const slots = SLOTS
    .filter(s=>String(s.comboId)===String(comboId))
    .sort((a,b)=>Number(a.slotNo)-Number(b.slotNo));

  if(!slots.length){
    setStatus("選択したコンボのスロット定義が見つかりません（formation_slots.json を確認してください）", true);
    return;
  }

  const forcedPolicy = Array.isArray(combo.combo_policys) ? combo.combo_policys[0] : (combo.combo_policys || "");
  const reqMap = buildRequirementMap(combo);

  // greedy pick (unique players)
  const pickBest = (available, slot, forcePol)=>{
    let best = null;
    let bestVal = -Infinity;
    const slotPos = String(slot?.position ?? "");
    const slotKey = String(slot?.slotNo ?? slot?.slot_no ?? "");
    const reqs = (reqMap.bySlot && slotKey) ? (reqMap.bySlot.get(slotKey) || []) : [];
    for(const p of available){
      if(!matchPlayerForSlot(p, combo, slotPos, reqMap, "", forcePol, requiredAcq)) continue;
      // If this slot is part of combo_requirements, enforce exact requirement match (playStyle & Lv)
      if(reqs.length){
        const ps = String(p?.playStyle ?? "");
        const lv = Number(p?.playStyleLv ?? 0);
        if(!reqs.some(r=>String(r.playStyle??"")===ps && lv === Number(r.playStyleLv ?? 0))) continue;
      }
      const v = Number(p?.[mode] ?? -Infinity);
      if(v > bestVal){
        bestVal = v;
        best = p;
      }
    }
    return best;
  };

  const highlightOK = (player, slot)=>{
    if(!slot) return false;
    const slotKey = String(slot.slotNo ?? slot.slot_no ?? "");

    // slotNo 指定要件が1つでもある場合は、slotNo一致のスロットのみ判定対象にする
    const hasSlotReq = (reqMap.bySlot && reqMap.bySlot.size > 0);
    if(hasSlotReq){
      const reqs = reqMap.bySlot.get(slotKey) || [];
      if(!reqs.length) return false;
      const ps = String(player?.playStyle ?? "");
      const lv = Number(player?.playStyleLv ?? 0);
      return reqs.some(r=>String(r.playStyle??"")===ps && lv === Number(r.playStyleLv ?? 0));
    }

    // slotNo 指定が無いコンボのみ、従来通り position 要件で判定
    const reqs = (reqMap.byPos.get(slot.position) || []);
    if(!reqs || !reqs.length) return false;
    const ps = String(player?.playStyle ?? "");
    const lv = Number(player?.playStyleLv ?? 0);
    return reqs.some(r=>String(r.playStyle??"")===ps && lv === Number(r.playStyleLv ?? 0));
  };

  const makeCell = (player, slot)=>{
    if(!player) return `<span class="mut">-</span>`;
    const cls = highlightOK(player, slot) ? "hit" : "";
    const pid = String(player.player_id || player.playerId || "");
    const nm  = (player.name || "-");
    // player name is clickable -> opens detail popup (players.json)
    return `<div class="two">
      <div class="${cls}"><a href="#" class="playerLink playerName" data-pid="${esc(pid)}">${esc(nm)}</a></div>
    </div>`;
  };

  const simulationPlayers = getSimulationPlayers();
  const filterMode = getPlayerFilterMode();
  if(!simulationPlayers.length){
    const msg = filterMode === "available"
      ? "入手可能SP選手が見つかりません。players.json の available を確認してください。"
      : (filterMode === "favorite"
        ? "お気に入りSP選手が見つかりません。選手図鑑などでお気に入り登録してください。"
        : "選手データが見つかりません。");
    setStatus(msg, true);
    LAST = null;
    updateView();
    return;
  }

  const getPower = (p)=>{
    const max = Number(p?.maxUpgrade);
    if(Number.isFinite(max)) return max;
    const overall = Number(p?.overall);
    return Number.isFinite(overall) ? overall : -Infinity;
  };

  const getSlotReqs = (slot)=>{
    const slotKey = String(slot?.slotNo ?? slot?.slot_no ?? "");
    return (reqMap.bySlot && slotKey) ? (reqMap.bySlot.get(slotKey) || []) : [];
  };

  const playerMatchesSlotReq = (player, slot)=>{
    const reqs = getSlotReqs(slot);
    if(!reqs.length) return true;
    const ps = String(player?.playStyle ?? "");
    const lv = Number(player?.playStyleLv ?? 0);
    return reqs.some(r=>String(r.playStyle??"")===ps && lv === Number(r.playStyleLv ?? 0));
  };

  const sortPlayersByPower = (arr)=>arr.slice().sort((a,b)=>{
    const d = getPower(b) - getPower(a);
    if(d!==0) return d;
    return String(a?.name||"").localeCompare(String(b?.name||""), "ja");
  });

  // 発動条件スロットを先に「最大強化」合計が最大になる組み合わせで固定し、残りを総合力順で埋める
  const buildPicks = (forcePol)=>{
    const requiredSlots = slots.filter(s=>getSlotReqs(s).length > 0);
    const normalSlots = slots.filter(s=>getSlotReqs(s).length === 0);
    const chosenBySlot = new Map();
    const usedIds = new Set();

    const reqCandidates = requiredSlots.map(slot=>{
      const list = sortPlayersByPower(simulationPlayers.filter(p=>
        matchPlayerForSlot(p, combo, String(slot?.position ?? ""), reqMap, "", forcePol, requiredAcq) &&
        playerMatchesSlotReq(p, slot)
      ));
      return { slot, list };
    });

    // 候補が少ない条件から探索すると、重複選手の除外が安定しやすい
    reqCandidates.sort((a,b)=>a.list.length - b.list.length || Number(a.slot.slotNo)-Number(b.slot.slotNo));

    let bestScore = -Infinity;
    let bestMap = new Map();
    const dfs = (idx, score, map, used)=>{
      if(idx >= reqCandidates.length){
        if(score > bestScore){
          bestScore = score;
          bestMap = new Map(map);
        }
        return;
      }

      const { slot, list } = reqCandidates[idx];
      const slotKey = String(slot.slotNo);

      // 候補なしの場合も、他の発動条件スロットの選出は続ける
      if(!list.length){
        map.set(slotKey, null);
        dfs(idx + 1, score, map, used);
        map.delete(slotKey);
        return;
      }

      for(const p of list){
        const pid = getPlayerId(p);
        if(pid && used.has(pid)) continue;
        if(pid) used.add(pid);
        map.set(slotKey, p);
        dfs(idx + 1, score + getPower(p), map, used);
        map.delete(slotKey);
        if(pid) used.delete(pid);
      }
    };

    dfs(0, 0, new Map(), new Set());

    for(const [slotKey, player] of bestMap){
      chosenBySlot.set(slotKey, player);
      const pid = getPlayerId(player);
      if(pid) usedIds.add(pid);
    }

    // 残りスロットは、発動条件で固定した選手を除外して最大強化順に配置
    for(const s of normalSlots){
      const available = simulationPlayers.filter(p=>{
        const pid = getPlayerId(p);
        return !pid || !usedIds.has(pid);
      });
      const p = pickBest(available, s, forcePol);
      chosenBySlot.set(String(s.slotNo), p || null);
      const pid = getPlayerId(p);
      if(pid) usedIds.add(pid);
    }

    return slots.map(s=>({ slot:s, player:chosenBySlot.get(String(s.slotNo)) || null }));
  };

  // policy-dye column: force policy for all slots
  const picksA = buildPicks(forcedPolicy || "");

  // free column: no forced policy
  const picksB = buildPicks("");

        const slotPlaceMap = new Map((combo.combo_requirements||[])
      .filter(r=>r && (r.slotNo!==undefined && r.slotNo!==null) && r.positionPlace)
      .map(r=>[String(r.slotNo), String(r.positionPlace)]));

    const formationId = String(combo.formation ?? "").replace(/\s+/g,"");

    // slotNo -> (x,y) map from formation_slots.json for the selected combo
    const slotCoordMap = new Map(
      (slots||[])
        .filter(s=>s && s.x!==undefined && s.y!==undefined && Number.isFinite(Number(s.x)) && Number.isFinite(Number(s.y)))
        .map(s=>[String(s.slotNo), {x:Number(s.x), y:Number(s.y)}])
    );

    LAST = { comboId: String(comboId), formationId, slots, picksA, picksB, highlightOK, slotPlaceMap, slotCoordMap };
  renderTable();
  renderPitch();
  updateView();
  setStatus("");
}


// ===== Player detail popup (reuse style from index.html) =====
const modalBack = $("modalBack");
const modalTitle = $("modalTitle");
const modalSub = $("modalSub");
const modalBody = $("modalBody");
const modalClose = $("modalClose");

function closeModal(){
  modalBack.classList.remove("show");
  modalBack.setAttribute("aria-hidden","true");
}
function openModal(){
  modalBack.classList.add("show");
  modalBack.setAttribute("aria-hidden","false");
}
function makeRow(k,v){
  return `<div class="mLine"><span class="mKey">${esc(k)}</span><span class="mVal">${esc(v||"-")}</span></div>`;
}
function showPlayerDetailById(pid){
  const p = PLAYER_MAP.get(String(pid));
  if(!p) return;
  modalTitle.textContent = p.name || "詳細";
  const sub = `国籍：${p.nationality||"-"} / 成長タイプ：${p.growthType||"-"}`;
  modalSub.textContent = sub;

  const ps = p.playStyle ? `${p.playStyle} ${roman(p.playStyleLv)}` : "-";
  const rows = [
    ["区分", p.category],
["レアリティ", (p.rarity!=null && String(p.rarity)!=="") ? ("★" + String(p.rarity).replace(/^★/,"")) : "-"],
    ["入手方法", p.acquisitionMethod],
    ["入手場所", p.acquisitionPlace],
    ["入手可能期間", p.availablePeriod],
    ["入手可否", p.available === true ? "入手可能" : (p.available === false ? "入手不可" : "-")],
    ["初期総合力", p.overall],
    ["最大強化", p.maxUpgrade],
    ["ポリシー", p.policy],
    ["プレイスタイル", ps],
    ["メインポジション", p.mainPosition],
    ["適性ポジション", getPositionDisplay(p)],
    ["メインスキル", p.mainSkill],
    ["メイン特徴", p.mainTrait],
  ].map(([k,v])=>makeRow(k,v)).join("");

  modalBody.innerHTML = rows;
  openModal();
}

  // events
