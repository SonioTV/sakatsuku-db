<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>最強チームシミュレーション</title>
  <style>
    :root{
      --bg:#0b1220; --card:#0f1a2e; --line:#1f3356; --txt:#e9f1ff; --mut:#9fb4d9;
      --acc:#56a4ff; --good:#54d18a; --bad:#ff6b6b;
    }
    html,body{margin:0;background:linear-gradient(180deg,#081025,#071022);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
    .wrap{max-width:420px;margin:0 auto;padding:18px 14px 60px;}
    h1{font-size:18px;margin:0 0 10px;font-weight:900;letter-spacing:.02em}
    .sub{color:var(--mut);font-size:12px;line-height:1.6;margin:0 0 14px}
    .card{background:rgba(15,26,46,.92);border:1px solid rgba(31,51,86,.9);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px}
    .ctrl{display:grid;grid-template-columns:1fr;gap:10px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{font-size:12px;color:var(--mut);font-weight:800}
    select,input[type="text"]{background:#0b1730;border:1px solid rgba(31,51,86,.9);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:13px;outline:none}
    select{min-width:260px;max-width:100%}
    input[type="text"]{width:min(360px,100%)}
    .pill{display:inline-flex;align-items:center;gap:8px;background:#0b1730;border:1px solid rgba(31,51,86,.9);border-radius:999px;padding:8px 12px}
    .pill input{margin:0}
    .btn{background:linear-gradient(180deg,#2a87ff,#2b6ad8);border:none;border-radius:12px;color:#fff;font-weight:900;padding:10px 14px;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .mini{font-size:11px;color:var(--mut)}
    .err{color:var(--bad);font-weight:900}
    .ok{color:var(--good);font-weight:900}
    .grid{margin-top:12px;border-radius:16px;border:1px solid rgba(31,51,86,.9)}
    table{border-collapse:separate;border-spacing:0;width:100%;background:rgba(11,23,48,.6)}
    thead th{position:sticky;top:0;background:rgba(11,23,48,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(31,51,86,.9);font-size:12px;color:var(--mut);padding:6px 8px;text-align:left}
    tbody td{border-bottom:1px solid rgba(31,51,86,.55);padding:6px 8px;font-size:13px;vertical-align:top}
    tbody tr:last-child td{border-bottom:none}
    .pos{font-weight:900;letter-spacing:.04em}
    .link{color:var(--acc);font-weight:900;text-decoration:none;white-space:nowrap}
table{ table-layout: fixed; }
th, td{ overflow:hidden; text-overflow: ellipsis; }
td:nth-child(2), td:nth-child(3){ white-space: nowrap; }
td:nth-child(2) .link, td:nth-child(3) .link{ display:block; width:100%; overflow:hidden; text-overflow: ellipsis; }

    .link:hover{text-decoration:underline}
    .mut{color:var(--mut)}
    .hit{color:var(--good);font-weight:1000}
    .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(31,51,86,.9);background:#0b1730;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mut);white-space:nowrap}
    .two{display:flex;flex-direction:column;gap:4px}
    .v{font-weight:900}
    .note{margin-top:10px;color:var(--mut);font-size:12px;line-height:1.6}
    /* モーダル */
  .modalBack{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:0;
    z-index:9999;
  }
  .modalBack.show{ display:flex; }
  .modal{
    width:min(520px, 96vw);
    background:#fff;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modalHead{
    padding:14px 16px;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .modalHead .ttl{ font-size:18px; font-weight:900; line-height:1.2; }
  .modalHead .subttl{ font-size:12px; font-weight:700; opacity:.85; margin-top:4px; }
  .modalHead button{
    border:2px solid rgba(255,255,255,.25);
    background:transparent;
    color:#fff;
    border-radius:12px;
    width:42px;
    height:42px;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modalBody{ padding:14px 16px 18px; max-height:90vh; overflow:auto; }
  .modalBody .mLine{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #ececec; }
  .modalBody .mLine:last-child{ border-bottom:none; }
  .modalBody .mKey{ flex:0 0 120px; min-width:120px; color:#666; font-weight:700; }
  .modalBody .mVal{ flex:1; min-width:0; color:#111; font-weight:800; word-break:break-word; }

/* ---- Fix: iPhone16 table overflow (ellipsis) ---- */
.results table { table-layout: fixed; width: 100%; }
.results th, .results td { overflow: hidden; text-overflow: ellipsis; }
.results td a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Fix: Player detail modal layout (match index.html) ---- */
.modalBack{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 9999;
}
.modalBack.show{ display:flex; }

.modal{
  width: min(92vw, 560px);
  max-height: min(78vh, 560px);
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}
.modalHead{
  background:#111;
  color:#fff;
  padding:14px 14px 12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.modalTitle{
  font-size:18px;
  font-weight:800;
  line-height:1.2;
}
.modalSub{
  margin-top:4px;
  font-size:13px;
  opacity:.85;
  line-height:1.2;
}
.modalClose{
  appearance:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:22px;
  line-height:1;
  padding:6px 10px;
  cursor:pointer;
}
.modalBody{
  padding:0;
  overflow:auto;
}
.modalTable{ width:100%; }
.modalTable .row{
  display:grid;
  grid-template-columns: 34% 66%;
  gap:12px;
  padding:12px 14px;
  border-top:1px solid #e7e7e7;
}
.modalTable .row:first-child{ border-top:0; }
.modalTable .k{ color:#666; font-weight:700; }
.modalTable .v{ color:#111; font-weight:800; word-break: break-word; }



/* --- modal styles synced from index.html --- */
.modalBack{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:50;
  }
  .modalBack.show{ display:flex; }
  .modal{
    width:min(720px, 100%);
    background:#fff;
    border-radius:22px;
    box-shadow:0 30px 60px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .modalHead{
    padding:16px 18px;
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .modalHead .ttl{ font-size:18px; font-weight:900; }
  .modalHead .subttl{ font-size:13px; font-weight:800; opacity:.9; margin-top:4px; }
  .modalHead button{
    border:none;
    background:transparent;
    color:#fff;
    font-size:22px;
    cursor:pointer;
  }
  .modalBody{ padding:16px 18px 18px; }
  .modalBody .mLine{ margin:8px 0; }
  .modalBody .mKey{ font-weight:900; display:inline-block; min-width:140px; color:#111; }
  .modalBody .mVal{ color:#111; font-weight:700; }

  
/* --- end modal styles sync --- */

/* --- result overflow fix (mobile) --- */
#resultTable, #resultTable table { table-layout: fixed; width: 100%; }
#resultTable th, #resultTable td { overflow: hidden; }
#resultTable td { min-width: 0; }
#resultTable th:first-child, #resultTable td:first-child { width: 48px; }
#resultTable a.link { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* --- end overflow fix --- */

  /* Ensure long player names never overflow */
  a.playerLink{
    display:block;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  /* Note under results */
  .resultNote{
    margin-top:10px;
    font-size:12px;
    color:#a9bbd8;
    line-height:1.4;
  }
  .backWrap{
    margin:18px 0 30px;
    text-align:center;
  }
  .backWrap .backBtn{
    display:inline-block;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);
    color:#d7e6ff;
    text-decoration:none;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>最強チームシミュレーション</h1>
<div class="card">
      <div class="ctrl">
<div class="row">
          <div class="two">
            <label>フォーメーションコンボ</label>
            <select id="comboSel"></select>
          </div>

          <div class="two">
            <label>総合力モード</label>
            <div class="row">
              <label class="pill"><input type="radio" name="mode" value="overall" checked> 初期総合力</label>
              <label class="pill"><input type="radio" name="mode" value="maxUpgrade"> 最大強化</label>
            </div>
          </div>
        </div>

        <div class="row"><button class="btn" id="btnSim">シミュレーション</button><div class="mini" id="status"></div></div>
      </div>

      <div class="grid" id="gridWrap" style="display:none">
        <table>
          <thead>
            <tr>
              <th style="width:64px">ポジ</th>
              <th>ポリシー染め</th>
              <th>ポリシー自由</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
        <div id="resultNote" class="resultNote" style="display:none">※緑色の選手はフォーメーションコンボの発動条件を満たした選手です</div>
</div>
  </div>

  <div class="backWrap"><a class="backBtn" href="https://sakatsuku2026-db.com/">←サイトに戻る</a></div>

  <!-- modal -->
  <div id="modalBack" class="modalBack" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead">
      <div>
        <div id="modalTitle" class="ttl">詳細</div>
        <div id="modalSub" class="subttl"></div>
      </div>
      <button id="modalClose" type="button" aria-label="close">✕</button>
    </div>
    <div id="modalBody" class="modalBody"></div>
  </div>
</div>

<script>
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#39;');
}

(function(){
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  const roman = (n)=>({1:"Ⅰ",2:"Ⅱ",3:"Ⅲ"}[Number(n)]||String(n??""));
  const getMode = ()=>document.querySelector('input[name="mode"]:checked')?.value || "overall";

  let PLAYERS = [];
  let COMBOS = [];
  let SLOTS = [];

  function setStatus(msg, isErr=false){
    $("status").innerHTML = isErr ? `<span class="err">${esc(msg)}</span>` : `<span class="mut">${esc(msg)}</span>`;
  }

  async function loadJson(url){
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error(`${url} (${r.status})`);
  return r.json();
}

async function loadAll(){
  setStatus("データ読み込み中…");

  // players / combos are required
  const [p,c] = await Promise.all([
    loadJson("./players.json"),
    loadJson("./combos.json"),
  ]);

  // formation_slots is optional for initial rendering (combo list should still appear)
  let s = [];
  try{
    s = await loadJson("./formation_slots.json");
  }catch(e){
    console.warn(e);
    // keep going: combo select can still be built
    setStatus("formation_slots.json が見つかりません（コンボ選択は可能ですがシミュレーションは実行できません）", true);
  }

  PLAYERS = (p||[]).filter(x=>x && (x.player_id || x.playerId));
  COMBOS  = (c||[]).filter(x=>x && x.comboId);
  // formation_slots.json may use camelCase or snake_case keys. Normalize here.
  SLOTS   = (s||[])
    .map(x=>({
      comboId: x?.comboId ?? x?.combo_id,
      slotNo:  x?.slotNo  ?? x?.slot_no,
      position: x?.position
    }))
    .filter(x=>x && x.comboId && x.slotNo && x.position);

  // clear status only if we didn't already show the missing-slots warning
  const cur = $("status")?.textContent?.trim();
  if(cur === "データ読み込み中…" || !cur){
    setStatus("");
  }

  rebuildPolicySelect();
  rebuildComboSelect();
}

  function rebuildPolicySelect(){
    const sel = $("policySel");
    if(!sel) return;
    const set = new Set();
    for(const p of PLAYERS){
      const v = (p.policy ?? "").toString().trim();
      if(v) set.add(v);
    }
    const list = [...set].sort((a,b)=>a.localeCompare(b,"ja"));
    sel.innerHTML = `<option value="">（指定なし）</option>` + list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  }


  function rebuildComboSelect(){
    // Show all combos (rank can be 銅/銀/金 etc.). Keep UI minimal and stable.
    const slotSet = new Set((SLOTS||[]).map(s=>String(s.comboId)));
    const base = (COMBOS || []).filter(c=>!slotSet.size || slotSet.has(String(c.comboId)));
    const list = base
      .slice()
      .sort((a,b)=>{
        // rank order: 金 > 銀 > 銅 > others
        const order = (r)=>{
          const s = String(r||"").trim();
          if(s.includes("金")) return 0;
          if(s.includes("銀")) return 1;
          if(s.includes("銅")) return 2;
          return 3;
        };
        const d = order(a.rank) - order(b.rank);
        if(d!==0) return d;
        return String(a.name).localeCompare(String(b.name),"ja");
      });

    const sel = $("comboSel");
    const opts = list.map(c=>{
      const pol = Array.isArray(c.combo_policys) ? c.combo_policys.join("・") : (c.combo_policys||"-");
      const tag = `${c.rank||"-"} / ${c.formation||"-"} / ${pol||"-"}`;
      return `<option value="${esc(c.comboId)}">${esc(c.name)}（${esc(tag)}）</option>`;
    }).join("");

    // add placeholder so empty state is obvious
    sel.innerHTML = `<option value="">（選択してください）</option>` + opts;

    if(!list.length){
      setStatus("コンボが見つかりません（combos.json を確認してください）", true);
    }
  }

  function buildRequirementMap(combo){
    const m = new Map(); // position -> array of req
    (combo.combo_requirements||[]).forEach(req=>{
      const pos = req.position;
      if(!pos) return;
      if(!m.has(pos)) m.set(pos, []);
      m.get(pos).push(req);
    });
    return m;
  }

  function matchPlayerForSlot(player, combo, slotPos, reqMap, kw, forcedPolicy){
    // NOTE: Slot assignment should be based on position (+ optional policy/keyword) only.
    // combo_requirements is used for "強調表示" (highlight) separately.
    if(kw){
      const name = String(player?.name ?? '');
      if(!name.includes(kw)) return false;
    }

    // Position match
    const pos = String(player?.mainPosition ?? '');
    if(pos !== slotPos) return false;

    // Policy match (only when forced)
    if(forcedPolicy){
      const pol = String(player?.policy ?? '');
      if(pol !== forcedPolicy) return false;
    }

    return true;
  }

function simulate(){
  if(!SLOTS.length){
    setStatus("formation_slots.json が見つかりません。ファイルを同じフォルダに配置してください。", true);
    return;
  }
  const comboId = $("comboSel")?.value;
  const combo = COMBOS.find(c=>String(c.comboId)===String(comboId));
  if(!combo){
    setStatus("フォーメーションコンボを選択してください。", true);
    return;
  }

  const mode = getMode(); // overall / maxUpgrade
  const slots = SLOTS
    .filter(s=>String(s.comboId)===String(comboId))
    .sort((a,b)=>Number(a.slotNo)-Number(b.slotNo));

  if(!slots.length){
    setStatus("選択したコンボのスロット定義が見つかりません（formation_slots.json を確認してください）", true);
    return;
  }

  const forcedPolicy = Array.isArray(combo.combo_policys) ? combo.combo_policys[0] : (combo.combo_policys || "");
  const reqMap = buildRequirementMap(combo);

  // greedy pick (unique players)
  const pickBest = (available, slotPos, forcePol)=>{
    let best = null;
    let bestVal = -Infinity;
    for(const p of available){
      if(!matchPlayerForSlot(p, combo, slotPos, reqMap, "", forcePol)) continue;
      const v = Number(p?.[mode] ?? -Infinity);
      if(v > bestVal){
        bestVal = v;
        best = p;
      }
    }
    return best;
  };

  const highlightOK = (player, slotPos)=>{
    const reqs = reqMap.get(slotPos) || [];
    if(!reqs.length) return false;
    const ps = String(player?.playStyle ?? "");
    const lv = Number(player?.playStyleLv ?? 0);
    return reqs.some(r=>String(r.playStyle??"")===ps && lv >= Number(r.playStyleLv ?? 0));
  };

  const makeCell = (player, slotPos)=>{
    if(!player) return `<span class="mut">-</span>`;
    const v = Number(player?.[mode] ?? 0);
    const cls = highlightOK(player, slotPos) ? "hit" : "";
    return `<div class="two">
      <div class="${cls}"><span class="v">${esc(player.name||"-")}</span></div>
      <div class="mini">${mode==="overall"?"初期":"最大"}: ${Number.isFinite(v)?v:"-"}</div>
    </div>`;
  };

  const tbody = $("tbody");
  tbody.innerHTML = "";

  // policy-dye column: force policy for all slots
  const availA = [...PLAYERS];
  const picksA = [];
  for(const s of slots){
    const p = pickBest(availA, s.position, forcedPolicy || "");
    picksA.push({slot:s, player:p});
    if(p){
      const idx = availA.indexOf(p);
      if(idx>=0) availA.splice(idx,1);
    }
  }

  // free column: no forced policy
  const availB = [...PLAYERS];
  const picksB = [];
  for(const s of slots){
    const p = pickBest(availB, s.position, "");
    picksB.push({slot:s, player:p});
    if(p){
      const idx = availB.indexOf(p);
      if(idx>=0) availB.splice(idx,1);
    }
  }

  for(let i=0;i<slots.length;i++){
    const s = slots[i];
    const a = picksA[i]?.player || null;
    const b = picksB[i]?.player || null;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="pos">${esc(s.position)}</td>
      <td>${makeCell(a, s.position)}</td>
      <td>${makeCell(b, s.position)}</td>
    `;
    tbody.appendChild(tr);
  }

  $("gridWrap").style.display = "";
  $("resultNote").style.display = "";
  setStatus("");
}

  // events
  $("btnSim").addEventListener("click", simulate);
  

  loadAll().catch(err=>{
    console.error(err);
    setStatus("データの読み込みに失敗しました（players.json / combos.json / formation_slots.json を同じフォルダに配置してください）", true);
  });
})();
</script>
</body>
</html>
