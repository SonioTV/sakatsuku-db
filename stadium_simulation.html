<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタジアム施設シミュレーション | サカつく2026 DB</title>
<link rel="canonical" href="https://sakatsuku2026-db.com/stadium_simulation.html">
<style>
:root{
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:rgba(17,24,39,.12);
  --shadow:0 18px 50px rgba(0,0,0,.10);
  --radius:24px;
  --blue:#0b5bd3;
  --blue-soft:#bcd2ff;
  --orange:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,Arial,sans-serif;}
.wrap{max-width:1080px;margin:0 auto;padding:26px 16px 40px;}
.pageTitleImg{text-align:center;margin:10px 0 6px;}
.pageTitleImg img{max-width:100%;height:auto;width:420px;}
h1{font-size:38px;line-height:1.15;margin:10px 0 10px;text-align:center;font-weight:900;letter-spacing:.01em;}
.nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 18px;}
.nav a{display:inline-block;padding:14px 22px;border-radius:22px;border:3px solid var(--blue-soft);background:#fff;color:var(--blue);font-weight:900;text-decoration:none;font-size:22px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;border:1px solid var(--border);}
.sectionTitle{font-size:32px;font-weight:900;text-align:center;margin:8px 0 18px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;}
.field label{display:block;font-size:17px;font-weight:900;margin:0 0 8px;}
.bigSelect{width:100%;font-size:24px;font-weight:900;border-radius:20px;border:3px solid rgba(17,24,39,.18);padding:18px 16px;outline:none;background:#e9e9e9;color:var(--blue);}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.bigBtn,.subBtn{border:none;border-radius:28px;padding:18px 22px;font-weight:900;cursor:pointer;}
.bigBtn{min-width:300px;font-size:34px;background:var(--orange);color:#fff;box-shadow:0 20px 40px rgba(245,158,11,.30);}
.subBtn{min-width:180px;font-size:22px;background:#fff;color:var(--blue);border:3px solid var(--blue-soft);}
.noteBox{margin-top:16px;padding:14px 16px;border-radius:18px;background:#f8fbff;border:1px solid rgba(11,91,211,.10);color:#334155;font-weight:700;line-height:1.7;font-size:14px;}
.hr{height:2px;background:rgba(17,24,39,.10);margin:18px 0;}
.error{display:none;margin-top:14px;padding:12px 14px;border-radius:16px;background:#fff1f2;color:#b42318;border:1px solid rgba(180,35,24,.18);font-weight:900;}
.outArea{display:none;margin-top:8px;}
.kpiGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border:2px solid rgba(17,24,39,.08);border-radius:20px;padding:14px;text-align:center;}
.kpiLabel{font-size:14px;color:var(--muted);font-weight:900;margin-bottom:6px;}
.kpiValue{font-size:30px;color:var(--blue);font-weight:900;line-height:1.1;}
.summaryCard{background:#fff;border:2px solid rgba(17,24,39,.08);border-radius:24px;padding:16px 16px 8px;margin-bottom:16px;}
.summaryTitle{font-size:22px;font-weight:900;margin:0 0 12px;text-align:center;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 12px;border-radius:999px;background:#eef4ff;color:var(--blue);font-size:14px;font-weight:900;line-height:1.2;border:1px solid rgba(11,91,211,.14);}
.deviceList{display:grid;gap:12px;}
.item{border:2px solid rgba(17,24,39,.10);border-radius:24px;padding:20px;background:#fff;}
.itemTop{display:grid;grid-template-columns:156px 1fr;gap:14px;align-items:center;}
.itemImageWrap{width:156px;height:117px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.itemImage{width:100%;height:100%;object-fit:cover;display:block;}
.itemImagePlaceholder{font-size:14px;font-weight:800;color:var(--muted);text-align:center;line-height:1.4;padding:10px;}
.itemBody{min-width:0;display:flex;flex-direction:column;gap:10px;}
.itemSub{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;}
.itemSub .badge{min-width:180px;justify-content:flex-start;padding:10px 18px;font-size:16px;}
.itemEffectLine{font-size:18px;font-weight:900;line-height:1.6;margin:14px 0 0;}
.compareCard{background:#f8fafc;border:1px dashed rgba(17,24,39,.15);border-radius:20px;padding:14px;margin-top:16px;}
.compareTitle{font-size:18px;font-weight:900;margin:0 0 10px;}
.compareText{font-size:14px;line-height:1.7;color:#334155;font-weight:800;margin:0;}
.footerNote{text-align:center;color:var(--muted);font-weight:900;margin-top:12px;font-size:13px;}
#scrollTopBtn{position:fixed;right:16px;bottom:20px;width:48px;height:48px;border:none;border-radius:50%;background:#0b5bd3;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;display:none;z-index:999;}
#scrollTopBtn:hover{opacity:.9;}
@media (max-width:820px){.grid{grid-template-columns:1fr;}.kpiGrid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){
  h1{font-size:30px;}
  .nav a{font-size:20px;}
  .sectionTitle{font-size:26px;}
  .bigSelect{font-size:22px;padding:14px;border-radius:18px;}
  .bigBtn{min-width:100%;font-size:26px;padding:16px;border-radius:22px;}
  .subBtn{min-width:100%;font-size:20px;padding:14px;border-radius:20px;}
  .kpiValue{font-size:24px;}
  .item{padding:16px;}
  .itemTop{grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
  .itemImageWrap{width:100%;height:auto;aspect-ratio:4 / 3;}
  .itemSub{gap:10px;}
  .itemSub .badge{min-width:unset;width:100%;justify-content:center;font-size:13px;padding:8px 10px;min-height:32px;}
  .itemEffectLine{font-size:14px;margin-top:12px;}
  .pageTitleImg img{width:85%;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="pageTitleImg">
    <img src="img/title.png" alt="サカつく2026 DB">
  </div>

  <h1>スタジアム施設シミュレーション</h1>

  <div class="nav">
    <a href="index.html">検索ツールへ戻る</a>
    <a href="stadium.html">施設一覧へ</a>
  </div>

  <div class="card">
    <div class="sectionTitle">伸ばしたい効果を選択</div>

    <div class="grid">
      <div class="field">
        <label for="firstEffect">1番伸ばしたい効果</label>
        <select id="firstEffect" class="bigSelect"></select>
      </div>
      <div class="field">
        <label for="secondEffect">2番目に伸ばしたい効果</label>
        <select id="secondEffect" class="bigSelect"></select>
      </div>
      <div class="field">
        <label for="stadiumLevel">スタジアムLv</label>
        <select id="stadiumLevel" class="bigSelect"></select>
      </div>
    </div>

    <div class="actions">
      <button id="runBtn" class="bigBtn" type="button">最適構成を表示</button>
      <button id="resetBtn" class="subBtn" type="button">選択をリセット</button>
    </div>

    <div class="noteBox">
      ・選択した<strong>スタジアムLv</strong>に応じて、<strong>facility_space</strong> を上限コストとして使用します。<br>
      ・設置可能施設は、選択したスタジアムLv以上の <strong>install_level</strong> を満たす施設が対象です。<br>
      ・同一カテゴリは <strong>stack_group</strong> 以内で採用します。<br>
      ・同点時は、合計コストが低い構成を優先します。
    </div>

    <div id="errorBox" class="error"></div>

    <div class="hr"></div>

    <div id="outArea" class="outArea">
      <div class="kpiGrid">
        <div class="kpi">
          <div class="kpiLabel">合計コスト</div>
          <div id="totalCost" class="kpiValue">0</div>
        </div>
        <div class="kpi">
          <div id="firstLabel" class="kpiLabel">1番目</div>
          <div id="firstValue" class="kpiValue">0</div>
        </div>
        <div class="kpi">
          <div id="secondLabel" class="kpiLabel">2番目</div>
          <div id="secondValue" class="kpiValue">0</div>
        </div>
      </div>

      <div class="summaryCard">
        <h2 class="summaryTitle">おすすめ施設構成</h2>
        <div id="summaryBadges" class="badges"></div>
        <div id="deviceList" class="deviceList"></div>
        <div id="compareArea" class="compareCard" style="display:none;">
          <h3 class="compareTitle">補足</h3>
          <p id="compareText" class="compareText"></p>
        </div>
        <div id="footerNote" class="footerNote"></div>
      </div>
    </div>
  </div>
</div>

<button id="scrollTopBtn">▲</button>

<script>
const JSON_PATH = "stadium_facilities.json";
const EXPANSIONS_PATH = "stadium_expansion.json";
const IMAGE_BASE = "img/stadium_facilities/";
const IMAGE_EXTS = ["png","jpg","jpeg","webp"];
let currentMaxCost = 32;

const EFFECT_ORDER = ["満足度","収入力","PR力"];
const effectPriority = new Map(EFFECT_ORDER.map((v,i)=>[v,i]));

let facilities = [];
let expansions = [];
let availableFacilities = [];
let effects = [];

function norm(v){ return (v ?? "").toString().trim(); }
function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function escapeHtml(str){ return String(str).replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

function cmpScore(a, b){
  if (!b) return 1;
  if (a.score1 !== b.score1) return a.score1 - b.score1;
  if (a.score2 !== b.score2) return a.score2 - b.score2;
  if (a.cost !== b.cost) return b.cost - a.cost;
  if (a.count !== b.count) return a.count - b.count;
  return 0;
}

function facilityEffectValue(item, effectName){
  let sum = 0;
  for (let i=1; i<=3; i++) {
    if (norm(item["effect"+i]) === effectName) sum += num(item["effect_value"+i]);
  }
  return sum;
}

function facilityEffectsToString(item){
  const parts = [];
  for (let i=1; i<=3; i++) {
    const e = norm(item["effect"+i]);
    const v = item["effect_value"+i];
    if (!e || v === null || v === undefined || v === "") continue;
    parts.push(`${e}+${v}`);
  }
  return parts.join(" / ");
}

function buildEffects(items){
  const set = new Set();
  items.forEach(item => {
    for (let i=1; i<=3; i++) {
      const e = norm(item["effect"+i]);
      if (e) set.add(e);
    }
  });
  return Array.from(set).sort((a,b)=>{
    const ai = effectPriority.has(a) ? effectPriority.get(a) : 999;
    const bi = effectPriority.has(b) ? effectPriority.get(b) : 999;
    return ai !== bi ? ai - bi : a.localeCompare(b, "ja");
  });
}

function populateSelects(){
  const first = document.getElementById("firstEffect");
  const second = document.getElementById("secondEffect");

  const options = effects.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join("");
  first.innerHTML = options;
  second.innerHTML = options;
  first.selectedIndex = 0;
  second.selectedIndex = Math.min(1, Math.max(effects.length - 1, 0));

  const levelSelect = document.getElementById("stadiumLevel");
  levelSelect.innerHTML = expansions
    .slice()
    .sort((a,b)=>num(a.level)-num(b.level))
    .map(row => `<option value="${num(row.level)}">スタジアムLv ${num(row.level)}</option>`)
    .join("");
  levelSelect.selectedIndex = Math.max(expansions.length - 1, 0);
  updateAvailableFacilities();
}

function getSelectedLevel(){
  return num(document.getElementById("stadiumLevel")?.value || 0);
}

function getExpansionByLevel(level){
  return expansions.find(row => num(row.level) === num(level)) || null;
}

function updateAvailableFacilities(){
  const selectedLevel = getSelectedLevel();
  const expansion = getExpansionByLevel(selectedLevel);
  currentMaxCost = expansion ? num(expansion.facility_space) : 32;
  availableFacilities = facilities.filter(item => {
    const install = item.install_level;
    if (install === null || install === undefined || install === "") return false;
    return num(install) <= selectedLevel;
  });
}

function showError(msg){
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}

function clearError(){
  const box = document.getElementById("errorBox");
  box.textContent = "";
  box.style.display = "none";
}

function createFacilityImage(facilityId, facilityName){
  const wrap = document.createElement("div");
  wrap.className = "itemImageWrap";

  const img = document.createElement("img");
  img.className = "itemImage";
  img.alt = facilityName;
  img.dataset.index = "0";

  const trySetSrc = (index) => {
    if (index >= IMAGE_EXTS.length) {
      wrap.innerHTML = `<div class="itemImagePlaceholder">画像準備中<br>${escapeHtml(facilityId)}</div>`;
      return;
    }
    img.dataset.index = String(index);
    img.src = `${IMAGE_BASE}${facilityId}.${IMAGE_EXTS[index]}`;
  };

  img.addEventListener("error", () => {
    const next = Number(img.dataset.index || "0") + 1;
    trySetSrc(next);
  });

  wrap.appendChild(img);
  trySetSrc(0);
  return wrap;
}

function categoryOptionsFor(categoryItems, first, second){
  const maxInCategory = Math.max(...categoryItems.map(v => num(v.stack_group || 0)), 0);
  const options = [];
  const n = categoryItems.length;

  function pushOption(indices){
    const chosen = indices.map(i => categoryItems[i]);
    options.push({
      items: chosen,
      cost: chosen.reduce((s,v)=>s+num(v.cost), 0),
      score1: chosen.reduce((s,v)=>s+facilityEffectValue(v, first), 0),
      score2: chosen.reduce((s,v)=>s+facilityEffectValue(v, second), 0),
      count: chosen.length
    });
  }

  pushOption([]);
  for (let i=0; i<n; i++) pushOption([i]);
  if (maxInCategory >= 2) {
    for (let i=0; i<n; i++) {
      for (let j=i+1; j<n; j++) pushOption([i,j]);
    }
  }
  if (maxInCategory >= 3) {
    for (let i=0; i<n; i++) {
      for (let j=i+1; j<n; j++) {
        for (let k=j+1; k<n; k++) pushOption([i,j,k]);
      }
    }
  }
  return options.filter(opt => opt.cost <= currentMaxCost);
}

function solveSimulation(first, second){
  const groups = new Map();
  availableFacilities.forEach(item => {
    const cat = norm(item.category);
    if (!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(item);
  });

  let states = new Array(currentMaxCost + 1).fill(null);
  states[0] = {cost:0, score1:0, score2:0, count:0, items:[]};

  Array.from(groups.values()).forEach(categoryItems => {
    const opts = categoryOptionsFor(categoryItems, first, second);
    const nextStates = new Array(currentMaxCost + 1).fill(null);

    for (let currentCost=0; currentCost<=currentMaxCost; currentCost++) {
      const base = states[currentCost];
      if (!base) continue;

      for (const opt of opts) {
        const newCost = currentCost + opt.cost;
        if (newCost > currentMaxCost) continue;

        const candidate = {
          cost: newCost,
          score1: base.score1 + opt.score1,
          score2: base.score2 + opt.score2,
          count: base.count + opt.count,
          items: base.items.concat(opt.items)
        };

        if (cmpScore(candidate, nextStates[newCost]) > 0) {
          nextStates[newCost] = candidate;
        }
      }
    }
    states = nextStates;
  });

  let best = null;
  let secondBest = null;

  states.forEach(state => {
    if (!state) return;
    if (cmpScore(state, best) > 0) {
      secondBest = best;
      best = state;
    } else if (!secondBest || cmpScore(state, secondBest) > 0) {
      const sameAsBest = best &&
        state.cost === best.cost &&
        state.score1 === best.score1 &&
        state.score2 === best.score2 &&
        state.items.map(v=>v.facility_id).sort().join(",") === best.items.map(v=>v.facility_id).sort().join(",");
      if (!sameAsBest) secondBest = state;
    }
  });

  return {best, secondBest};
}

function renderResult(first, second, result){
  const {best, secondBest} = result;
  document.getElementById("outArea").style.display = "block";

  document.getElementById("totalCost").textContent = best.cost;
  document.getElementById("firstLabel").textContent = `1番目：${first}`;
  document.getElementById("firstValue").textContent = best.score1;
  document.getElementById("secondLabel").textContent = `2番目：${second}`;
  document.getElementById("secondValue").textContent = best.score2;

  const summaryBadges = document.getElementById("summaryBadges");
  summaryBadges.innerHTML = `
    <span class="badge">採用施設数：${best.items.length}</span>
    <span class="badge">合計コスト：${best.cost} / ${currentMaxCost}</span>
    <span class="badge">${escapeHtml(first)} 合計：${best.score1}</span>
    <span class="badge">${escapeHtml(second)} 合計：${best.score2}</span>
  `;

  const sortedItems = [...best.items].sort((a,b)=>{
    const ap = facilityEffectValue(a, first);
    const bp = facilityEffectValue(b, first);
    if (bp !== ap) return bp - ap;
    const as = facilityEffectValue(a, second);
    const bs = facilityEffectValue(b, second);
    if (bs !== as) return bs - as;
    if (num(a.cost) !== num(b.cost)) return num(a.cost) - num(b.cost);
    return norm(a.facility_name).localeCompare(norm(b.facility_name), "ja");
  });

  const deviceList = document.getElementById("deviceList");
  deviceList.innerHTML = "";

  sortedItems.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";

    const image = createFacilityImage(norm(item.facility_id), norm(item.facility_name));

    const body = document.createElement("div");
    body.className = "itemBody";
    body.innerHTML = `
      <div class="itemSub">
        <span class="badge">カテゴリ：${escapeHtml(norm(item.category))}</span>
        <span class="badge">設置コスト：${escapeHtml(item.cost ?? "-")}</span>
        <span class="badge">設置可能Lv：${escapeHtml(item.install_level ?? "-")}</span>
      </div>
    `;

    const top = document.createElement("div");
    top.className = "itemTop";
    top.appendChild(image);
    top.appendChild(body);

    const effect = document.createElement("p");
    effect.className = "itemEffectLine";
    effect.textContent = `上昇効果：${facilityEffectsToString(item) || "-"}`;

    div.appendChild(top);
    div.appendChild(effect);
    deviceList.appendChild(div);
  });

  const compareArea = document.getElementById("compareArea");
  const compareText = document.getElementById("compareText");
  if (secondBest) {
    compareArea.style.display = "block";
    compareText.textContent =
      `次点構成は「${first}=${secondBest.score1}、${second}=${secondBest.score2}、コスト=${secondBest.cost}」でした。` +
      ` 現在表示中の構成は、優先順位どおり 1番目 → 2番目 の順で最も有利な組み合わせです。`;
  } else {
    compareArea.style.display = "none";
    compareText.textContent = "";
  }

  const selectedLevel = getSelectedLevel();
  document.getElementById("footerNote").textContent =
    `スタジアムLv：${selectedLevel} / 上限コスト：${currentMaxCost} / 採用カテゴリ数：${new Set(best.items.map(v=>norm(v.category))).size} / 総施設数：${best.items.length}`;
}

function runSimulation(){
  clearError();
  updateAvailableFacilities();
  const first = norm(document.getElementById("firstEffect").value);
  const second = norm(document.getElementById("secondEffect").value);
  const selectedLevel = getSelectedLevel();

  if (!first || !second) {
    showError("2つの効果をすべて選択してください。");
    return;
  }
  if (first === second) {
    showError("1番目と2番目は別の効果を選択してください。");
    return;
  }
  if (!selectedLevel) {
    showError("スタジアムLvを選択してください。");
    return;
  }
  if (!availableFacilities.length) {
    showError("選択したスタジアムLvで設置可能な施設がありません。");
    return;
  }

  const result = solveSimulation(first, second);
  if (!result.best) {
    showError("条件に合う構成が見つかりませんでした。");
    return;
  }
  renderResult(first, second, result);
}

function resetSelections(){
  populateSelects();
  clearError();
  document.getElementById("outArea").style.display = "none";
}

async function init(){
  try {
    const [facilitiesRes, expansionsRes] = await Promise.all([
      fetch(JSON_PATH, {cache:"no-store"}),
      fetch(EXPANSIONS_PATH, {cache:"no-store"})
    ]);
    facilities = await facilitiesRes.json();
    expansions = await expansionsRes.json();
    effects = buildEffects(facilities);
    populateSelects();
  } catch (e) {
    console.error(e);
    showError("データの読み込みに失敗しました。stadium_facilities.json / stadium_expansion.json の配置を確認してください。");
  }
}

document.getElementById("runBtn").addEventListener("click", runSimulation);
document.getElementById("resetBtn").addEventListener("click", resetSelections);
document.getElementById("stadiumLevel").addEventListener("change", () => {
  updateAvailableFacilities();
  clearError();
  document.getElementById("outArea").style.display = "none";
});
init();

const scrollBtn = document.getElementById("scrollTopBtn");
window.addEventListener("scroll", () => {
  scrollBtn.style.display = window.scrollY > 200 ? "block" : "none";
});
scrollBtn.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
