<style>

<div class="wrap">
  <div class="topbar">

  <h1>SP選手評価ツール</h1>
  <div class="note">
    条件（ポリシー/ポジション/プレイスタイル + キーワード）で候補を絞り、SP選手の順位・コンボ適性・互換選手を表示します。
  </div>

  <div class="grid">
    <!-- left: controls -->
    <div class="card">
      <div style="font-weight:900;font-size:18px;margin-bottom:10px;">① 評価対象の選択</div>

      <div class="ctrlRow">
        <div>
          <label>ポリシー</label>
          <select id="fPolicy"><option value="">（指定なし）</option></select>
        </div>
        <div>
          <label>ポジション</label>
          <select id="fPos"><option value="">（指定なし）</option></select>
        </div>
        <div>
          <label>プレイスタイル</label>
          <select id="fStyle"><option value="">（指定なし）</option></select>
        </div>
        <div>
          <label>キーワード（選手名）</label>
          <input id="fKw" type="text" placeholder="例：サカ / ロナウド" />
        </div>

          <button class="btn gray" id="btnReset">リセット</button>

          <label>評価するSP選手（候補から1人選択）</label>

    <!-- right: result -->

      <div style="font-weight:900;font-size:18px;margin-bottom:10px;">② 評価結果</div>

        <div class="note" style="margin-top:4px;">左側で候補を出して、評価したい選手を選択してください。</div>

<!-- Modal -->
<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">

    <div class="modal-head">
      <div id="modalTitle" class="modal-title">詳細</div>

    </div>
    <div id="modalBody" class="modal-body"></div>

<script>
/* ===== Data ===== */
let PLAYERS = [];
let COMBOS = [];
let SP_PLAYERS = [];

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const normalize = (s)=>String(s??"").trim();

function toNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

/* Roman Lv */
function romanLv(n){
  const v = toNum(n);
  if(v===1) return "Ⅰ";
  if(v===2) return "Ⅱ";
  if(v===3) return "Ⅲ";
  return "";
}

/* ===== Ranking (competition ranking: 1,2,2,4...) ===== */
function rankCompetition(sortedValuesDesc, targetValue){
  let rank = 1;
  let prev = null;
  let seen = 0;
  for(const v of sortedValuesDesc){
    seen++;
    if(prev === null){
      prev = v;
    }else if(v !== prev){
      rank = seen;
      prev = v;
    }
    if(v === targetValue) return rank;
  }
  return null;
}

function makeRankLine(rank, total){
  if(rank==null) return "-";
  return `${rank}位（${total}人中）`;
}

/* ===== Inclusive Lv match =====
   Requirement Lv <= Player Lv => match
*/
function lvInclusiveMatch(reqLv, playerLv){
  const r = toNum(reqLv);
  const p = toNum(playerLv);
  if(r==null || p==null) return true;
  return p >= r;
}

/* ===== UI setup ===== */
function uniqueSorted(arr){
  return [...new Set(arr.filter(v=>normalize(v)!==""))].sort((a,b)=>String(a).localeCompare(String(b), "ja"));
}

function fillSelect(sel, items){
  const keepFirst = sel.options.length ? sel.options[0].outerHTML : "";
  sel.innerHTML = keepFirst + items.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
}

async function loadData(){
  const [pRes, cRes] = await Promise.all([
    fetch("players.json", {cache:"no-store"}),
    fetch("combos.json", {cache:"no-store"})
  ]);
  if(!pRes.ok) throw new Error("players.json の読み込みに失敗しました");
  if(!cRes.ok) throw new Error("combos.json の読み込みに失敗しました");
  PLAYERS = await pRes.json();
  COMBOS = await cRes.json();

  // SP選手の定義：category が "SP選手" のものを優先。無い場合は全件をSP扱いにフォールバック。
  const hasCategory = PLAYERS.some(p=>p && p.category !== undefined);
  SP_PLAYERS = hasCategory
    ? PLAYERS.filter(p=>normalize(p.category)==="SP選手")
    : [...PLAYERS];

  fillSelect($("fPolicy"), uniqueSorted(SP_PLAYERS.map(p=>p.policy)));
  fillSelect($("fPos"), uniqueSorted(SP_PLAYERS.map(p=>p.mainPosition)));
  fillSelect($("fStyle"), uniqueSorted(SP_PLAYERS.map(p=>p.playStyle)));
}

/* ===== Candidate filter ===== */
function filterCandidates(){
  const pol = normalize($("fPolicy").value);
  const pos = normalize($("fPos").value);
  const sty = normalize($("fStyle").value);
  const kw  = normalize($("fKw").value).toLowerCase();

  let list = SP_PLAYERS.filter(p=>{
    if(pol && normalize(p.policy)!==pol) return false;
    if(pos && normalize(p.mainPosition)!==pos) return false;
    if(sty && normalize(p.playStyle)!==sty) return false;
    if(kw){
      const name = normalize(p.name || p.player_name || "");
      if(!name.toLowerCase().includes(kw)) return false;
    }
    return true;
  });

  list.sort((a,b)=>{
    const ao = toNum(a.overall) ?? -Infinity;
    const bo = toNum(b.overall) ?? -Infinity;
    if(bo!==ao) return bo-ao;
    const am = toNum(a.maxUpgrade) ?? -Infinity;
    const bm = toNum(b.maxUpgrade) ?? -Infinity;
    if(bm!==am) return bm-am;
    return normalize(a.name||"").localeCompare(normalize(b.name||""), "ja");
  });

  const sel = $("playerPick");
  if(!list.length){
    sel.innerHTML = `<option value="">（該当なし）</option>`;
    return { list: [], message: "条件に一致するSP選手が見つかりませんでした。" };
  }

  // 表示は「選手名のみ」
  sel.innerHTML = list.map(p=>{
    const id = p.player_id || p.playerId || "";
    const nm = p.name || p.player_name || id;
    return `<option value="${esc(id)}">${esc(nm)}</option>`;
  }).join("");
  sel.value = (list[0].player_id || list[0].playerId || "");
  return { list, message: `候補：${list.length}人` };
}

function findPlayerById(pid){
  return SP_PLAYERS.find(p=>(p.player_id===pid || p.playerId===pid)) || null;
}

/* ===== Ranking calculations ===== */
function calcRankings(target){
  const overall = toNum(target.overall);
  const maxUp   = toNum(target.maxUpgrade);

  const make = (pool, labelKey, labelVal)=>{
    const oVals = pool.map(p=>toNum(p.overall)).filter(v=>v!=null).sort((a,b)=>b-a);
    const mVals = pool.map(p=>toNum(p.maxUpgrade)).filter(v=>v!=null).sort((a,b)=>b-a);

    const oRank = (overall!=null) ? rankCompetition(oVals, overall) : null;
    const mRank = (maxUp!=null) ? rankCompetition(mVals, maxUp) : null;

    return { labelKey, labelVal, total: pool.length, overallRank:oRank, maxRank:mRank };
  };

  return [
    make(SP_PLAYERS, "SP選手全体", ""),
    make(SP_PLAYERS.filter(p=>normalize(p.policy)===normalize(target.policy)), "ポリシー", normalize(target.policy)),
    make(SP_PLAYERS.filter(p=>normalize(p.mainPosition)===normalize(target.mainPosition)), "ポジション", normalize(target.mainPosition)),
    make(SP_PLAYERS.filter(p=>normalize(p.playStyle)===normalize(target.playStyle)), "プレイスタイル", normalize(target.playStyle)),
  ];
}

/* ===== Combo helpers ===== */
function getComboId(c){ return normalize(c.comboId || c.combo_id || c.id || c.comboID || ""); }
function getComboName(c){ return normalize(c.name || c.combo_name || c.comboName || c.combo_name_jp || getComboId(c) || ""); }
function getComboRank(c){ return normalize(c.rank || c.combo_rank || ""); }
function getComboPolicies(c){
  const v = c.combo_policys || c.comboPolicies || c.policies;
  if(Array.isArray(v)) return v.map(normalize).filter(Boolean);
  if(typeof v === "string" && v.trim()!=="") return [normalize(v)];
  return [];
}
function getComboReqs(c){
  const v = c.combo_requirements || c.comboRequirements || c.requirements || c.reqs || c.conditions || c.conditionList;
  return Array.isArray(v) ? v : [];
}
function getReqField(req, keys, def=""){
  for(const k of keys){
    if(req && req[k] !== undefined && req[k] !== null && req[k] !== "") return req[k];
  }
  return def;
}

/* ===== Combo aptitude (Gold only) ===== */
function calcGoldCombos(target){
  const pPol = normalize(target.policy);
  const pPos = normalize(target.mainPosition);
  const pSty = normalize(target.playStyle);
  const pLv  = toNum(target.playStyleLv);

  const gold = COMBOS.filter(c=>getComboRank(c)==="金");

  const full = [];
  const polDiff = [];
  const posDiff = [];

  for(const c of gold){
    const pols = getComboPolicies(c);
    const polOk = (pols.length===0) ? true : pols.includes(pPol);
    const reqs = getComboReqs(c);

    let hasFull = false;
    let hasPolDiff = false;
    let hasPosDiff = false;

    for(const r of reqs){
      const rPos = normalize(getReqField(r, ["position","pos","ポジション"], ""));
      const rSty = normalize(getReqField(r, ["playStyle","style","プレイスタイル"], ""));
      const rLv  = getReqField(r, ["playStyleLv","play_style_lv","lv","level","Lv","プレイスタイルLv"], null);

      const styOk = (rSty==="") ? true : (rSty===pSty);
      const lvOk  = lvInclusiveMatch(rLv, pLv);
      const posOk = (rPos==="") ? true : (rPos===pPos);

      const corePS = styOk && lvOk;
      const corePosStyle = posOk && corePS;

      if(corePosStyle && polOk) hasFull = true;
      else if(corePosStyle && !polOk) hasPolDiff = true;
      else if(corePS && polOk && !posOk) hasPosDiff = true;
    }

    // 排他的（優先: 完全一致 > ポリシー違い > ポジション違い）
    if(hasFull) full.push(c);
    else if(hasPolDiff) polDiff.push(c);
    else if(hasPosDiff) posDiff.push(c);
  }

  const sortJa = (a,b)=>getComboName(a).localeCompare(getComboName(b),"ja");
  full.sort(sortJa); polDiff.sort(sortJa); posDiff.sort(sortJa);

  return { full, polDiff, posDiff };
}

/* ===== Compatibility players ===== */
function pickOnePlayer(list){
  if(!list.length) return { show:"-", extra:0, pick:null };
  const sorted = [...list].sort((a,b)=>{
    const ao = toNum(a.overall) ?? -Infinity;
    const bo = toNum(b.overall) ?? -Infinity;
    if(bo!==ao) return bo-ao;
    const am = toNum(a.maxUpgrade) ?? -Infinity;
    const bm = toNum(b.maxUpgrade) ?? -Infinity;
    if(bm!==am) return bm-am;
    return normalize(a.name||"").localeCompare(normalize(b.name||""), "ja");
  });
  const pick = sorted[0];
  const nm = normalize(pick.name || pick.player_name || "");
  return { show: nm || "-", extra: list.length-1, pick };
}

function calcCompat(target){
  const pid = target.player_id || target.playerId || "";
  const tPol = normalize(target.policy);
  const tPos = normalize(target.mainPosition);
  const tSty = normalize(target.playStyle);
  const tLv  = toNum(target.playStyleLv);

  const others = SP_PLAYERS.filter(p=> (p.player_id||p.playerId||"") !== pid);

  const styleMatchInclusive = (cand)=>{
    if(normalize(cand.playStyle)!==tSty) return false;
    return lvInclusiveMatch(tLv, toNum(cand.playStyleLv));
  };

  const full = [];
  const polDiff = [];
  const posDiff = [];
  const styleDiff = [];

  for(const p of others){
    const pPol = normalize(p.policy);
    const pPos = normalize(p.mainPosition);
    const pSty = normalize(p.playStyle);

    const posOk = (pPos===tPos);
    const polOk = (pPol===tPol);
    const styOk = styleMatchInclusive(p);

    if(polOk && posOk && styOk) full.push(p);
    else if(!polOk && posOk && styOk) polDiff.push(p);
    else if(polOk && !posOk && styOk) posDiff.push(p);
    else if(polOk && posOk && !styOk && pSty!=="") styleDiff.push(p);
  }

  return { full, polDiff, posDiff, styleDiff };
}

/* ===== Modal ===== */
function openModal(title, bodyHtml){
  $("modalTitle").textContent = title || "詳細";
  $("modalBody").innerHTML = bodyHtml || "";
  $("modalBackdrop").style.display = "flex";
}
function closeModal(){
  $("modalBackdrop").style.display = "none";
  $("modalBody").innerHTML = "";
}
$("modalClose").addEventListener("click", closeModal);
$("modalBackdrop").addEventListener("click", (e)=>{
  if(e.target === $("modalBackdrop")) closeModal();
});

/* combo detail modal */
function openComboDetail(combo){
  if(!combo) return;
  const nm = getComboName(combo);
  const rank = getComboRank(combo) || "-";
  const pols = getComboPolicies(combo);
  const polText = pols.length ? pols.join(" / ") : "-";
  const effect = normalize(combo.effect || combo.combo_effect || "-");
  const reqNum = toNum(combo.requiredPlayers ?? combo.required_players ?? combo.required ?? null);
  const acM = normalize(combo.acquisitionMethod || combo.acquisition_method || "-");
  const acP = normalize(combo.acquisitionPlace || combo.acquisition_place || "-");
  const period = normalize(combo.availablePeriod || combo.available_period || "-");
  const reqs = getComboReqs(combo);

  const condHtml = reqs.slice(0,3).map((r,i)=>{
    const rPos = normalize(getReqField(r, ["position","pos","ポジション"], "-"));
    const rSty = normalize(getReqField(r, ["playStyle","style","プレイスタイル"], "-"));
    const rLv  = getReqField(r, ["playStyleLv","play_style_lv","lv","level","Lv","プレイスタイルLv"], null);
    const rLvR = romanLv(rLv);
    const styleShow = (rSty && rSty!=="-") ? `${esc(rSty)}${rLvR?` ${esc(rLvR)}`:""}` : "-";
    return `
      <div class="condCard">
        <div class="t">条件${i+1}</div>
        <div class="condGrid">
          <div class="k">ポジション</div><div class="v">${esc(rPos)}</div>
          <div class="k">プレイスタイル</div><div class="v">${styleShow}</div>
        </div>
      </div>
    `;
  }).join("");

  const body = `
    <div class="kv">
      <div class="k">コンボ名</div><div class="v">${esc(nm)}</div>
      <div class="k">ランク</div><div class="v">${esc(rank)}</div>
      <div class="k">ポリシー</div><div class="v">${esc(polText)}</div>
      <div class="k">効果</div><div class="v">${esc(effect)}</div>
      <div class="k">必要人数</div><div class="v">${reqNum!=null?esc(reqNum):"-"}</div>
      <div class="k">入手方法</div><div class="v">${esc(acM)}</div>
      <div class="k">入手場所</div><div class="v">${esc(acP)}</div>
      <div class="k">入手可能期間</div><div class="v">${esc(period)}</div>
    </div>
    ${condHtml}
  `;
  openModal("フォーメーションコンボ詳細", body);
}

/* compat list modal */
function openCompatList(title, players){
  const names = (players||[]).map(p=>normalize(p.name||p.player_name||"")).filter(Boolean);
  const body = names.length
    ? `<div style="font-weight:900;line-height:1.6;">${names.map(n=>`<span class="tag">${esc(n)}</span>`).join("")}</div>`
    : `<div class="note" style="margin:0;">対象なし</div>`;
  openModal(title, body);
}

/* ===== Render ===== */
function renderResult(target){
  const nm = normalize(target.name || target.player_name || "（不明）");
  const overall = toNum(target.overall);
  const maxUp   = toNum(target.maxUpgrade);
  const pol = normalize(target.policy);
  const pos = normalize(target.mainPosition);
  const sty = normalize(target.playStyle);
  const lv  = toNum(target.playStyleLv);
  const styShow = `${esc(sty||"-")}${lv!=null?` ${esc(romanLv(lv))}`:""}`;

  const rankRows = calcRankings(target);
  const combos = calcGoldCombos(target);
  const compat = calcCompat(target);

  const compatPickFull = pickOnePlayer(compat.full);
  const compatPickPol  = pickOnePlayer(compat.polDiff);
  const compatPickPos  = pickOnePlayer(compat.posDiff);
  const compatPickSty  = pickOnePlayer(compat.styleDiff);

  const out = $("resultArea");

  out.innerHTML = `
    <!-- Header summary -->
    <div class="block" style="border-color:#2e7d32;">
      <div class="hdr" style="grid-template-columns: 1fr 150px 150px;">
        <div>選手名</div><div class="center">初期総合力</div><div class="center">最大強化</div>
      </div>
      <div class="row" style="grid-template-columns: 1fr 150px 150px;">
        <div>${esc(nm)}</div>
        <div class="center">${overall!=null?esc(overall):"-"}</div>
        <div class="center">${maxUp!=null?esc(maxUp):"-"}</div>
      </div>

      <div class="hdr" style="grid-template-columns: 1fr 150px 150px;">
        <div>ポリシー</div><div class="center">ポジション</div><div class="center">プレイスタイル</div>
      </div>
      <div class="row" style="grid-template-columns: 1fr 150px 150px;">
        <div>${esc(pol||"-")}</div>
        <div class="center">${esc(pos||"-")}</div>
        <div class="center">${styShow}</div>
      </div>
    </div>

    <!-- ① Rankings -->
    <div class="block">
      <div class="hdr blue">
        <div>総合ランキング</div><div class="center">初期総合力</div><div class="center">最大強化</div>
      </div>
      ${rankRows.map(r=>{
        const left = r.labelVal ? `${esc(r.labelKey)} <span class="pill">${esc(r.labelVal)}</span>` : `${esc(r.labelKey)}`;
        return `
          <div class="row blueCols">
            <div>${left}</div>
            <div class="center">${esc(makeRankLine(r.overallRank, r.total))}</div>
            <div class="center">${esc(makeRankLine(r.maxRank, r.total))}</div>
          </div>
        `;
      }).join("")}
    </div>

    <!-- ② Combo aptitude -->
    <div class="block">
      <div class="hdr blue smallCols">
        <div>フォーメーションコンボ適性（金ランクのみ）</div>
        <div class="center">対応数</div>
        <div class="center">フォーメーションコンボ</div>
      </div>

      ${renderComboLine("完全一致", combos.full)}
      ${renderComboLine("ポリシー違い", combos.polDiff)}
      ${renderComboLine("ポジション違い", combos.posDiff)}
    </div>

    <!-- ③ Compatibility -->
    <div class="block">
      <div class="hdr blue smallCols">
        <div>互換性能選手（SP選手）</div>
        <div class="center">対象人数</div>
        <div class="center">主なSP選手</div>
      </div>

      ${renderCompatLine("完全一致", compat.full, compatPickFull, "compat_full")}
      ${renderCompatLine("ポリシー違い", compat.polDiff, compatPickPol, "compat_pol")}
      ${renderCompatLine("ポジション違い", compat.posDiff, compatPickPos, "compat_pos")}
      ${renderCompatLine("プレイスタイル違い", compat.styleDiff, compatPickSty, "compat_style")}
    </div>
  `;

  // attach combo click handlers
  out.querySelectorAll("[data-combo-id]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const cid = el.getAttribute("data-combo-id");
      const combo = COMBOS.find(c=>getComboId(c)===cid) || null;
      openComboDetail(combo);
    });
  });

  // attach compat "他◯名" handlers
  out.querySelectorAll("[data-compat-key]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      const key = el.getAttribute("data-compat-key");
      if(key==="compat_full") openCompatList("互換性能選手：完全一致", compat.full);
      if(key==="compat_pol") openCompatList("互換性能選手：ポリシー違い", compat.polDiff);
      if(key==="compat_pos") openCompatList("互換性能選手：ポジション違い", compat.posDiff);
      if(key==="compat_style") openCompatList("互換性能選手：プレイスタイル違い", compat.styleDiff);
    });
  });
}

function renderComboLine(label, combos){
  const count = combos.length;
  const names = count
    ? combos.map(c=>{
        const cid = getComboId(c);
        const nm = getComboName(c);
        return `<a href="#" class="tag tagBtn" data-combo-id="${esc(cid)}">${esc(nm)}</a>`;
      }).join("")
    : `<span class="tag" style="opacity:.6;">-</span>`;
  return `
    <div class="row smallCols">
      <div>${esc(label)}</div>
      <div class="center">${count ? `${count}個` : "-"}</div>
      <div>${names}</div>
    </div>
  `;
}

function renderCompatLine(label, list, pickInfo, compatKey){
  const count = list.length;
  let right = "-";
  if(count){
    right = esc(pickInfo.show);
    if(pickInfo.extra>0){
      right += ` <span class="pill clickPill" data-compat-key="${esc(compatKey)}">他${pickInfo.extra}名</span>`;
    }
  }
  return `
    <div class="row smallCols">
      <div>${esc(label)}</div>
      <div class="center">${count ? `${count}人` : "0人"}</div>
      <div>${right}</div>
    </div>
  `;
}

/* ===== actions ===== */
function setErr(msg){
  const el = $("err");
  if(!msg){
    el.style.display="none";
    el.textContent="";
  }else{
    el.style.display="block";
    el.textContent=msg;
  }
}

function resetAll(){
  $("fPolicy").value="";
  $("fPos").value="";
  $("fStyle").value="";
  $("fKw").value="";
  $("playerPick").innerHTML = `<option value="">（先に候補を表示してください）</option>`;
  $("resultArea").innerHTML = `<div class="note" style="margin-top:4px;">左側で候補を出して、評価したい選手を選択してください。</div>`;
  setErr("");
}

$("btnFilter").addEventListener("click", ()=>{
  setErr("");
  const { list, message } = filterCandidates();
  if(!list.length) setErr(message);
});

$("btnReset").addEventListener("click", resetAll);

$("btnEvaluate").addEventListener("click", ()=>{
  setErr("");
  const pid = normalize($("playerPick").value);
  if(!pid){
    setErr("評価対象の選手が選択されていません。（先に「候補を表示」してください）");
    return;
  }
  const p = findPlayerById(pid);
  if(!p){
    setErr("選手データが見つかりませんでした。players.json を確認してください。");
    return;
  }
  renderResult(p);
});

/* init */
(async ()=>{
  try{
    await loadData();
  }catch(e){
    setErr(String(e && e.message ? e.message : e));
  }
})();
</script>
</body>
</html>
