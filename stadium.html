<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>サカつく2026 DB - スタジアム施設一覧</title>
<style>
:root{
  --blue:#1e88ff; --blue2:#0b5bd3;
  --bg:#f6f7fb; --card:#fff; --text:#111; --muted:#666; --line:#d7dbe6;
  --shadow:0 10px 30px rgba(0,0,0,.08); --radius:18px;
  --orange:#f59e0b; --orange2:#f5b041;
}
*{box-sizing:border-box;}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 40px;}
h1{margin:18px 0 14px;font-size:40px;letter-spacing:.5px;text-align:center;}
.topLinks{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px;}
.aBtn{display:inline-flex;align-items:center;justify-content:center;
  padding:14px 18px;min-width:220px;border-radius:18px;border:3px solid #cfe0ff;
  text-decoration:none;font-weight:900;font-size:22px;color:var(--blue2);background:#fff;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px 16px;}
.sectionTitle{font-size:26px;font-weight:900;text-align:center;margin:4px 0 12px;}
.bigSelect{width:min(560px, 100%);display:block;margin:0 auto;border-radius:18px;border:3px solid #d0d5e2;
  padding:14px 16px;font-size:26px;font-weight:900;}
.bigBtn{width:min(560px, 100%);display:block;margin:16px auto 4px;padding:18px 18px;font-size:34px;
  font-weight:900;border-radius:24px;border:none;cursor:pointer;background:var(--orange);color:#fff;
  box-shadow:0 16px 26px rgba(245,158,11,.25);}
.bigBtn:active{transform:scale(.99);}
.hr{height:1px;background:#e7e2d7;margin:14px 0 16px;}
.resultTitle{text-align:center;font-size:24px;font-weight:900;margin:4px 0 12px;line-height:1.2;}
.line2{margin-top:10px;text-align:center;font-weight:900;font-size:18px;color:#111;}
.line3{margin-top:10px;text-align:center;font-weight:900;font-size:18px;color:#111;}
.line3 .muted{color:var(--muted);}

.list{display:flex;flex-direction:column;gap:14px;}
.item{border:2px solid rgba(0,0,0,.08);border-radius:22px;padding:14px 14px 12px;background:#fff;}
.name{font-size:24px;font-weight:900;text-align:center;line-height:1.25;word-break:break-word;}
.metaRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:999px;
  font-weight:900;font-size:18px;background:#eef3ff;color:#1f3b7a;border:1px solid rgba(0,0,0,.06);}
.badge.cost{background:#f3f4f6;color:#111;}
.effects{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
.effect{padding:8px 14px;border-radius:999px;border:2px solid rgba(0,0,0,.12);font-weight:900;font-size:20px;background:#fff;}
.smallMuted{text-align:center;color:var(--muted);font-weight:900;margin-top:10px;}
@media (max-width: 480px){
  h1{font-size:34px;}
  .resultTitle{font-size:20px;}
  .line2,.line3{font-size:16px;}
  .aBtn{min-width:160px;font-size:20px;padding:12px 14px;}
  .bigSelect{font-size:22px;}
  .bigBtn{font-size:30px;}
  .name{font-size:22px;}
  .badge{font-size:16px;}
  .effect{font-size:18px;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>スタジアム施設一覧</h1>

  <div class="topLinks">
    <a class="aBtn" href="index.html">検索ツールへ戻る</a>
    <a class="aBtn" href="clubhouse.html">クラブハウス編へ</a>
  </div>

  <div class="card">
    <div class="sectionTitle">効果カテゴリを選択</div>
    <select id="catSel" class="bigSelect">
<option value="満足度">満足度</option>
<option value="収入力">収入力</option>
<option value="PR力">PR力</option>
    </select>

    <button id="btnRun" class="bigBtn" type="button">一覧を表示</button>

    <div class="hr"></div>

    <div class="resultTitle">このカテゴリが上昇する施設一覧</div>

    <div id="list" class="list"></div>
    <div id="note" class="smallMuted"></div>
  </div>
</div>

<script>
const DATA_URL = "stadium_facilities.json";
let DATA = [];

function safeStr(x){ return (x===null||x===undefined) ? "" : String(x); }

function getEffects(row){
  const out = [];
  for(let i=1;i<=3;i++){
    const e = safeStr(row["effect"+i]).trim();
    const v = Number(row["effect_value"+i]);
    if(e && Number.isFinite(v) && v!==0) out.push({effect:e, value:v});
  }
  return out;
}

function hasSelectedEffect(row, selected){
  return getEffects(row).some(ev => ev.effect === selected);
}

function esc(s){
  return safeStr(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(selected){
  const list = document.getElementById("list");
  const note = document.getElementById("note");
  list.innerHTML = "";
  note.textContent = "";

  const rows = DATA.filter(r => hasSelectedEffect(r, selected));

  rows.sort((a,b)=>{
    const av = (getEffects(a).find(x=>x.effect===selected)||{value:0}).value;
    const bv = (getEffects(b).find(x=>x.effect===selected)||{value:0}).value;
    if(bv!==av) return bv-av;
    const ac = Number(a.cost)||0, bc=Number(b.cost)||0;
    if(ac!==bc) return ac-bc;
    return safeStr(a.facility_name).localeCompare(safeStr(b.facility_name), "ja");
  });

  if(!rows.length){
    note.textContent = "該当する施設がありません。";
    return;
  }

  list.innerHTML = rows.map(r=>{
    const name = esc(r.facility_name || r.name || "-");
    const cost = Number(r.cost)||0;
    const effText = (getEffects(r).length ? getEffects(r).map(ev=>`${esc(ev.effect)}+${esc(ev.value)}`).join(" / ") : "-");
    return `<div class="item">
        <div class="name">${name}</div>
        <div class="line2">カテゴリ：${esc(selected)} / 設置コスト：${cost}</div>
        <div class="line3">上昇効果：${effText}</div>
      </div>`;
  }).join("");

  note.textContent = `表示件数：${rows.length}`;
}

async function init(){
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    DATA = await res.json();
  }catch(e){
    document.getElementById("note").textContent = "データの読み込みに失敗しました。";
    return;
  }
  document.getElementById("btnRun").addEventListener("click", ()=>{
    render(document.getElementById("catSel").value);
  });
}
init();
</script>
</body>
</html>
