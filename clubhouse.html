<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラブハウス設備一覧 | サカつく2026 DB</title>
<link rel="canonical" href="https://sakatsuku2026-db.com/clubhouse.html">
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --line:#dbe3ef;
  --blue:#0b5bd3;
  --blue2:#073f98;
  --sky:#eef5ff;
  --orange:#f59e0b;
  --green:#10b981;
  --shadow:0 18px 44px rgba(15,23,42,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 12% 0%, rgba(11,91,211,.10), transparent 30%),
    radial-gradient(circle at 90% 12%, rgba(245,158,11,.12), transparent 26%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,Arial,sans-serif;
}
.wrap{max-width:1120px;margin:0 auto;padding:22px 14px 80px;}
.pageTitleImg{text-align:center;margin:4px 0 8px;}
.pageTitleImg img{max-width:100%;height:auto;width:420px;border-radius:14px;}
.hero{
  background:linear-gradient(135deg,#0b5bd3 0%,#073f98 55%,#041f4f 100%);
  color:#fff;
  border-radius:28px;
  padding:22px 18px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute;
  right:-50px;
  top:-70px;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}
h1{font-size:34px;line-height:1.18;margin:0;text-align:center;font-weight:900;letter-spacing:.01em;position:relative;z-index:1;}
.lead{margin:10px auto 0;text-align:center;max-width:760px;color:rgba(255,255,255,.88);font-size:14px;font-weight:800;line-height:1.7;position:relative;z-index:1;}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 0;position:relative;z-index:1;}
.nav a{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.14);color:#fff;font-weight:900;text-decoration:none;font-size:14px;
  backdrop-filter: blur(8px);
}
.panel{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(219,227,239,.92);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-top:16px;
}
.controlHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.sectionTitle{font-size:22px;font-weight:900;margin:0;line-height:1.3;}
.sectionSub{font-size:13px;color:var(--muted);font-weight:800;margin-top:4px;line-height:1.5;}
.controls{display:grid;grid-template-columns:minmax(220px, 360px) auto;gap:10px;align-items:end;}
.field label{display:block;font-size:13px;font-weight:900;margin:0 0 6px;color:#1e293b;}
.bigSelect{
  width:100%;font-size:16px;font-weight:900;border-radius:15px;border:2px solid #dbe3ef;
  padding:12px 14px;outline:none;background:#fff;color:var(--blue2);
  box-shadow:0 8px 18px rgba(15,23,42,.05);
}
.bigSelect:focus{border-color:rgba(11,91,211,.55);box-shadow:0 0 0 4px rgba(11,91,211,.10);}
.bigBtn{
  min-width:180px;border:none;border-radius:15px;padding:13px 18px;font-size:16px;font-weight:900;
  background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;box-shadow:0 14px 26px rgba(245,158,11,.28);cursor:pointer;
}
.noteBox{
  margin-top:12px;padding:12px 14px;border-radius:16px;background:#f8fbff;border:1px solid rgba(11,91,211,.12);
  color:#334155;font-weight:800;line-height:1.7;font-size:13px;
}
.outArea{display:none;margin-top:16px;}
.resultBar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:0 0 12px;
}
.resultTitle{font-size:20px;font-weight:900;margin:0;line-height:1.35;}
.count{display:inline-flex;align-items:center;justify-content:center;background:#eef5ff;color:var(--blue);border:1px solid rgba(11,91,211,.16);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.item{
  border:1px solid #dbe3ef;
  border-radius:22px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(15,23,42,.07);
  display:grid;
  grid-template-columns:150px 1fr;
  min-height:132px;
}
.itemImageWrap{width:150px;height:132px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.itemImage{width:100%;height:100%;object-fit:cover;display:block;}
.itemImagePlaceholder{font-size:12px;font-weight:900;color:var(--muted);text-align:center;line-height:1.45;padding:10px;}
.itemBody{min-width:0;padding:12px;display:flex;flex-direction:column;gap:8px;}
.itemTopLine{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.itemName{font-size:17px;font-weight:900;line-height:1.35;margin:0;word-break:break-word;}
.valueBadge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:6px 8px;border-radius:999px;background:#fff7ed;color:#c2410c;border:1px solid rgba(249,115,22,.22);font-size:13px;font-weight:900;}
.badges{display:flex;flex-wrap:wrap;gap:6px;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:5px 9px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:12px;font-weight:900;line-height:1.2;border:1px solid rgba(11,91,211,.14);}
.badge.gray{background:#f8fafc;color:#334155;border-color:#e2e8f0;}
.itemEff{font-size:13px;font-weight:800;line-height:1.55;margin:0;color:#111827;word-break:break-word;}
.empty{padding:26px 14px;text-align:center;border:2px dashed #dbe3ef;border-radius:18px;background:#fff;color:var(--muted);font-weight:900;grid-column:1/-1;}
#scrollTopBtn{position:fixed;right:16px;bottom:20px;width:48px;height:48px;border:none;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.25);cursor:pointer;display:none;z-index:999;}
@media (max-width:820px){.list{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.bigBtn{width:100%;}}
@media (max-width:520px){
  .wrap{padding:14px 10px 70px;}
  .pageTitleImg img{width:86%;}
  .hero{border-radius:22px;padding:18px 12px;}
  h1{font-size:26px;}
  .lead{font-size:12px;}
  .nav a{font-size:13px;padding:9px 12px;}
  .panel{padding:12px;border-radius:18px;}
  .sectionTitle{font-size:19px;}
  .bigSelect{font-size:15px;padding:11px 12px;border-radius:13px;}
  .bigBtn{font-size:15px;padding:12px 14px;border-radius:13px;}
  .resultTitle{font-size:17px;}
  .item{grid-template-columns:118px 1fr;min-height:112px;border-radius:18px;}
  .itemImageWrap{width:118px;height:112px;}
  .itemBody{padding:9px;gap:6px;}
  .itemName{font-size:14px;}
  .valueBadge{min-width:44px;font-size:12px;padding:5px 7px;}
  .badge{font-size:10px;padding:4px 7px;min-height:24px;}
  .itemEff{font-size:11px;line-height:1.45;}
}
</style>
</head>
<body>
<div class="wrap" id="pageTop">
  <div class="pageTitleImg">
    <img src="img/title.png" alt="サカつく2026 DB">
  </div>

  <header class="hero">
    <h1>クラブハウス設備一覧</h1>
    <p class="lead">効果カテゴリを選ぶと、対象設備を効果値が高い順に表示します。設置コスト・解放Lv・上昇効果をカードで確認できます。</p>
    <div class="nav">
      <a href="index.html">← 検索ツールへ戻る</a>
      <a href="clubhouse_simulation.html">設備シミュレーションへ</a>
    </div>
  </header>

  <main class="panel">
    <div class="controlHead">
      <div>
        <h2 class="sectionTitle">効果カテゴリを選択</h2>
        <div class="sectionSub">選択後、「一覧を表示」で対象設備を確認できます。</div>
      </div>
    </div>

    <div class="controls">
      <div class="field">
        <label for="selCategory">表示する効果カテゴリ</label>
        <select id="selCategory" class="bigSelect" aria-label="category select">
          <option value="DEF">DEF</option>
          <option value="DRB">DRB</option>
          <option value="PAS">PAS</option>
          <option value="PHY">PHY</option>
          <option value="SHO">SHO</option>
          <option value="SPD">SPD</option>
          <option value="ユース練習効果アップ">ユース練習効果アップ</option>
          <option value="休息">休息</option>
          <option value="怪我早期回復">怪我早期回復</option>
          <option value="怪我率ダウン">怪我率ダウン</option>
          <option value="連携値アップ">連携値アップ</option>
        </select>
      </div>
      <button id="btnShow" class="bigBtn" type="button">一覧を表示</button>
    </div>

    <div class="noteBox">
      ・選択した効果を持つクラブハウス設備を抽出します。<br>
      ・並び順は「選択効果の上昇値が高い順 → コストが低い順 → 設置可能Lvが低い順」です。
    </div>

    <div id="outArea" class="outArea">
      <div class="resultBar">
        <h2 id="resultTitle" class="resultTitle">設備一覧</h2>
        <div id="count" class="count">0件</div>
      </div>
      <div id="list" class="list"></div>
    </div>
  </main>
</div>

<button id="scrollTopBtn" type="button" aria-label="ページ上部へ戻る">▲</button>

<script>
const JSON_PATH = "club_facilities.json";
const IMAGE_BASE = "img/club_facilities/";
const IMAGE_EXTS = ["png","jpg","jpeg","webp"];

function norm(s){ return (s ?? "").toString().trim(); }
function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
function escapeHtml(str){ return String(str).replace(/[&<>\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

function effectsToString(item){
  const parts=[];
  for (let i=1;i<=3;i++) {
    const e = norm(item["effect"+i]);
    const v = item["effect_value"+i];
    if (!e || v===null || v===undefined || v==="") continue;
    parts.push(`${e}+${v}`);
  }
  return parts.join(" / ");
}
function selectedValue(item, selected){
  let sum=0;
  for (let i=1;i<=3;i++) {
    const e = norm(item["effect"+i]);
    const v = toNum(item["effect_value"+i] ?? 0);
    if (e === selected) sum += v;
  }
  return sum;
}
function createFacilityImage(facilityId, facilityName){
  const wrap = document.createElement('div');
  wrap.className = 'itemImageWrap';

  const img = document.createElement('img');
  img.className = 'itemImage';
  img.alt = facilityName;
  img.dataset.index = '0';

  const trySetSrc = (index) => {
    if (index >= IMAGE_EXTS.length) {
      wrap.innerHTML = `<div class="itemImagePlaceholder">画像準備中<br>${escapeHtml(facilityId)}</div>`;
      return;
    }
    img.dataset.index = String(index);
    img.src = `${IMAGE_BASE}${facilityId}.${IMAGE_EXTS[index]}`;
  };

  img.addEventListener('error', () => {
    const nextIndex = Number(img.dataset.index || '0') + 1;
    trySetSrc(nextIndex);
  });

  wrap.appendChild(img);
  trySetSrc(0);
  return wrap;
}

let facilities = [];
async function init(){
  try {
    const res = await fetch(JSON_PATH, {cache:"no-store"});
    facilities = await res.json();
    if (!Array.isArray(facilities)) throw new Error("JSON形式が不正です。")
    render();
  } catch (e) {
    console.error(e);
    document.getElementById("outArea").style.display = "block";
    document.getElementById("list").innerHTML = `<div class="empty">データの読み込みに失敗しました。club_facilities.json の配置を確認してください。</div>`;
    document.getElementById("count").textContent = "読み込み失敗";
  }
}
function render(){
  const sel = norm(document.getElementById("selCategory").value);
  const hit = facilities.filter(it => {
    for (let i=1;i<=3;i++) if (norm(it["effect"+i]) === sel) return true;
    return false;
  });

  hit.sort((a,b)=> {
    const av = selectedValue(a, sel);
    const bv = selectedValue(b, sel);
    if (bv !== av) return bv-av;
    const ac = toNum(a.cost ?? 0);
    const bc = toNum(b.cost ?? 0);
    if (ac !== bc) return ac-bc;
    const ai = Number(String(a.install_level ?? '').replace(/[^0-9.-]/g, '')) || 0;
    const bi = Number(String(b.install_level ?? '').replace(/[^0-9.-]/g, '')) || 0;
    if (ai !== bi) return ai-bi;
    return norm(a.facility_name).localeCompare(norm(b.facility_name), "ja");
  });

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!hit.length) {
    list.innerHTML = `<div class="empty">「${escapeHtml(sel)}」が上昇する設備は見つかりませんでした。</div>`;
  }

  hit.forEach(it => {
    const div = document.createElement("div");
    div.className = "item";

    const name = norm(it.facility_name);
    const facilityId = norm(it.facility_id);
    const cat = norm(it.category);
    const cost = it.cost ?? "-";
    const installLevel = it.install_level ?? "-";
    const eff = effectsToString(it);
    const selectedPoint = selectedValue(it, sel);

    const image = createFacilityImage(facilityId, name);
    const body = document.createElement('div');
    body.className = 'itemBody';
    body.innerHTML = `
      <div class="itemTopLine">
        <h3 class="itemName">${escapeHtml(name || "設備名未設定")}</h3>
        <span class="valueBadge">+${escapeHtml(selectedPoint)}</span>
      </div>
      <div class="badges">
        <span class="badge">${escapeHtml(cat || "カテゴリ未設定")}</span>
        <span class="badge gray">コスト ${escapeHtml(cost)}</span>
        <span class="badge gray">Lv ${escapeHtml(installLevel)}</span>
      </div>
      <p class="itemEff">上昇効果：${escapeHtml(eff || "-")}</p>
    `;

    div.appendChild(image);
    div.appendChild(body);
    list.appendChild(div);
  });

  document.getElementById("resultTitle").textContent = `「${sel}」が上昇する設備一覧`;
  document.getElementById("count").textContent = `${hit.length}件表示`;
  document.getElementById("outArea").style.display = "block";
}

document.getElementById("btnShow").addEventListener("click", render);
document.getElementById("selCategory").addEventListener("change", render);

const scrollBtn = document.getElementById("scrollTopBtn");
window.addEventListener("scroll", () => { scrollBtn.style.display = window.scrollY > 220 ? "block" : "none"; });
scrollBtn.addEventListener("click", () => { window.scrollTo({ top:0, behavior:"smooth" }); });
init();
</script>
</body>
</html>
