<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クラブハウス設備一覧 | サカつく2026 DB</title>
<link rel="canonical" href="https://sakatsuku2026-db.com/clubhouse.html">
<style>
:root{
  --bg:#f2f4f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:rgba(17,24,39,.12);
  --shadow:0 18px 50px rgba(0,0,0,.10);
  --radius:24px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,Arial,sans-serif;}
.wrap{max-width:980px;margin:0 auto;padding:26px 16px 40px;}
h1{font-size:42px;line-height:1.1;margin:10px 0 10px;text-align:center;font-weight:900;letter-spacing:.02em;}
.nav{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 18px;}
.nav a{display:inline-block;padding:14px 22px;border-radius:22px;border:3px solid #bcd2ff;background:#fff;color:#0b5bd3;font-weight:900;text-decoration:none;font-size:22px;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;border:1px solid var(--border);}
.sectionTitle{font-size:34px;font-weight:900;text-align:center;margin:8px 0 12px;}
.bigSelect{width:min(720px,100%);font-size:30px;font-weight:900;border-radius:20px;border:3px solid rgba(17,24,39,.18);padding:18px 16px;outline:none;background:#e9e9e9;color:#0b5bd3;}
.bigBtn{width:min(720px,100%);display:block;margin:16px auto 0;border:none;border-radius:28px;padding:22px 18px;font-size:38px;font-weight:900;background:#f59e0b;color:#fff;box-shadow:0 20px 40px rgba(245,158,11,.30);}
.hr{height:2px;background:rgba(17,24,39,.10);margin:18px 0;}
.resultTitle{font-size:28px;font-weight:900;text-align:center;margin:10px 0 14px;}
/* list cards */
.list{display:grid;gap:14px;}
.item{border:2px solid rgba(17,24,39,.10);border-radius:24px;padding:18px 14px;background:#fff;}
.itemName{font-size:34px;font-weight:900;text-align:center;margin:0 0 10px;word-break:break-word;}
.itemMeta{font-size:22px;font-weight:900;text-align:center;margin:0 0 10px;color:#111827;}
.itemEff{font-size:22px;font-weight:900;text-align:center;margin:0;word-break:break-word;}
.count{text-align:center;color:var(--muted);font-weight:900;margin-top:10px;font-size:20px;}
@media (max-width:520px){
  h1{font-size:40px;}
  .nav a{font-size:22px;}
  .sectionTitle{font-size:34px;}
  .bigSelect{font-size:28px;}
  .bigBtn{font-size:40px;}
  .resultTitle{font-size:24px;}
  .itemName{font-size:30px;}
  .itemMeta,.itemEff{font-size:20px;}
}

/* ===== 施設/設備 一覧表示：見やすさ重視（横スクロール無し） ===== */
h1{
  font-size:36px;
  line-height:1.15;
  letter-spacing:.01em;
}

.resultTitle{
  font-size:18px !important;
  line-height:1.25 !important;
  margin:10px 0 12px !important;
}

.list{ gap:12px; }

.item{
  padding:14px 12px !important;
  border-radius:22px;
}

.itemName{
  font-size:22px !important;
  line-height:1.25 !important;
  margin:0 0 8px !important;
  letter-spacing:.01em;
}

.itemMeta{
  font-size:14px !important;
  font-weight:800 !important;
  line-height:1.35 !important;
  margin:0 0 6px !important;
  white-space:normal !important;    /* 折り返しOK */
  overflow:visible !important;      /* 行内スクロール禁止 */
}

.itemEff{
  font-size:14px !important;
  font-weight:800 !important;
  line-height:1.35 !important;
  margin:0 !important;
  white-space:normal !important;    /* 折り返しOK */
  overflow:visible !important;      /* 行内スクロール禁止 */
  word-break:keep-all;              /* 日本語/英数混在でも過剰分割を抑える */
}

.count{
  font-size:13px !important;
  font-weight:800 !important;
  margin-top:10px !important;
}

@media (max-width:520px){
  h1{ font-size:30px; }
  .sectionTitle{ font-size:26px; }
  .bigSelect{ font-size:22px; padding:14px 14px; border-radius:18px; }
  .bigBtn{ font-size:26px; padding:16px 16px; border-radius:22px; }
  .resultTitle{ font-size:16px !important; }
  .itemName{ font-size:20px !important; }
  .itemMeta,.itemEff{ font-size:13px !important; }
}

/* ===== タイトル画像 ===== */
.pageTitleImg{
  text-align:center;
  margin:10px 0 6px;
}
.pageTitleImg img{
  max-width:100%;
  height:auto;
  width:420px;      /* PC表示サイズ */
}
@media (max-width:520px){
  .pageTitleImg img{
    width:85%;
  }
}

</style>
</head>
<body>
<div class="wrap">

<div class="pageTitleImg">
  <img src="img/title.png" alt="サカつく2026 DB">
</div>

  <h1>クラブハウス設備一覧</h1>

  <div class="nav">
    <a href="index.html">検索ツールへ戻る</a>
    <a href="stadium.html">スタジアム編へ</a>
  </div>

  <div class="card">
    <div class="sectionTitle">効果カテゴリを選択</div>
    <div style="text-align:center;">
      <select id="selCategory" class="bigSelect" aria-label="category select">
      <option value="DEF">DEF</option>
      <option value="DRB">DRB</option>
      <option value="PAS">PAS</option>
      <option value="PHY">PHY</option>
      <option value="SHO">SHO</option>
      <option value="SPD">SPD</option>
      <option value="ユース練習効果アップ">ユース練習効果アップ</option>
      <option value="休息">休息</option>
      <option value="怪我早期回復">怪我早期回復</option>
      <option value="怪我率ダウン">怪我率ダウン</option>
      <option value="連携値アップ">連携値アップ</option>
      </select>
    </div>
    <button id="btnShow" class="bigBtn" type="button">一覧を表示</button>

    <div class="hr"></div>

    <div id="outArea" style="display:none;">
      <div class="resultTitle">このカテゴリが上昇する設備一覧</div>
      <div id="list" class="list"></div>
      <div id="count" class="count"></div>
    </div>
  </div>
</div>

<script>
const JSON_PATH = "club_facilities.json";
function norm(s){
  return (s ?? "").toString().trim();
}
function effectsToString(item){
  const parts=[];
  for (let i=1;i<=3;i++) {
    const e = norm(item["effect"+i]);
    const v = item["effect_value"+i];
    if (!e || v===null || v===undefined || v==="") continue;
    parts.push(`${e}+${v}`);
  }
  return parts.join(" / ");
}
function selectedValue(item, selected){
  // return the total value contributed to selected category (for sorting)
  let sum=0;
  for (let i=1;i<=3;i++) {
    const e = norm(item["effect"+i]);
    const v = Number(item["effect_value"+i] ?? 0);
    if (e === selected) sum += v;
  }
  return sum;
}

let facilities = [];
async function init(){
  try {
    const res = await fetch(JSON_PATH, {cache:"no-store"});
    facilities = await res.json();
  } catch (e) {
    console.error(e);
    alert("データの読み込みに失敗しました。JSONファイルの配置を確認してください。");
    return;
  }
}

function render(){
  const sel = norm(document.getElementById("selCategory").value);
  const hit = facilities.filter(it => {
    for (let i=1;i<=3;i++) {
      if (norm(it["effect"+i]) === sel) return true;
    }
    return false;
  });
  hit.sort((a,b)=> {
    const av = selectedValue(a, sel);
    const bv = selectedValue(b, sel);
    if (bv !== av) return bv-av;
    const ac = Number(a.cost ?? 0);
    const bc = Number(b.cost ?? 0);
    if (ac !== bc) return ac-bc;
    return norm(a.facility_name).localeCompare(norm(b.facility_name), "ja");
  });

  const list = document.getElementById("list");
  list.innerHTML = "";
  hit.forEach(it => {
    const div = document.createElement("div");
    div.className = "item";
    const name = norm(it.facility_name);
    const cat = norm(it.category); // ★ここが修正点：選択カテゴリではなく施設/設備のcategory列
    const cost = it.cost ?? "";
    const eff = effectsToString(it);

    div.innerHTML = `
      <div class="itemName">${name}</div>
      <div class="itemMeta">カテゴリ：${cat} / 設置コスト：${cost}</div>
      <div class="itemEff">上昇効果：${eff || "-"}</div>
    `;
    list.appendChild(div);
  });
  document.getElementById("count").textContent = `表示件数：${hit.length}`;
  document.getElementById("outArea").style.display = "block";
}

document.getElementById("btnShow").addEventListener("click", render);
init();
</script>
</body>
</html>
