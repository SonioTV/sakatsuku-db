<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>サカつく2026 検索ツール</title>
  <style>
    :root{
      --blue:#1e88e5;
      --blue2:#1976d2;
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111;
      --muted:#666;
      --line:#e6e6e6;
      --shadow:0 10px 24px rgba(0,0,0,.08);
      --radius:18px;
      --orange:#ff9800;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    }
    .wrap{ max-width: 980px; margin:0 auto; padding: 18px 14px 90px; }
    h1{ margin: 10px 0 6px; font-size: 30px; letter-spacing:.02em; text-align:center; }
    .tabs{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 14px 0 18px;
    }
    .tabbtn{
      border:1px solid var(--line);
      background:#e0e0e0;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 18px;
      font-weight: 800;
      color: var(--blue);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
    }
    .tabbtn.active{
      background: linear-gradient(180deg, #3b7bdc, #1f5fc4);
      color:#fff;
      border-color: transparent;
      box-shadow: var(--shadow);
    }
    .panel{ display:none; }
    .panel.active{ display:block; }

    .center{ text-align:center; }
    .note{
      font-size: 14px;
      color: var(--muted);
      margin: 8px 0 12px;
      line-height: 1.5;
    }

    .cta{
      display:inline-block;
      border:0;
      background: var(--orange);
      color:#fff;
      font-size: 22px;
      font-weight: 900;
      padding: 16px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 22px rgba(255,152,0,.25);
    }
    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,.05);
      margin: 14px 0;
    }
    .card.green{ border-left: 8px solid #2e7d32; background: #eaf6ea; }
    .card.blue{ border-left: 8px solid #1565c0; }
    .kv{
      display:grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 14px;
      align-items:start;
    }
    .k{ font-weight: 900; }
    .v{ color:#111; }

    /* ---- タイル共通 ---- */
    .tileboard{ display:flex; gap: 12px; justify-content:center; flex-wrap:wrap; margin: 10px 0 8px; }
    .tile{
      user-select:none;
      border:2px solid #bdbdbd;
      background:#eee;
      border-radius: 18px;
      width: 92px;
      height: 92px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(0,0,0,.08);
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, filter .12s ease;
    }
    .tile:active{ transform: scale(.98); }
    .tile.active{
      border-color:#111;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      filter: saturate(1.1);
    }

    .gold{ background: linear-gradient(180deg,#fff6b3,#d7b94a); }
    .silver{ background: linear-gradient(180deg,#ffffff,#cfcfcf); }
    .bronze{ background: linear-gradient(180deg,#ffe0c2,#c87b33); }

    select{
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 18px;
      border:1px solid var(--line);
      background:#efefef;
      color: var(--blue2);
      font-weight: 900;
      outline:none;
    }

    .list{
      display:flex; flex-direction:column; gap: 12px;
      margin-top: 14px;
    }
    .player-item{
      background:#fff;
      border:1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 6px 14px rgba(0,0,0,.05);
      line-height:1.5;
    }
    .player-item a{
      font-weight: 900;
      color: var(--blue2);
      text-decoration: underline;
      cursor:pointer;
    }

    /* ---- おまけ：ランキング ---- */
    .section-title{
      font-size: 22px;
      font-weight: 900;
      margin: 10px 0 8px;
    }
    table.rank{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius: 14px;
      background:#fff;
      box-shadow: 0 8px 18px rgba(0,0,0,.05);
    }
    table.rank th, table.rank td{
      padding: 10px 10px;
      border-bottom:1px solid var(--line);
      font-size: 15px;
    }
    table.rank th{
      background:#f2f2f2;
      text-align:left;
      font-weight:900;
    }
    table.rank tr:last-child td{ border-bottom:0; }
    .col-r{ width:52px; }
    .col-v{ width:92px; text-align:right; font-variant-numeric: tabular-nums; }
    .col-p{ width:70px; text-align:center; }

    .filters{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 10px 0 12px;
    }
    .filters .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btnline{
      display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight:900;
      font-size: 16px;
    }
    .btn.primary{
      border:0;
      background: var(--blue2);
      color:#fff;
      box-shadow: 0 10px 20px rgba(25,118,210,.18);
    }

    /* ---- 割合バー ---- */
    .barlist{ display:flex; flex-direction:column; gap: 12px; margin: 8px 0 0; }
    .barrow{
      display:grid;
      grid-template-columns: 170px 160px 70px;
      align-items:center;
      gap: 10px;
    }
    .barlabel{
      font-weight:900;
      white-space:nowrap; /* 折り返し防止 */
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .barbg{
      height: 14px;
      border-radius: 999px;
      background:#e6e6e6;
      overflow:hidden;
      position:relative;
    }
    .barfill{
      height: 100%;
      width: 0%;
      background: #4a90e2;
      border-radius: 999px;
    }
    .barpct{
      text-align:right;
      font-weight:900;
      font-variant-numeric: tabular-nums;
    }

    /* ---- 詳細モーダル ---- */
    .modal-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-backdrop.show{ display:flex; }
    .modal{
      width: min(720px, 100%);
      background:#fff;
      border-radius: 18px;
      padding: 14px 14px 16px;
      box-shadow: 0 18px 36px rgba(0,0,0,.25);
      max-height: 82vh;
      overflow:auto;
    }
    .modal .head{
      display:flex; align-items:center; justify-content:space-between; gap: 10px;
      border-bottom:1px solid var(--line);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .modal .title{ font-weight: 1000; font-size: 18px; }
    .modal .close{
      border:0; background:#eee; border-radius: 12px;
      padding: 10px 12px; font-weight:900;
    }
    .modal .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .pill{
      display:inline-block;
      padding: 6px 10px;
      background:#f1f1f1;
      border-radius: 999px;
      font-weight:900;
      font-size: 13px;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    /* ---- 右下トップへ ---- */
    #toTop{
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border:0;
      background: rgba(25,118,210,.9);
      color:#fff;
      box-shadow: 0 14px 26px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 22px;
      font-weight: 900;
      cursor:pointer;
      opacity:0;
      transform: translateY(10px);
      transition: opacity .25s ease, transform .25s ease;
      z-index: 999;
    }
    #toTop.show{ opacity:1; transform: translateY(0); }

    /* ===== スマホ調整 ===== */
    @media (max-width: 480px){
      .wrap{ padding: 14px 12px 90px; }
      h1{ font-size: 28px; }
      .tabs{ gap: 10px; }
      .tabbtn{ font-size: 16px; padding: 12px 10px; }
      .tile{ width: 86px; height: 86px; border-radius: 18px; font-size: 24px; }
      select{ font-size: 18px; }
      .cta{ font-size: 22px; padding: 16px 26px; border-radius: 18px; }
      .kv{ grid-template-columns: 1fr; gap: 8px 0; }
      .barrow{ grid-template-columns: 160px 130px 64px; }
      table.rank th, table.rank td{ font-size: 14px; padding: 9px 8px; }
      .col-v{ width: 84px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>サカつく2026 検索ツール</h1>

    <div class="tabs">
      <button class="tabbtn active" data-tab="combo">コンボ検索</button>
      <button class="tabbtn" data-tab="players">選手検索</button>
      <button class="tabbtn" data-tab="bonus">おまけ</button>
    </div>

    <!-- ===== コンボ検索 ===== -->
    <section id="panel-combo" class="panel active">
      <div class="center">
        <div style="font-size:18px;font-weight:900;margin:6px 0 12px;">フォーメーションコンボ検索</div>
        <button id="btnComboShow" class="cta">検索</button>
      </div>

      <div id="comboCard" class="card green" style="display:none;"></div>
      <div id="comboErr" class="note center" style="display:none;color:#b00020;font-weight:900;"></div>
    </section>

    <!-- ===== 選手検索 ===== -->
    <section id="panel-players" class="panel">
      <div class="center" style="font-size:18px;font-weight:900;margin:6px 0 2px;">コンボから選手を探す</div>

      <div class="center">
        <div style="font-size:22px;font-weight:1000;margin:10px 0 6px;">ランクを選択（複数可）</div>
        <div class="tileboard" id="rankTiles">
          <div class="tile gold" data-rank="金">金</div>
          <div class="tile silver" data-rank="銀">銀</div>
          <div class="tile bronze" data-rank="銅">銅</div>
        </div>
        <div class="note">※未選択の場合は「すべて」を表示します</div>
      </div>

      <div class="center" style="margin-top:10px;">
        <div style="font-size:22px;font-weight:1000;margin:10px 0 6px;">フォーメーションコンボを選択</div>
        <select id="comboSelect"></select>
      </div>

      <div class="center" style="margin-top:16px;">
        <button id="btnShowPlayers" class="cta" style="padding: 16px 46px;">対応選手を表示</button>
      </div>

      <div class="note center" style="margin-top:12px;">
        ※選手名横は（入手方法：入手場所）<br/>
        ※表示される選手はSP選手のみです
      </div>

      <div id="selectedComboCard" class="card green" style="display:none;"></div>
      <div id="playersOut" class="list"></div>
    </section>

    <!-- ===== おまけ ===== -->
    <section id="panel-bonus" class="panel">
      <div class="card">
        <div class="section-title">ランキング</div>

        <div class="section-title">① 初期総合力 TOP10</div>
        <div id="rankOverall"></div>

        <div class="section-title" style="margin-top:16px;">② 最大強化 TOP10</div>
        <div id="rankMax"></div>

        <div class="section-title" style="margin-top:18px;">複合フィルターランキング TOP5</div>
        <div class="filters">
          <div class="row">
            <select id="fPolicy"></select>
            <select id="fPos"></select>
          </div>
          <div class="row">
            <select id="fStyle"></select>
            <select id="fMetric"></select>
          </div>
          <div class="btnline">
            <button id="btnApplyFilter" class="btn primary">表示</button>
            <button id="btnResetFilter" class="btn">リセット</button>
          </div>
        </div>
        <div id="rankFiltered"></div>

        <div class="section-title" style="margin-top:18px;">SP選手の割合</div>

        <div class="section-title" style="font-size:18px;margin-top:10px;">① ポリシー割合</div>
        <div id="sharePolicy" class="barlist"></div>

        <div class="section-title" style="font-size:18px;margin-top:10px;">② プレイスタイル割合</div>
        <div id="shareStyle" class="barlist"></div>

        <div class="section-title" style="font-size:18px;margin-top:10px;">③ メインポジション割合</div>
        <div id="sharePos" class="barlist"></div>
      </div>
    </section>
  </div>

  <!-- モーダル -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="head">
        <div class="title" id="modalTitle">選手詳細</div>
        <button class="close" id="modalClose">閉じる</button>
      </div>
      <div id="modalBody" class="grid"></div>
    </div>
  </div>

  <button id="toTop" aria-label="ページトップへ">▲</button>

<script>
(() => {
  // ========= 状態 =========
  let PLAYERS = [];
  let PLAYERS_BY_ID = new Map();
  let COMBOS = [];
  let selectedRanks = new Set(); // 金/銀/銅

  // 表示順（名前順固定）
  const POLICY_ORDER = ["ムービング","ポゼッション","リアクション","カウンター"];
  const STYLE_ORDER = ["ストライカー","ラインブレーカー","ポストプレーヤー","サイドアタッカー","ドリブラー","アタッカー","パサー","セントラルMF","ハードマーカー","ストッパー","組立CB","攻撃的FB","守備的FB","オーソドックスGK","スイーパーGK"];
  const POS_ORDER = ["CF","RW","LW","AM","RM","LM","DM","CB","RB","LB","GK"];

  // ========= ユーティリティ =========
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];
  const esc = (s) => (s ?? "").toString()
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

  const toInt = (v) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  };

  function romanLv(lv){
    const n = toInt(lv);
    if(n === 1) return "Ⅰ";
    if(n === 2) return "Ⅱ";
    if(n === 3) return "Ⅲ";
    return "";
  }

  // combos.json の揺れに対応して正規化
  function normCombo(raw){
    const c = raw || {};
    const id = c.id ?? c.comboId ?? c.code ?? c.key ?? c.name ?? crypto.randomUUID();
    const name = c.name ?? c.comboName ?? c.title ?? "";
    const formation = c.formation ?? c.formationCode ?? c.formationName ?? c.formation_id ?? "";
    const rank = c.rank ?? c.rarity ?? c.grade ?? "";
    const effect = c.effect ?? c.desc ?? c.description ?? "";
    const policy = c.policy ?? c.comboPolicy ?? "";
    const requiredCount = c.requiredCount ?? c.requiredPlayers ?? c.required ?? c.need ?? null;

    // 条件：conditions / requirements / slots など
    const conds = c.conditions ?? c.requirements ?? c.slots ?? c.rules ?? [];
    const conditions = Array.isArray(conds) ? conds.map((x) => ({
      position: x.position ?? x.pos ?? x.mainPosition ?? "",
      playStyle: x.playStyle ?? x.style ?? x.playstyle ?? "",
      lv: x.lv ?? x.level ?? x.minLv ?? null,
      policy: x.policy ?? x.requiredPolicy ?? policy ?? ""
    })) : [];

    return { id, name, formation, rank, effect, policy, requiredCount, conditions };
  }

  // ========= データロード =========
  async function fetchJsonFirst(urls){
    for(const u of urls){
      try{
        const r = await fetch(u, {cache:"no-store"});
        if(!r.ok) continue;
        return await r.json();
      }catch(e){}
    }
    return null;
  }

  async function loadData(){
    const players = await fetchJsonFirst(["players.json","players_generated.json"]);
    if(Array.isArray(players)){
      PLAYERS = players;
      PLAYERS_BY_ID = new Map(PLAYERS.map(p => [String(p.playerId ?? p.id ?? p.player_id ?? ""), p]));
    }else{
      PLAYERS = [];
    }

    const combos = await fetchJsonFirst(["combos.json"]);
    if(Array.isArray(combos)){
      COMBOS = combos.map(normCombo).filter(c => c.name);
    }else{
      COMBOS = [];
    }

    // UI 初期化
    initComboTab();
    initPlayersTab();
    initBonusTab();
  }

  // ========= タブ =========
  function setTab(name){
    $$(".tabbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    $("#panel-combo").classList.toggle("active", name === "combo");
    $("#panel-players").classList.toggle("active", name === "players");
    $("#panel-bonus").classList.toggle("active", name === "bonus");
    window.scrollTo({top:0, behavior:"smooth"});
  }
  $$(".tabbtn").forEach(btn => btn.addEventListener("click", () => setTab(btn.dataset.tab)));

  // ========= コンボ検索（タブ1） =========
  function initComboTab(){
    $("#btnComboShow").addEventListener("click", () => {
      if(COMBOS.length === 0){
        $("#comboErr").textContent = "combos.json が見つかりません。";
        $("#comboErr").style.display = "block";
        $("#comboCard").style.display = "none";
        return;
      }
      // ひとまず「全コンボ」ではなく先頭を表示（正式データ確認用）
      renderComboCard($("#comboCard"), COMBOS[0]);
      $("#comboCard").style.display = "block";
      $("#comboErr").style.display = "none";
    });
  }

  function renderComboCard(el, combo){
    const c = combo;
    const need = c.requiredCount ? `${esc(c.requiredCount)}人` : "";
    const condLines = (c.conditions || []).map((x) => {
      const lv = x.lv ? `Lv${esc(x.lv)}以上` : "";
      const pol = x.policy ? ` / ポリシー：${esc(x.policy)}` : "";
      return `ポジション：${esc(x.position)} / プレイスタイル：${esc(x.playStyle)}${lv ? " " + lv : ""}${pol}`;
    });

    el.innerHTML = `
      <div style="font-size:20px;font-weight:1000;margin-bottom:10px;">${esc(c.name)}</div>
      <div class="kv">
        <div class="k">フォーメーション</div><div class="v">${esc(c.formation)}</div>
        <div class="k">ランク</div><div class="v">${esc(c.rank)}</div>
        <div class="k">効果</div><div class="v">${esc(c.effect)}</div>
        <div class="k">ポリシー</div><div class="v">${esc(c.policy)}</div>
        <div class="k">必要人数</div><div class="v">${need}</div>
      </div>
      ${condLines.length ? `<div style="margin-top:10px;font-weight:1000;">※不足条件※</div>
        <div style="margin-top:6px;line-height:1.6;">${condLines.map(esc).join("<br/>")}</div>` : ""}
    `;
  }

  // ========= 選手検索（タブ2） =========
  function initPlayersTab(){
    // rank tiles
    $("#rankTiles").addEventListener("click", (e) => {
      const t = e.target.closest(".tile");
      if(!t) return;
      const rank = t.dataset.rank;
      if(selectedRanks.has(rank)){
        selectedRanks.delete(rank);
        t.classList.remove("active");
      }else{
        selectedRanks.add(rank);
        t.classList.add("active");
      }
      populateComboSelect();
    });

    $("#btnShowPlayers").addEventListener("click", () => {
      const id = $("#comboSelect").value;
      const combo = COMBOS.find(c => String(c.id) === String(id));
      if(!combo){
        $("#playersOut").innerHTML = `<div class="note center" style="color:#b00020;font-weight:900;">コンボを選択してください。</div>`;
        $("#selectedComboCard").style.display = "none";
        return;
      }
      renderComboCard($("#selectedComboCard"), combo);
      $("#selectedComboCard").style.display = "block";
      renderPlayersForCombo(combo);
    });

    populateComboSelect();
  }

  function populateComboSelect(){
    const sel = $("#comboSelect");
    sel.innerHTML = "";

    if(COMBOS.length === 0){
      sel.innerHTML = `<option value="">combos.json が見つかりません</option>`;
      sel.disabled = true;
      return;
    }
    sel.disabled = false;

    const ranks = [...selectedRanks];
    const list = ranks.length ? COMBOS.filter(c => ranks.includes(String(c.rank))) : COMBOS;

    // 表示テキストは「formation | name (rank)」に寄せる
    for(const c of list){
      const opt = document.createElement("option");
      opt.value = String(c.id);
      opt.textContent = `${c.formation} ｜ ${c.name}（${c.rank}）`;
      sel.appendChild(opt);
    }
  }

  function playerMatchesCondition(p, cond){
    const posOk = String(p.mainPosition ?? "") === String(cond.position ?? "");
    const styleOk = String(p.playStyle ?? "") === String(cond.playStyle ?? "");
    const lv = toInt(p.lv);
    const needLv = toInt(cond.lv);
    const lvOk = (needLv == null) ? true : (lv != null && lv >= needLv);

    // ポリシー一致は「完全一致」のときだけ使う
    const policyOk = String(p.policy ?? "") === String(cond.policy ?? "");
    return {posOk, styleOk, lvOk, policyOk};
  }

  function renderPlayersForCombo(combo){
    const out = $("#playersOut");
    out.innerHTML = "";

    if(PLAYERS.length === 0){
      out.innerHTML = `<div class="note center" style="color:#b00020;font-weight:900;">players.json が見つかりません。</div>`;
      return;
    }

    // 条件ごとに「完全一致」と「ポリシー違い」
    const blocks = (combo.conditions && combo.conditions.length) ? combo.conditions : [];
    if(blocks.length === 0){
      out.innerHTML = `<div class="note center">このコンボの条件情報がありません（combos.json を確認してください）。</div>`;
      return;
    }

    blocks.forEach((cond, idx) => {
      const matches = PLAYERS
        .map(p => ({p, m: playerMatchesCondition(p, cond)}))
        .filter(x => x.m.posOk && x.m.styleOk && x.m.lvOk);

      const exact = matches.filter(x => x.m.policyOk).map(x => x.p);
      const policyDiff = matches.filter(x => !x.m.policyOk).map(x => x.p);

      const condText = `ポジション：${esc(cond.position)} / プレイスタイル：${esc(cond.playStyle)}${cond.lv ? " Lv"+esc(cond.lv)+"以上" : ""} / ポリシー：${esc(cond.policy || combo.policy || "")}`;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div style="font-size:18px;font-weight:1000;margin-bottom:8px;">条件${idx+1}</div>
        <div class="note" style="margin:0 0 10px;color:#333;font-weight:900;">${condText}</div>

        <div class="card blue" style="padding:12px;margin:10px 0;">
          <div style="font-weight:1000;margin-bottom:6px;">完全一致（${exact.length}人）</div>
          ${exact.length ? exact.map(p => renderPlayerLine(p)).join("") : "<div>なし</div>"}
        </div>

        <div class="card blue" style="padding:12px;margin:0;">
          <div style="font-weight:1000;margin-bottom:6px;">ポリシー違い（${policyDiff.length}人）</div>
          ${policyDiff.length ? policyDiff.map(p => renderPlayerLine(p)).join("") : "<div>なし</div>"}
        </div>
      `;
      out.appendChild(card);
    });

    // クリックでモーダル
    out.querySelectorAll("a[data-pid]").forEach(a => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const pid = a.dataset.pid;
        const p = PLAYERS.find(x => String(x.playerId) === String(pid));
        if(p) openPlayerModal(p);
      });
    });
  }

  function renderPlayerLine(p){
    const method = (p.acquisitionMethod ?? "").trim();
    const place  = (p.acquisitionLocation ?? "").trim();
    const suffix = method || place ? `（${esc(method)}：${esc(place)}）` : "";
    return `<div class="player-item"><a href="#" data-pid="${esc(p.playerId)}">${esc(p.name)}</a> ${suffix}</div>`;
  }

  // ========= おまけ（タブ3） =========
  function initBonusTab(){
    // セレクト初期化
    const polSel = $("#fPolicy");
    const posSel = $("#fPos");
    const styleSel = $("#fStyle");
    const metricSel = $("#fMetric");

    function fillSelect(sel, label, list){
      sel.innerHTML = "";
      const opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = label;
      sel.appendChild(opt0);
      list.forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
    }
    fillSelect(polSel, "ポリシー（任意）", POLICY_ORDER);
    fillSelect(posSel, "メインポジション（任意）", POS_ORDER);
    fillSelect(styleSel, "プレイスタイル（任意）", STYLE_ORDER);

    metricSel.innerHTML = `
      <option value="overall">初期総合力</option>
      <option value="maxUpgrade">最大強化</option>
    `;

    // 初期ランキング
    $("#rankOverall").innerHTML = buildRankTable(getTopN(PLAYERS, "overall", 10), "overall");
    $("#rankMax").innerHTML = buildRankTable(getTopN(PLAYERS, "maxUpgrade", 10), "maxUpgrade");
    $("#rankFiltered").innerHTML = buildRankTable(getTopN(PLAYERS, "overall", 5), "overall");

    $("#btnApplyFilter").addEventListener("click", () => applyFilteredRank());
    $("#btnResetFilter").addEventListener("click", () => {
      polSel.value = "";
      posSel.value = "";
      styleSel.value = "";
      metricSel.value = "overall";
      applyFilteredRank();
    });

    // 割合表示（指定順で固定）
    renderShares("#sharePolicy", POLICY_ORDER, p => p.policy);
    renderShares("#shareStyle", STYLE_ORDER, p => p.playStyle);
    renderShares("#sharePos", POS_ORDER, p => p.mainPosition);
  }

  function getTopN(list, field, n){
    // 数値が空の場合は除外
    const items = list
      .map(p => ({p, v: toInt(p[field])}))
      .filter(x => x.v != null)
      .sort((a,b) => b.v - a.v)
      .slice(0, n)
      .map(x => x.p);
    return items;
  }

  function buildRankTable(players, metric){
    const label = (metric === "maxUpgrade") ? "最大強化" : "初期総合力";
    const rows = players.map((p, i) => `
      <tr>
        <td class="col-r">${i+1}</td>
        <td>${esc(p.name)}</td>
        <td class="col-v">${esc(p[metric])}</td>
        <td class="col-p">${esc(p.mainPosition)}</td>
      </tr>
    `).join("");

    return `
      <table class="rank">
        <thead>
          <tr>
            <th class="col-r">順位</th>
            <th>選手名</th>
            <th class="col-v">${label}</th>
            <th class="col-p">Pos</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="4">該当なし</td></tr>`}
        </tbody>
      </table>
    `;
  }

  function applyFilteredRank(){
    const pol = $("#fPolicy").value;
    const pos = $("#fPos").value;
    const style = $("#fStyle").value;
    const metric = $("#fMetric").value;

    let list = PLAYERS.slice();
    if(pol) list = list.filter(p => String(p.policy) === pol);
    if(pos) list = list.filter(p => String(p.mainPosition) === pos);
    if(style) list = list.filter(p => String(p.playStyle) === style);

    $("#rankFiltered").innerHTML = buildRankTable(getTopN(list, metric, 5), metric);
  }

  function renderShares(containerSel, orderList, keyFn){
    const cont = $(containerSel);
    cont.innerHTML = "";
    const total = PLAYERS.length || 1;

    // 集計
    const counts = new Map();
    PLAYERS.forEach(p => {
      const k = String(keyFn(p) ?? "");
      if(!k) return;
      counts.set(k, (counts.get(k) || 0) + 1);
    });

    orderList.forEach(name => {
      const c = counts.get(name) || 0;
      const pct = Math.round((c / total) * 1000) / 10; // 0.1%
      const row = document.createElement("div");
      row.className = "barrow";
      row.innerHTML = `
        <div class="barlabel" title="${esc(name)}">${esc(name)}</div>
        <div class="barbg"><div class="barfill" style="width:${pct}%;"></div></div>
        <div class="barpct">${pct}%</div>
      `;
      cont.appendChild(row);
    });
  }

  // ========= モーダル =========
  function openPlayerModal(p){
    $("#modalTitle").textContent = p.name || "選手詳細";

    const ap = (p.availabilityPeriod ?? "").trim();
    const ov = toInt(p.overall);
    const mu = toInt(p.maxUpgrade);
    const ovText = (ov != null && mu != null) ? `${ov}（最大強化：${mu}）` :
                   (ov != null) ? String(ov) :
                   (mu != null) ? `最大強化：${mu}` : "";

    const style = (p.playStyle ?? "").trim();
    const lvRoman = romanLv(p.lv);
    const styleText = style ? `${style} ${lvRoman}`.trim() : "";

    const items = [
      ["入手可能期間", ap],
      ["選手名", p.name],
      ["初期総合力（最大強化）", ovText],
      ["ポリシー", p.policy],
      ["プレイスタイル", styleText],
      ["メインポジション", p.mainPosition],
      ["メインスキル", p.mainSkill],
      ["メイン特徴", p.mainTrait],
    ].filter(x => x[1]);

    $("#modalBody").innerHTML = items.map(([k,v]) => `
      <div class="card" style="margin:0;padding:12px;">
        <div style="font-weight:1000;margin-bottom:6px;">${esc(k)}</div>
        <div style="line-height:1.6;">${esc(v)}</div>
      </div>
    `).join("");

    $("#modalBackdrop").classList.add("show");
  }
  function closeModal(){
    $("#modalBackdrop").classList.remove("show");
  }
  $("#modalClose").addEventListener("click", closeModal);
  $("#modalBackdrop").addEventListener("click", (e) => {
    if(e.target.id === "modalBackdrop") closeModal();
  });

  // ========= トップへボタン =========
  const toTopBtn = $("#toTop");
  function onScroll(){
    if(window.scrollY > 420) toTopBtn.classList.add("show");
    else toTopBtn.classList.remove("show");
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
  toTopBtn.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

  // ========= 起動 =========
  loadData();

})();
</script>
</body>
</html>
