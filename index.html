<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サカつく2026 検索ツール</title>

<style>
body{
  font-family: "Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  margin:0;
  background:#f7f7f7;
}

h2{text-align:center}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}

.tab-btn{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ddd;
  font-weight:700;
  cursor:pointer;
}

.tab-btn.active{background:#4a90e2;color:#fff}

.tab{
  display:none;
  max-width:900px;
  margin:0 auto;
  padding:10px;
}

.tab.active{display:block}

/* 結果 */
.result-card{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin:10px 0;
  font-size:0.85em;
}

.kv{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:6px 10px;
}

.k{font-weight:700}

/* ボタン */
.btn-main{
  font-size:1.3em;
  padding:15px 30px;
  border:none;
  border-radius:14px;
  background:#ff9800;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* ランク */
.rank-board{
  display:grid;
  grid-template-columns:repeat(3,80px);
  gap:12px;
  justify-content:center;
}

.rank-tile{
  width:80px;
  height:80px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  cursor:pointer;
  border:2px solid #999;
}

.rank-gold{background:#ffd700}
.rank-silver{background:#c0c0c0}
.rank-bronze{background:#cd7f32}

/* モーダル */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal.open{display:flex}

.modal-box{
  background:#fff;
  width:min(600px,100%);
  border-radius:16px;
  padding:15px;
  max-height:85vh;
  overflow:auto;
}

.modal-close{
  float:right;
  font-size:24px;
  border:none;
  background:none;
  cursor:pointer;
}

.player-link{
  color:#1565c0;
  cursor:pointer;
  text-decoration:underline;
}

/* トップ */
#scrollTopBtn{
  position:fixed;
  right:20px;
  bottom:70px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:none;
  background:#4a90e2;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.3s;
  z-index:9999;
}

#scrollTopBtn.show{
  opacity:1;
  transform:none;
  pointer-events:auto;
}

/* スマホ */
@media(max-width:480px){
  .result-card{font-size:11px;line-height:1.5}
  .kv{grid-template-columns:1fr}
  .k{margin-top:6px}
}
</style>
</head>

<body>

<h2>サカつく2026 検索ツール</h2>

<div class="tabs">
  <button class="tab-btn active" data-tab="t1">コンボ検索</button>
  <button class="tab-btn" data-tab="t2">選手検索</button>
</div>

<!-- タブ1 -->
<div id="t1" class="tab active">

  <p style="text-align:center">フォーメーションコンボ検索</p>

  <div style="text-align:center">
    <button class="btn-main" onclick="dummySearch()">検索</button>
  </div>

  <div id="result1"></div>
</div>

<!-- タブ2 -->
<div id="t2" class="tab">

  <p style="text-align:center">コンボから選手を探す</p>

  <div class="rank-board">
    <div class="rank-tile rank-gold" data-r="金">金</div>
    <div class="rank-tile rank-silver" data-r="銀">銀</div>
    <div class="rank-tile rank-bronze" data-r="銅">銅</div>
  </div>

  <div style="text-align:center;margin:15px">
    <select id="comboSelect" style="font-size:1.2em">
      <option>テストコンボ</option>
    </select>
  </div>

  <div style="text-align:center">
    <button class="btn-main" onclick="showPlayers()">対応選手を表示</button>
  </div>

  <p style="text-align:center;font-size:0.9em">
    ※選手名横は（入手方法：入手場所）<br>
    ※表示される選手はSP選手のみです
  </p>

  <div id="comboPlayers"></div>
</div>

<!-- モーダル -->
<div id="playerModal" class="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- トップ -->
<button id="scrollTopBtn">▲</button>

<script>
/* ダミーデータ */
const players=[
  {
    playerId:"P001",
    name:"テスト太郎",
    overall:85,
    maxUpgrade:95,
    policy:"ポゼッション",
    playStyle:"パサー",
    lv:2,
    mainPosition:"AM",
    mainSkill:"パス◎",
    mainTrait:"司令塔",
    period:"2026/01-2026/03",
    obtainMethod:"ガチャ",
    obtainPlace:"限定"
  }
];

/* タブ */
document.querySelectorAll(".tab-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.tab).classList.add("active");
  };
});

/* ダミー検索 */
function dummySearch(){
  const r=document.getElementById("result1");
  r.innerHTML=`
    <div class="result-card">
      <div class="kv">
        <div class="k">名称</div><div>テストコンボ</div>
        <div class="k">効果</div><div>能力UP</div>
      </div>
    </div>`;
}

/* 選手表示 */
function showPlayers(){
  const box=document.getElementById("comboPlayers");
  box.innerHTML = players.map(p=>
    `<div class="result-card">
      <span class="player-link" onclick="openModal('${p.playerId}')">
      ${p.name}</span>（${p.obtainMethod}：${p.obtainPlace}）
    </div>`
  ).join("");
}

/* モーダル */
function roman(n){
  return ["Ⅰ","Ⅱ","Ⅲ"][n-1]||"";
}

function openModal(id){
  const p=players.find(x=>x.playerId===id);
  if(!p)return;

  document.getElementById("modalTitle").textContent=p.name;
  document.getElementById("modalBody").innerHTML=`
    <div class="kv">
      <div class="k">入手期間</div><div>${p.period||"-"}</div>
      <div class="k">総合力</div><div>${p.overall}（${p.maxUpgrade}）</div>
      <div class="k">ポリシー</div><div>${p.policy}</div>
      <div class="k">プレイスタイル</div><div>${p.playStyle} ${roman(p.lv)}</div>
      <div class="k">メイン位置</div><div>${p.mainPosition}</div>
      <div class="k">スキル</div><div>${p.mainSkill}</div>
      <div class="k">特徴</div><div>${p.mainTrait}</div>
    </div>`;

  document.getElementById("playerModal").classList.add("open");
}

function closeModal(){
  document.getElementById("playerModal").classList.remove("open");
}

/* トップ */
const btn=document.getElementById("scrollTopBtn");

function toggleTop(){
  if(window.scrollY>300)btn.classList.add("show");
  else btn.classList.remove("show");
}

window.addEventListener("scroll",toggleTop,{passive:true});

btn.onclick=()=>{
  window.scrollTo({top:0,behavior:"smooth"});
};
</script>

</body>
</html>
