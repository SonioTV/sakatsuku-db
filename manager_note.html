.card{background:var(--card);border:1px solid #e5eaf1;border-radius:22px;box-shadow:var(--shadow);padding:16px}.controls{margin-bottom:14px}.controlGrid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(150px,1fr) minmax(150px,1fr) minmax(170px,1.1fr) auto;gap:10px;align-items:end}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;font-weight:900;color:#334155}.field input,.field select{width:100%;height:46px;border:2px solid #dce3ec;border-radius:13px;background:#fff;padding:0 12px;font:inherit;font-size:15px;font-weight:800;color:#111827;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,95,128,.10)}.reset{height:46px;border:0;border-radius:13px;background:#9aa0aa;color:#fff;padding:0 16px;font-weight:900;cursor:pointer}.largeChips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 1px}.largeChip{white-space:nowrap;border:1px solid #d6dee9;background:#fff;color:#334155;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.largeChip.active{background:var(--blue);border-color:var(--blue);color:#fff}.resultBar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid #e5eaf1}.resultCount{font-size:13px;color:#475569;font-weight:900}.searchNote{font-size:11px;color:#94a3b8;font-weight:700}

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"サカつく2026 監督ノート","url":"https://sakatsuku2026-db.com/manager_note.html","description":"サカつく2026のゲーム内マニュアル『監督ノート』を分類・全文検索できるページ。"}</script>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="index.html">← TOPへ</a><a class="topLink" href="howto.html">サイトの使い方</a></div>
  <h1>監督ノート</h1>
  <p class="lead">ゲーム内で確認できる「監督ノート」を、大分類・中分類・小分類で整理。育成・試合・編成などの仕様をキーワードでも検索できます。</p>
  <div class="statRow" id="stats"><span class="stat">読み込み中...</span></div>

  <section class="card controls" aria-label="監督ノート検索">
    <div class="controlGrid">
      <div class="field searchField"><label for="search">キーワード検索</label><input id="search" type="search" placeholder="例：疲労、期限付き移籍、ポジション適正" autocomplete="off"></div>
      <div class="field"><label for="largeSelect">大分類</label><select id="largeSelect"><option value="">すべて</option></select></div>
      <div class="field"><label for="middleSelect">中分類</label><select id="middleSelect"><option value="">すべて</option></select></div>
      <div class="field"><label for="smallSelect">小分類</label><select id="smallSelect"><option value="">すべて</option></select></div>
      <button id="reset" class="reset" type="button">クリア</button>
    </div>
    <div class="largeChips" id="largeChips" aria-label="大分類クイック選択"></div>
    <div class="resultBar"><span class="resultCount" id="resultCount">読み込み中...</span><span class="searchNote">分類名・本文を対象に検索します</span></div>
  </section>

  <div class="layout">
    <aside class="card toc" aria-label="表示中の目次"><h2 class="tocTitle">目次</h2><div class="tocList" id="toc"></div></aside>
    <main class="content" id="content"><div class="empty">監督ノートを読み込んでいます...</div></main>
  </div>

  <div class="infoBox"><strong>データについて：</strong>ゲーム内「監督ノート」のスクリーンショット156枚（2026年9月9日確認）をもとに、スクロール撮影による連続した重複文章を1つに統合して掲載しています。ゲーム内表記を優先しています。アップデートによりゲーム内仕様が変更された場合は、最新のゲーム内表示を優先してください。</div>
</div>
<button id="toTop" class="toTop" type="button" aria-label="ページ上部へ">↑</button>
<script>
(()=>{
  'use strict';
  const DATA_URL='manager_note.json';
  const $=s=>document.querySelector(s);
  const search=$('#search'), largeSelect=$('#largeSelect'), middleSelect=$('#middleSelect'), smallSelect=$('#smallSelect');
  const content=$('#content'), toc=$('#toc'), count=$('#resultCount'), chips=$('#largeChips'), stats=$('#stats');
  let items=[], meta=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
  const params=new URLSearchParams(location.search);

  function highlight(text,q){
    const safe=esc(text); if(!q) return safe;
    const words=q.trim().split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);
    if(!words.length) return safe;
    const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
    return safe.replace(re,'<mark class="hit">$1</mark>');
  }
  function bodyHtml(body,q){
    return String(body||'').split(/\n\n+/).map(p=>`<p>${highlight(p,q).replace(/\n/g,'<br>')}</p>`).join('');
  }
  function populateLarge(){
    const large=[...new Set(items.map(x=>x.largeCategory))];
    largeSelect.innerHTML='<option value="">すべて</option>'+large.map(v=>`<option>${esc(v)}</option>`).join('');
    chips.innerHTML=['',...large].map(v=>`<button type="button" class="largeChip" data-large="${esc(v)}">${v?esc(v):'すべて'}</button>`).join('');
    chips.addEventListener('click',e=>{const b=e.target.closest('.largeChip');if(!b)return;largeSelect.value=b.dataset.large;populateMiddle();populateSmall();render();});
  }
  function populateMiddle(){
    const l=largeSelect.value;
    const mids=[...new Set(items.filter(x=>!l||x.largeCategory===l).map(x=>x.middleCategory))];
    const old=middleSelect.value;
    middleSelect.innerHTML='<option value="">すべて</option>'+mids.map(v=>`<option>${esc(v)}</option>`).join('');
    if(mids.includes(old)) middleSelect.value=old;
  }
  function populateSmall(){
    const l=largeSelect.value, m=middleSelect.value;
    const candidates=items.filter(x=>(!l||x.largeCategory===l)&&(!m||x.middleCategory===m));
    const old=smallSelect.value;
    smallSelect.innerHTML='<option value="">すべて</option>'+candidates.map(x=>{
      const label=(m?'':x.middleCategory+'｜')+x.smallNo+'. '+x.smallCategory;
      return `<option value="${esc(x.id)}">${esc(label)}</option>`;
    }).join('');
    if(candidates.some(x=>x.id===old)) smallSelect.value=old;
  }
  function updateUrl(){
    const p=new URLSearchParams();
    if(search.value.trim())p.set('q',search.value.trim());
    if(largeSelect.value)p.set('large',largeSelect.value);
    if(middleSelect.value)p.set('middle',middleSelect.value);
    if(smallSelect.value)p.set('small',smallSelect.value);
    history.replaceState(null,'',location.pathname+(p.toString()?'?'+p:'')+location.hash);
  }
  function render(){
    const q=search.value.trim(), nq=norm(q), l=largeSelect.value, m=middleSelect.value, s=smallSelect.value;
    document.querySelectorAll('.largeChip').forEach(b=>b.classList.toggle('active',b.dataset.large===l));
    let filtered=items.filter(x=>{
      if(l&&x.largeCategory!==l)return false;
      if(m&&x.middleCategory!==m)return false;
      if(s&&x.id!==s)return false;
      if(!nq)return true;
      const hay=norm([x.largeCategory,x.middleCategory,x.smallCategory,x.body].join(' '));
      return nq.split(' ').every(w=>hay.includes(w));
    });
    count.textContent=`${filtered.length} / ${items.length}項目を表示`;
    if(!filtered.length){content.innerHTML='<div class="empty">条件に一致する項目がありません。検索語または分類を変更してください。</div>';toc.innerHTML='';updateUrl();return;}

    const groups=[]; const map=new Map();
    filtered.forEach(x=>{const key=x.largeCategory+'\u0000'+x.middleCategory;if(!map.has(key)){const g={large:x.largeCategory,middle:x.middleCategory,items:[]};map.set(key,g);groups.push(g);}map.get(key).items.push(x);});
    content.innerHTML=groups.map(g=>{
      const gid='g-'+g.items[0].id;
      return `<section class="group" id="${gid}"><div class="groupHead"><span class="largeBadge">${esc(g.large)}</span><h2>${highlight(g.middle,q)}</h2></div><div class="manualList">${g.items.map(x=>`<article class="manualItem" id="${x.id}"><details ${q?'open':''}><summary><span class="num">${x.smallNo}</span><span class="smallTitle">${highlight(x.smallCategory,q)}</span><span class="chev">▼</span></summary><div class="body">${bodyHtml(x.body,q)}<div class="source">元スクショ：${x.sourceScreens.map(n=>String(n).padStart(3,'0')).join(' / ')}</div></div></details></article>`).join('')}</div></section>`;
    }).join('');

    toc.innerHTML=groups.map(g=>`<div class="tocGroup"><div class="tocMiddle">${esc(g.large)}｜${esc(g.middle)}</div>${g.items.map(x=>`<a class="tocLink" href="#${x.id}">${x.smallNo}. ${esc(x.smallCategory)}</a>`).join('')}</div>`).join('');
    updateUrl();
  }
  async function init(){
    try{
      const r=await fetch(DATA_URL,{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
      meta=await r.json(); items=meta.items||[];
      stats.innerHTML=(meta.largeCategoryStats||[]).map(x=>`<span class="stat">${esc(x.name)} ${x.itemCount}項目</span>`).join('')+`<span class="stat">全${items.length}項目</span>`;
      populateLarge();
      largeSelect.value=params.get('large')||'';
      if(![...largeSelect.options].some(o=>o.value===largeSelect.value))largeSelect.value='';
      populateMiddle();
      middleSelect.value=params.get('middle')||'';
      if(![...middleSelect.options].some(o=>o.value===middleSelect.value))middleSelect.value='';
      populateSmall();
      smallSelect.value=params.get('small')||'';
      if(![...smallSelect.options].some(o=>o.value===smallSelect.value))smallSelect.value='';
      search.value=params.get('q')||'';
      render();
      if(location.hash){setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView(),50);}
    }catch(err){content.innerHTML=`<div class="empty">監督ノートの読み込みに失敗しました。<br><small>${esc(err.message)}</small></div>`;count.textContent='読み込みエラー';stats.innerHTML='<span class="stat">データ読み込みエラー</span>';}
  }
  let timer; search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,120)});
  largeSelect.addEventListener('change',()=>{populateMiddle();populateSmall();render()}); middleSelect.addEventListener('change',()=>{populateSmall();render()}); smallSelect.addEventListener('change',render);
  $('#reset').addEventListener('click',()=>{search.value='';largeSelect.value='';populateMiddle();middleSelect.value='';populateSmall();smallSelect.value='';render();search.focus()});
  const top=$('#toTop');addEventListener('scroll',()=>top.classList.toggle('show',scrollY>500),{passive:true});top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
  init();
})();
</script>
</body>
